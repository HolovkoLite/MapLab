            <p><b>Google Sites</b>: pubblica prima il file su GitHub Pages, poi nel Sito scegli <i>Inserisci → Incorpora → Per URL</i> e incolla l'indirizzo della mappa. Evita di incollare il codice HTML: con file grandi Sites potrebbe rifiutarlo.</p>
            <p><b>Classroom o Drive</b>: puoi anche condividere il file: gli studenti lo scaricano e lo aprono nel browser.</p>
          </details>
        </div>
        <div data-pane="img" class="ed-expimg">
          <div class="ed-expopts">
            <div class="field"><span class="label">Parte della carta</span>${expSeg('region', [['all', 'Tutta la carta'], ['view', 'Inquadratura attuale']])}</div>
            ${tlOn ? `<div class="field"><span class="label">Elementi</span>${expSeg('elems', [['all', 'Tutti'], ['tl', 'Solo anno ' + esc(fmtYear(fromAstro(tl.state.year), docUsesBC(E.doc)))]])}</div>` : ''}
            <div class="field"><span class="label">Contenuto</span>
              <label class="check"><input type="checkbox" data-x="title" checked> Titolo e autore</label>
              <label class="check"><input type="checkbox" data-x="legend" checked> Legenda</label>
              <label class="check"><input type="checkbox" data-x="pinNames" checked> Nomi accanto alle puntine</label>
              <label class="check"><input type="checkbox" data-x="texts" checked> Scritte sulla carta e nomi delle aree</label>
              <span class="hint">Senza nomi e scritte ottieni una <b>carta muta</b>, utile per esercizi e verifiche.</span></div>
            <div class="field" data-only="png"><span class="label">Risoluzione</span>${expSeg('res', [['2000', 'Normale'], ['4000', 'Alta']])}
              <span class="hint">Alta: per stampe grandi o per ingrandire. Il file è più pesante.</span></div>
          </div>
          <div class="ed-expprev"><img alt="Anteprima dell'esportazione" hidden><span class="muted" data-prevmsg>Preparo l'anteprima…</span></div>
        </div>
      </div>
      <div class="dlg-foot">
        <button class="btn btn-ghost left" type="button" data-close>Chiudi</button>
        <button class="btn" type="button" data-go>${ui('download', 16)}<span data-golabel>Esporta</span></button>
      </div></div>`, 'wide ed-expdlg');
    function expSeg(key, opts) {
      return `<div class="ed-seg" role="group">${opts.map(([v, l]) => `<button type="button" data-xseg="${key}" data-v="${v}" aria-pressed="${String(X[key]) === v}">${l}</button>`).join('')}</div>`;
    }
    const go = d.querySelector('[data-go]');
    const img = d.querySelector('.ed-expprev img'), msg = d.querySelector('[data-prevmsg]');
    function renderOpts(width) {
      const W = E.doc.map.w, H = E.doc.map.h;
      const region = X.region === 'view' ? { x0: cur.x0 * W, y0: cur.y0 * H, x1: cur.x1 * W, y1: cur.y1 * H } : null;
      const rw = region ? region.x1 - region.x0 : W;
      let w = width;
      // Non ingrandisco la carta molto oltre la sua risoluzione reale.
      if (E.doc.map.kind !== 'svg') w = Math.min(w, Math.max(1200, Math.round(rw * 1.5)));
      return {
        region: region, width: w, title: X.title, legend: X.legend, pinNames: X.pinNames, texts: X.texts,
        visible: X.elems === 'tl' ? (it => view._visibleState(it)) : null
      };
    }
    let prevTok = 0, prevT = 0;
    function preview() {
      clearTimeout(prevT);
      prevT = setTimeout(async () => {
        const tok = ++prevTok;
        msg.hidden = false; msg.textContent = 'Preparo l\'anteprima…';
        try {
          const c = await MapLabRender.render(E.doc, E.assets, renderOpts(900));
          if (tok !== prevTok) return;
          img.src = c.toDataURL('image/jpeg', 0.85);
          img.hidden = false; msg.hidden = true;
        } catch (e) { if (tok === prevTok) msg.textContent = 'Anteprima non disponibile.'; }
      }, 120);
    }
    function paint() {
      d.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === X.kind)));
      d.querySelector('[data-pane="html"]').hidden = X.kind !== 'html';
      d.querySelector('[data-pane="img"]').hidden = X.kind === 'html';
      d.querySelectorAll('[data-only="png"]').forEach(el => { el.hidden = X.kind !== 'png'; });
      d.querySelectorAll('[data-xseg]').forEach(b => b.setAttribute('aria-pressed', String(String(X[b.dataset.xseg]) === b.dataset.v)));
      d.querySelector('[data-golabel]').textContent = X.kind === 'html' ? 'Esporta HTML' : X.kind === 'png' ? 'Esporta PNG' : 'Esporta PDF';
      if (X.kind !== 'html') preview();
    }
    d.addEventListener('click', e => {
      const k = e.target.closest('[data-kind]');
      if (k) { X.kind = k.dataset.kind; paint(); return; }
      const sg = e.target.closest('[data-xseg]');
      if (sg) { const key = sg.dataset.xseg; X[key] = key === 'res' ? Number(sg.dataset.v) : sg.dataset.v; paint(); }
    });
    d.addEventListener('change', e => {
      const c = e.target.closest('[data-x]');
      if (c) { X[c.dataset.x] = c.checked; preview(); }
    });
    d.querySelector('[data-close]').onclick = () => d.close();
    go.onclick = async () => {
      if (X.kind === 'html') {
        if (!E.doc.title.trim()) toast('Consiglio: dai un titolo alla mappa (scheda "Mappa").');
        const name = baseName() + '.html';
        downloadBlob(name, new Blob([buildExportHtml()], { type: 'text/html' }));
        afterExport(name);
        d.close();
        toast('Mappa esportata: trovi ' + name + ' nella cartella dei download.', 'ok');
        return;
      }
      go.disabled = true;
      const lab = d.querySelector('[data-golabel]');
      const old = lab.textContent;
      lab.textContent = 'Preparo…';
      try {
        const c = await MapLabRender.render(E.doc, E.assets, renderOpts(X.kind === 'pdf' ? 3000 : X.res));
        const blob = X.kind === 'pdf' ? await MapLabRender.toPdf(c) : await MapLabRender.toPng(c);
        const name = baseName() + (X.kind === 'pdf' ? '.pdf' : '.png');
        downloadBlob(name, blob);
        toast((X.kind === 'pdf' ? 'PDF' : 'Immagine') + ' esportato: ' + name + ' (' + fmtBytes(blob.size) + ').', 'ok');
        d.close();
      } catch (e) {
        toast('Esportazione non riuscita: prova con una risoluzione più bassa.', 'err');
        go.disabled = false; lab.textContent = old;
      }
    };
    d.showModal();
    paint();
  }

  function previewFlow() {
    if (!E.doc) return;
    const url = URL.createObjectURL(new Blob([buildExportHtml()], { type: 'text/html' }));
    const d = makeDialog(`<div class="dlg-in ed-prev">
      <div class="ed-prev-bar">
        <b>Anteprima</b><span class="muted">così la vedranno gli studenti</span>
        <span class="spacer"></span>
        <div class="ed-seg" role="group" aria-label="Dispositivo">
          <button type="button" data-w="100%" aria-pressed="true">Computer</button>
          <button type="button" data-w="820px" aria-pressed="false">Tablet</button>
          <button type="button" data-w="390px" aria-pressed="false">Smartphone</button>

  // =============== Schermata iniziale ===============
  async function showStart() {
    const st = $('#edStart');
    st.hidden = false;
    let draft = null;
    try { draft = await DB.get('doc'); } catch (e) { /* nessuna bozza */ }
    // La bozza serve solo se l'ultima volta la mappa non era stata esportata:
    // altrimenti la elimino per liberare spazio nel browser.
    if (draft && !(draft.dirty && draft.doc && draft.doc.map)) { await clearDraft(); draft = null; }
    const hasDraft = !!draft;
    st.innerHTML = `<div class="ed-start-card">
      <div class="ed-start-brand"><svg class="ed-start-logo" width="64" height="64" viewBox="0 0 1000 1000" aria-hidden="true"><rect width="1000" height="1000" rx="220" fill="#2c5a66"/><g fill="#e8efee">${LOGO_MARK}</g></svg><div><h1>MapLab</h1><p>Carte interattive per la tua classe: puntine, percorsi, territori, linea del tempo, visita guidata e ripasso.</p></div></div>
      ${hasDraft ? `<div class="ed-resume">
        <button class="ed-bigbtn primary" type="button" data-act="resume">
          ${ui('restart', 28)}<span><b>Riprendi il lavoro</b><small>${esc(draft.doc.title || 'Mappa senza titolo')} · ${esc(new Date(draft.savedAt).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))} · modifiche non esportate</small></span></button>
        <button class="btn btn-danger-ghost ed-resume-del" type="button" data-act="draft-delete" title="Elimina la bozza dal browser">${ui('trash', 16)}<span>Elimina</span></button>
      </div>` : ''}
      <div class="ed-start-row">
        <button class="ed-bigbtn ${hasDraft ? '' : 'primary'}" type="button" data-act="new">${ui('plus', 28)}<span><b>Nuova mappa</b><small>Parti da un'immagine o da un SVG</small></span></button>
        <button class="ed-bigbtn" type="button" data-act="open">${ui('folder', 28)}<span><b>Apri una mappa</b><small>Un file HTML esportato con MapLab</small></span></button>
      </div>
      <p class="ed-start-tip">Suggerimento: puoi anche trascinare qui un'immagine o un file di MapLab.</p>
    </div>`;
  }
  async function clearDraft() {
    try { await DB.del(['doc', 'assets', 'handle']); } catch (e) { /* niente */ }
    savedAssetsVer = -1;
  }
  async function deleteDraftFlow() {
    const ok = await confirmBox('La bozza verrà eliminata da questo browser e le modifiche non esportate andranno perse. Non si può annullare.', { title: 'Eliminare la bozza?', ok: 'Elimina', danger: true });
    if (!ok) return;
    await clearDraft();
    toast('Bozza eliminata.', 'ok');
    showStart();
  }
  async function resumeDraft() {
    try {
      const d = await DB.get('doc');
      const a = await DB.get('assets');
      if (!d || !a) throw new Error();
      loadDoc(d.doc, a, { fileName: d.fileName || '' });
      E.dirty = !!d.dirty;
      savedAssetsVer = E.assetsVer;
      updateStatus();
    } catch (e) {
      toast('Non riesco a recuperare la bozza.', 'err');
    }
  }

  // Trascinare file sulla pagina.
  document.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types).indexOf('Files') !== -1) e.preventDefault(); });
  document.addEventListener('drop', async e => {
    if (e.target.closest && e.target.closest('dialog')) return;
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    if (/\.html?$/i.test(f.name) || f.type === 'text/html') { openFlow(f); return; }
    if (/^image\//.test(f.type) || /\.svg$/i.test(f.name)) {
      if (!E.doc) {
        let built;
        try { built = await importMapSource(f, f.name); } catch (ex) { toast(ex.message, 'err'); return; }
        if (!built) return;
        const doc = emptyDoc();
        doc.map = built.map;
        loadDoc(doc, { tiles: built.tiles, svg: built.svg, images: {} }, {});
        E.dirty = true; E.tab = 'map'; renderPanel(); updateStatus(); saveDraftSoon(true);
      } else {
        toast('Per cambiare la carta usa "Sostituisci la carta" nella scheda Mappa. Per le immagini delle puntine usa il modulo della puntina.');
      }
    }
  });

  // =============== Strumenti e disegno ===============
  function setTool(t) {
    if (!E.doc) return;
    if (E.drawing && E.drawing.type !== t) cancelDrawing();
    E.tool = t;
    view.el.classList.toggle('tool-draw', t !== 'select');
    renderTools();
    renderBanner();
    view.render();
  }
  function renderTools() {
    document.querySelectorAll('.ed-tool').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === E.tool)));
  }
  function renderBanner() {
    const t = E.tool;
    const dr = E.drawing;
    let html = '';
    if (t === 'pin') html = `<span>${ui('pin', 16)}Clicca sulla carta per mettere una puntina.</span><button class="btn btn-sm" type="button" data-act="tool-done">Fine</button>`;
    else if (t === 'label') html = `<span>${ui('text', 16)}Clicca dove vuoi scrivere un nome sulla carta.</span><button class="btn btn-sm" type="button" data-act="tool-done">Fine</button>`;
    else if (t === 'arrow') {
      const n = dr ? dr.points.length : 0;
      html = `<span>${ui('arrow', 16)}${n === 0 ? 'Clicca il <b>punto di partenza</b> del percorso.' : n === 1 ? 'Clicca il punto successivo (o l\'arrivo).' : 'Aggiungi altri punti oppure termina con <b>doppio clic</b> o <b>Invio</b>.'}</span>
        ${n >= 2 ? `<button class="btn btn-sm" type="button" data-act="draw-finish">Fine (${n} punti)</button>` : ''}
        <button class="btn btn-sm btn-ghost" type="button" data-act="draw-cancel">${n ? 'Annulla' : 'Chiudi'}</button>`;
    } else if (t === 'area') {
      const n = dr ? dr.points.length : 0;
      html = `<span>${ui('area', 16)}${n < 3 ? 'Clicca i punti del confine, uno dopo l\'altro.' : 'Continua, oppure <b>clicca il primo punto</b> o premi <b>Invio</b> per chiudere l\'area.'}</span>
        ${n >= 3 ? `<button class="btn btn-sm" type="button" data-act="draw-finish">Chiudi l'area (${n} punti)</button>` : ''}
        <button class="btn btn-sm btn-ghost" type="button" data-act="draw-cancel">${n ? 'Annulla' : 'Chiudi'}</button>`;
    }
    bannerEl.hidden = !html || !E.doc;
    bannerEl.innerHTML = html;
  }
  function cancelDrawing() {
    E.drawing = null;
    renderBanner();
    view.render();
  }
  function finishDrawing() {
    const dr = E.drawing;
    if (!dr) return;
    const min = dr.type === 'area' ? 3 : 2;
    if (dr.points.length < min) { toast(dr.type === 'area' ? 'Un\'area ha bisogno di almeno 3 punti.' : 'Una freccia ha bisogno di almeno 2 punti.'); return; }
    const it = dr.type === 'area' ? newArea(dr.points) : newArrow(dr.points);
    E.drawing = null;
    E.doc.items.push(it);
    commit();
    E.tool = 'select';
    view.el.classList.remove('tool-draw');
    select(it.id, { focusField: 'title' });
    renderTools();
    renderBanner();
    refreshData();
  }
  function newArrow(points) {
    return { id: newId(), type: 'arrow', points: points, title: '', text: '', color: '#b23a2e', width: 'medium', dash: 'solid', heads: 'end', curved: true, bend: 0.15, legend: true };
  }
  function nextAreaColor() {
    const used = E.doc.items.filter(it => it.type === 'area').map(it => it.color);
    const order = ['#c9a227', '#2a8a86', '#9c3d78', '#4f8a3c', '#d4762a', '#5b4a9e', '#2c5a7c', '#b23a2e'];
    return order.find(c => used.indexOf(c) === -1) || order[used.length % order.length];
  }
  function newArea(points) {
    return { id: newId(), type: 'area', points: points, title: '', text: '', color: nextAreaColor(), opacity: 0.35, fill: 'solid', border: 'solid', curved: true, showName: true, legend: true };
  }
  function newPin(w) {
    const [x, y] = norm(w);
    const cat = E.lastCat && catById(E.doc, E.lastCat) ? E.lastCat : (E.doc.categories[0] ? E.doc.categories[0].id : '');
    return { id: newId(), type: 'pin', x: x, y: y, title: '', text: '', categoryId: cat, color: null };
  }
  function newLabel(w) {
    const [x, y] = norm(w);
    const st = LABEL_STYLES[E.lastLabelStyle] ? E.lastLabelStyle : 'state';
    const size = clamp(view.labelSizeFor(20), 0.004, 0.08);
    return { id: newId(), type: 'label', x: x, y: y, text: '', style: st, color: LABEL_STYLES[st].color, size: +size.toFixed(4), rotate: 0 };
  }

  function onTap(hit, w, e) {
    if (!E.doc) return;
    if (!w) { if (hit && hit.kind === 'item') select(hit.id, { center: true, reveal: true }); return; }
    const t = E.tool;
    if (t === 'arrow' || t === 'area') {
      if (!inBounds(w)) return;
      if (!E.drawing) E.drawing = { type: t, points: [] };
      const pts = E.drawing.points;
      if (t === 'area' && pts.length >= 3) {
        const f = view.toScreen(pts[0][0] * view.W, pts[0][1] * view.H), c = view.toScreen(w.x, w.y);
        if (Math.hypot(f.x - c.x, f.y - c.y) < 14) { finishDrawing(); return; }
      }
      pts.push(norm(w));
      renderBanner();
      view.render();
      return;
    }
    if (hit && hit.kind === 'item') { select(hit.id, { reveal: true }); return; }
    if (hit && (hit.kind === 'vertex' || hit.kind === 'mid')) return;
    if (t === 'pin' && inBounds(w)) {
      const p = newPin(w);
      E.doc.items.push(p);
      commit();
      refreshData();
      select(p.id, { focusField: 'title' });
      return;
    }
    if (t === 'label' && inBounds(w)) {
      const l = newLabel(w);
      E.doc.items.push(l);
      commit();
      refreshData();
      select(l.id, { focusField: 'text' });
      return;
    }
    select(null);
  }
  function onDoubleTap(hit, w, e) {
    if (!E.doc) return;
    if (E.drawing) { finishDrawing(); return; }
    if (hit && hit.kind === 'vertex') {
      const it = selItem();
      if (!it) return;
      const min = it.type === 'area' ? 3 : 2;
      if (it.points.length <= min) { toast(`Servono almeno ${min} punti.`); return; }
      it.points.splice(hit.index, 1);
      commit();
      refreshData();
      return;
    }
    if (hit && hit.kind === 'item') { const it = E.doc.items.find(x => x.id === hit.id); if (it) view.focusItem(it, true); return; }
    if (E.tool === 'select' && w) { const p = view.toScreen(w.x, w.y); view.zoomAt(1.8, p.x, p.y, true); }
  }
  function onHover(w) {
    E.hover = w;
    if (E.drawing) view.render();
  }
  function onDragStart(hit, w) {
    if (!E.doc || E.drawing) return false;
    if (!hit) return false;
    if (hit.kind === 'vertex' || hit.kind === 'mid') {
      const it = selItem();
      if (!it) return false;
      let idx = hit.index;
      if (hit.kind === 'mid') { it.points.splice(idx + 1, 0, norm(w)); idx = idx + 1; }
      E.drag = { kind: 'vertex', id: it.id, index: idx };
      return true;
    }
    if (hit.kind === 'item') {
      const it = E.doc.items.find(x => x.id === hit.id);
      if (!it) return false;
      if (E.tool !== 'select' && it.type !== 'pin' && it.type !== 'label') return false;
      if (E.sel !== it.id) select(it.id);
      E.drag = { kind: 'item', id: it.id, start: w, orig: JSON.parse(JSON.stringify(it)) };
      return true;
    }
    return false;
  }
  function onDragMove(w) {
    const d = E.drag;
    if (!d) return;
    const it = E.doc.items.find(x => x.id === d.id);
    if (!it) return;
    if (d.kind === 'vertex') {
      it.points[d.index] = norm(w);
    } else {
      const dx = (w.x - d.start.x) / view.W, dy = (w.y - d.start.y) / view.H;
      if (it.type === 'pin' || it.type === 'label') {
        it.x = clamp(d.orig.x + dx, 0, 1); it.y = clamp(d.orig.y + dy, 0, 1);
      } else {
        // Sposto tutta la forma, senza farla uscire dalla carta.
        const xs = d.orig.points.map(p => p[0]), ys = d.orig.points.map(p => p[1]);
        const ddx = clamp(dx, -Math.min(...xs), 1 - Math.max(...xs)), ddy = clamp(dy, -Math.min(...ys), 1 - Math.max(...ys));
        it.points = d.orig.points.map(p => [p[0] + ddx, p[1] + ddy]);
      }
    }
    view.refresh();
  }
  function onDragEnd(cancelled) {
    const d = E.drag;
    E.drag = null;
    if (!d) return;
    if (cancelled) {
      const i = E.doc.items.findIndex(x => x.id === d.id);
      if (d.orig && i !== -1) E.doc.items[i] = d.orig;
      refreshData();
      return;
    }
    commit();
  }

  // Maniglie di modifica e anteprima del disegno (in pixel schermo).
  function drawHandles(v) {
    const hd = v.hd;
    let html = '';
    const toS = p => v.toScreen(p[0] * v.W, p[1] * v.H);
    const it = selItem();
    if (it && (it.type === 'arrow' || it.type === 'area') && !E.drawing && v._visibleState(it) !== 'hide') {
      const pts = it.points.map(toS);
      const n = pts.length;
      const segs = it.type === 'area' ? n : n - 1;
      for (let i = 0; i < segs; i++) {
        const a = pts[i], b = pts[(i + 1) % n];
        if (Math.hypot(a.x - b.x, a.y - b.y) < 26) continue;
        html += `<circle class="ed-h ed-mid" data-hit="mid" data-index="${i}" cx="${((a.x + b.x) / 2).toFixed(1)}" cy="${((a.y + b.y) / 2).toFixed(1)}" r="5"><title>Trascina per aggiungere un punto</title></circle>`;
      }
      pts.forEach((p, i) => {
        html += `<circle class="ed-h ed-vtx" data-hit="vertex" data-index="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7"><title>Trascina per spostare, doppio clic per togliere</title></circle>`;
      });
    }
    const dr = E.drawing;
    if (dr && dr.points.length) {
      const pts = dr.points.map(toS);
      const color = dr.type === 'area' ? '#2c5a66' : '#b23a2e';
      let d = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join('');
      if (E.hover && inBounds(E.hover)) {
        const h = v.toScreen(E.hover.x, E.hover.y);
        d += 'L' + h.x.toFixed(1) + ' ' + h.y.toFixed(1);
        if (dr.type === 'area' && pts.length >= 2) d += 'L' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
      }
      if (dr.type === 'area' && pts.length >= 3) html += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p.x + ' ' + p.y).join('')}Z" fill="${color}" fill-opacity=".15" stroke="none"/>`;
      html += `<path d="${d}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>`;
      html += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach((p, i) => {
        const first = i === 0 && dr.type === 'area' && pts.length >= 3;
        html += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${first ? 9 : 5.5}" fill="${first ? '#fff' : color}" stroke="${first ? color : '#fff'}" stroke-width="2.5"/>`;
      });
    }
    hd.innerHTML = html;
  }

  // =============== Selezione ===============
  function select(id, opts) {
    opts = opts || {};
    flushCommit();
    E.sel = id;
    E.imgMode = null;
    E.catPick = null;
    E.colorPick = null;
    view.setSelected(id);
    if (id) {
      E.tab = 'item';
      const it = selItem();
      if (it && it.type === 'pin' && it.categoryId) E.lastCat = it.categoryId;
      if (opts.center && it) view.focusItem(it, true);
      else if (it) view.ensureVisible(it);
    } else if (E.tab === 'item') {
      E.tab = 'list';
    }
    renderPanel();
    // Clic su un elemento (o elemento appena creato) con il pannello chiuso: lo riapro.
    if (id && (opts.focusField || opts.reveal) && mainEl.classList.contains('panel-hidden')) setPanelHidden(false);
    if (opts.focusField) {
      const focusIt = () => { const f = panelEl.querySelector(`[data-f="${opts.focusField}"]`); if (f && document.activeElement !== f) { f.focus(); if (f.select) f.select(); } };
      focusIt();
      setTimeout(focusIt, 0);
    }
  }
  function deleteSelected() {
    const it = selItem();
    if (!it) return;
    E.doc.items = E.doc.items.filter(x => x.id !== it.id);
    E.doc.tour = E.doc.tour.filter(st => st.ref !== it.id);
    commit();
    select(null);
    refreshData();
    toast(`${TYPE_NAMES[it.type]} eliminata. Puoi annullare con Ctrl+Z.`);
  }
  function duplicateSelected() {
    const it = selItem();
    if (!it) return;
    const c = JSON.parse(JSON.stringify(it));
    c.id = newId();
    if (c.type === 'pin' || c.type === 'label') { c.x = clamp(c.x + 0.02, 0, 1); c.y = clamp(c.y + 0.02, 0, 1); }
    else c.points = c.points.map(p => [clamp(p[0] + 0.02, 0, 1), clamp(p[1] + 0.02, 0, 1)]);
    if (c.title) c.title = c.title + ' (copia)';
    E.doc.items.push(c);
    commit();
    refreshData();
    select(c.id, { focusField: c.type === 'label' ? 'text' : 'title' });
  }
  // Dopo una modifica ai dati: aggiorna carta, linea del tempo e titolo.
  function refreshData() {
    view.refresh();
    tl.setDoc(E.doc);
    updateTitle();
  }

  // =============== Pannello ===============
  function renderPanel() {
    if (!E.doc) { tabsEl.innerHTML = ''; panelEl.innerHTML = ''; return; }
    if (E.tab === 'item' && !selItem()) E.tab = 'list';
    const tabs = [];
    if (selItem()) tabs.push(['item', TYPE_NAMES[selItem().type]]);
    tabs.push(['list', 'Elenco'], ['cats', 'Categorie'], ['tour', 'Visita'], ['map', 'Mappa']);
    tabsEl.innerHTML = tabs.map(([k, l]) => `<button type="button" role="tab" class="ed-tab${k === 'item' ? ' ed-tab-item' : ''}" data-tab="${k}" aria-selected="${k === E.tab}">${esc(l)}</button>`).join('');
    const scroll = panelEl.scrollTop;
    if (E.tab === 'item') renderItemForm(selItem());
    else if (E.tab === 'list') renderList();
    else if (E.tab === 'cats') renderCats();
    else if (E.tab === 'tour') renderTour();
    else renderMapTab();
    panelEl.scrollTop = E._keepScroll ? scroll : 0;
    E._keepScroll = false;
  }
  function rerenderKeepScroll() { E._keepScroll = true; renderPanel(); }

  function eraOpts(sel) {
    return `<option value="ad" ${sel === 'ad' ? 'selected' : ''}>d.C.</option><option value="bc" ${sel === 'bc' ? 'selected' : ''}>a.C.</option>`;
  }
  function dateFieldHtml(it) {
    const t = it.time || {};
    const defEra = docUsesBC(E.doc) ? 'bc' : 'ad';
    const fe = t.from != null ? (t.from < 0 ? 'bc' : 'ad') : defEra;
    const te = t.to != null ? (t.to < 0 ? 'bc' : 'ad') : fe;
    const hint = it.type === 'area'
      ? 'Per un territorio indica un periodo: sulla linea del tempo comparirà solo in quegli anni.'
      : 'Un solo anno = evento: compare in quell\'anno e poi resta in trasparenza. Un periodo = visibile solo in quegli anni.';
    return `<div class="field ed-date"><span class="label">${ui('clock', 14)} Quando? <span class="muted">(facoltativo, per la linea del tempo)</span></span>
      <div class="ed-daterow">
        <span class="ed-dgroup"><span class="ed-dlab">Dal</span><input class="input" type="number" min="1" step="1" inputmode="numeric" data-f="t-from" value="${t.from != null ? Math.abs(t.from) : ''}" placeholder="Anno" aria-label="Anno o inizio">
        <select class="input" data-f="t-from-era" aria-label="Era dell'inizio">${eraOpts(fe)}</select></span>
        <span class="ed-dgroup"><span class="ed-dlab">al</span><input class="input" type="number" min="1" step="1" inputmode="numeric" data-f="t-to" value="${t.to != null ? Math.abs(t.to) : ''}" placeholder="Anno" aria-label="Anno di fine (facoltativo)">
        <select class="input" data-f="t-to-era" aria-label="Era della fine">${eraOpts(te)}</select></span>
      </div>
      <span class="hint" style="margin:-2px 0 4px">Per un solo anno compila solo "Dal".</span>
      <label class="check"><input type="checkbox" data-f="t-approx" ${t.approx ? 'checked' : ''}> circa (data approssimativa)</label>
      <span class="hint">${hint}</span>
      <span class="err" data-dateerr></span></div>`;
  }
  function colorFieldHtml(it, withAuto) {
    const cur = it.color || '';
    const cat = it.type === 'pin' ? catById(E.doc, it.categoryId) : null;
    const auto = withAuto ? `<button type="button" class="swatch swatch-auto" data-color="" style="background:${safeColor(cat && cat.color)}" aria-pressed="${!cur}" title="Colore della categoria" aria-label="Colore della categoria"><span>A</span></button>` : '';
    return `<div class="field"><span class="label">Colore</span><div class="swatches">${auto}
      ${PIN_PALETTE.map(c => `<button type="button" class="swatch" data-color="${c}" style="background:${c}" aria-pressed="${c === cur}" aria-label="Colore ${c}"></button>`).join('')}
      <label class="swatch-custom${cur && PIN_PALETTE.indexOf(cur) === -1 ? ' on' : ''}"><input type="color" data-f="color-custom" value="${safeColor(cur || (cat && cat.color))}" aria-label="Altro colore">Altro</label>
    </div>${withAuto ? '<span class="hint">"A" = usa il colore della categoria, così la legenda resta chiara.</span>' : ''}</div>`;
  }
  function imageFieldHtml(it) {
    const img = it.image;
    const src = imageSrc(img, E.assets);
    if (img && src) {
      return `<div class="field"><span class="label">Immagine</span>
        <div class="ed-imgbox"><img src="${esc(src)}" alt="" referrerpolicy="no-referrer" data-imgprev>
          <div class="ed-imgmeta"><span class="chip">${img.url ? ui('link', 12) + ' da link' : ui('upload', 12) + ' caricata'}</span>
          <button type="button" class="btn btn-sm btn-danger-ghost" data-act="img-remove">${ui('trash', 14)}Togli</button></div></div>
        <label class="field ed-sub"><span class="label">Didascalia</span><input class="input" data-f="img-caption" maxlength="200" value="${esc(img.caption || '')}" placeholder="Scrivi che cosa mostra l'immagine"></label>
        <label class="field ed-sub"><span class="label">Fonte / autore</span><input class="input" data-f="img-credit" maxlength="300" value="${esc(img.credit || '')}" placeholder="Indica da dove viene l'immagine (sito, autore, licenza)"></label>
        <span class="err" data-imgerr></span>
      </div>`;
    }
    return `<div class="field"><span class="label">Immagine <span class="muted">(facoltativa)</span></span>
      ${E.imgMode === 'link' ? `<div class="ed-linkrow"><input class="input" data-f="img-url" placeholder="Incolla il link dell'immagine" autocomplete="off"><button type="button" class="btn btn-sm" data-act="img-link-ok">Usa</button><button type="button" class="btn btn-sm btn-ghost" data-act="img-link-cancel" aria-label="Annulla">${ui('close', 14)}</button></div>
        <span class="hint">Il link mantiene il file leggero, ma l'immagine si vedrà solo con internet.</span>`
      : `<div class="btn-row"><button type="button" class="btn btn-sm btn-ghost" data-act="img-upload">${ui('upload', 15)}Carica dal computer</button><button type="button" class="btn btn-sm btn-ghost" data-act="img-link">${ui('link', 15)}Da un link</button></div>`}
      <span class="err" data-imgerr></span></div>`;
  }
  function segHtml(field, value, options) {
    return `<div class="ed-seg" role="group">${options.map(([v, l]) => `<button type="button" data-seg="${field}" data-v="${v}" aria-pressed="${String(value) === String(v)}">${l}</button>`).join('')}</div>`;
  }
  function tourIndex(id) { return E.doc.tour.findIndex(st => st.ref === id); }

  function renderItemForm(it) {
    const type = it.type;
    const ti = tourIndex(it.id);
    const head = `<div class="ed-itemhead">
      <span class="ed-itemicon">${type === 'pin' ? pinSvg(itemColor(it, E.doc), (catById(E.doc, it.categoryId) || {}).icon) : type === 'arrow' ? arrowSample(it, itemColor(it, E.doc)) : type === 'area' ? areaSample(it, itemColor(it, E.doc)) : ui('text', 22)}</span>
      <b>${TYPE_NAMES[type]}</b>
      <span class="spacer"></span>
      <button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="center" title="Inquadra sulla carta" aria-label="Inquadra sulla carta">${ui('target', 16)}</button>
      <button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="duplicate" title="Duplica (Ctrl+D)" aria-label="Duplica">${ui('duplicate', 16)}</button>
      <button type="button" class="btn btn-sm btn-danger-ghost btn-icon" data-act="delete" title="Elimina (Canc)" aria-label="Elimina">${ui('trash', 16)}</button>
    </div>`;
    let body = '';
    if (type === 'label') {
      const st = it.style || 'free';
      const ls = labelStyle(it);
      body = `
        <label class="field"><span class="label">Testo sulla carta</span><textarea class="input ed-labeltext" data-f="text" rows="2" maxlength="200" placeholder="Scrivi il nome da mostrare sulla carta">${esc(it.text || '')}</textarea>
          <span class="hint">Premi Invio per andare a capo.</span></label>
        <div class="field"><span class="label">Tipo di nome</span><div class="ed-styles">${Object.keys(LABEL_STYLES).map(k => {
          const s = LABEL_STYLES[k];
          return `<button type="button" class="ed-stylebtn" data-lstyle="${k}" aria-pressed="${k === st}" style="color:${s.color};${s.italic ? 'font-style:italic;' : ''}${s.bold ? 'font-weight:700;' : ''}${s.upper ? 'text-transform:uppercase;letter-spacing:.08em;' : ''}">${esc(s.name)}</button>`;
        }).join('')}</div><span class="hint">Seguono le convenzioni delle carte: acque in corsivo blu, stati in maiuscolo spaziato…</span></div>
        <div class="field ed-inline3">
          <label class="check"><input type="checkbox" data-f="upper" ${ls.upper ? 'checked' : ''}> Maiuscolo</label>
          <label class="check"><input type="checkbox" data-f="italic" ${ls.italic ? 'checked' : ''}> Corsivo</label>
          <label class="check"><input type="checkbox" data-f="bold" ${ls.bold ? 'checked' : ''}> Grassetto</label>
        </div>
        <label class="field"><span class="label">Dimensione</span><input type="range" class="ed-range" data-f="size" min="0.004" max="0.08" step="0.0005" value="${it.size || 0.018}"></label>
        <label class="field"><span class="label">Rotazione <span class="muted" data-rotval>${Math.round(it.rotate || 0)}°</span></span><input type="range" class="ed-range" data-f="rotate" min="-90" max="90" step="1" value="${it.rotate || 0}"></label>
        ${colorFieldHtml(it, false)}
        <label class="check"><input type="checkbox" data-f="halo" ${it.halo !== false ? 'checked' : ''}> Alone chiaro attorno alle lettere (più leggibile)</label>
        ${dateFieldHtml(it)}`;
    } else {
      body = `
        <label class="field"><span class="label">Titolo</span><input class="input ed-titlein" data-f="title" maxlength="140" value="${esc(it.title || '')}" placeholder="${type === 'pin' ? 'Inserisci il titolo della puntina' : type === 'arrow' ? 'Inserisci il titolo della freccia' : 'Inserisci il nome dell\'area'}" autocomplete="off"></label>`;
      if (type === 'pin') {
        const cats = E.doc.categories;
        body += `<div class="field"><span class="label">Categoria</span><div class="cat-choices">
          <button type="button" class="cat-choice" data-cat="" aria-pressed="${!catById(E.doc, it.categoryId)}">Nessuna</button>
          ${cats.map(c => `<button type="button" class="cat-choice" data-cat="${esc(c.id)}" aria-pressed="${c.id === it.categoryId}"><span class="cat-dot" style="background:${safeColor(c.color)}">${iconSvg(c.icon, 12, inkOn(safeColor(c.color)))}</span>${esc(c.name)}</button>`).join('')}
          <button type="button" class="cat-choice ghost" data-act="tab-cats">${ui('edit', 13)}Gestisci</button></div></div>
          ${colorFieldHtml(it, true)}
          <label class="field"><span class="label">Grandezza <span class="muted" data-psval>${Math.round(pinSize(it) * 100)}%</span></span>
            <input type="range" class="ed-range" data-f="psize" min="0.5" max="2.5" step="0.1" value="${pinSize(it)}">
            <span class="hint">Più grande per gli elementi principali, più piccola per quelli secondari. <button type="button" class="linklike" data-act="psize-reset">Riporta al 100%</button></span></label>`;
      } else {
        body += colorFieldHtml(it, false);
      }
      body += `<label class="field"><span class="label">Descrizione</span><textarea class="input" data-f="text" maxlength="5000" placeholder="Scrivi la descrizione per gli studenti">${esc(it.text || '')}</textarea>
        <span class="hint">Una riga vuota separa i paragrafi. I link (https://…) diventano cliccabili.</span></label>`;
      body += imageFieldHtml(it);
      if (type === 'arrow') {
        body += `<div class="field"><span class="label">Spessore</span>${segHtml('width', it.width || 'medium', [['thin', 'Sottile'], ['medium', 'Medio'], ['thick', 'Spesso']])}</div>
          <div class="field"><span class="label">Tratto</span>${segHtml('dash', it.dash || 'solid', [['solid', 'Continuo'], ['dashed', 'Tratteggiato'], ['dotted', 'Puntinato']])}
            <span class="hint">Ad esempio: tratteggiato per una ritirata o una rotta incerta.</span></div>
          <div class="field"><span class="label">Punta</span>${segHtml('heads', it.heads || 'end', [['end', '→ Alla fine'], ['both', '↔ Entrambe'], ['none', '— Nessuna']])}</div>
          <label class="check"><input type="checkbox" data-f="curved" ${it.curved !== false ? 'checked' : ''}> Linea morbida (curva)</label>
          ${it.points.length === 2 && it.curved !== false ? `<label class="field"><span class="label">Curvatura</span><input type="range" class="ed-range" data-f="bend" min="-0.4" max="0.4" step="0.01" value="${it.bend == null ? 0.15 : it.bend}"></label>` : ''}
          <label class="check"><input type="checkbox" data-f="legend" ${it.legend !== false ? 'checked' : ''}> Mostra nella legenda</label>
          <p class="hint ed-shapehint">${ui('info', 13)} Trascina i pallini per modificare il percorso; trascina i pallini piccoli per aggiungere un punto; doppio clic su un pallino per toglierlo.</p>`;
      }
      if (type === 'area') {
        body += `<label class="field"><span class="label">Trasparenza del colore</span><input type="range" class="ed-range" data-f="opacity" min="0.08" max="0.8" step="0.01" value="${it.opacity == null ? 0.35 : it.opacity}"></label>
          <div class="field"><span class="label">Riempimento</span>${segHtml('fill', it.fill || 'solid', [['solid', 'Pieno'], ['hatch', 'A righe']])}
            <span class="hint">A righe: utile per zone di influenza, territori contesi o alleati.</span></div>
          <div class="field"><span class="label">Bordo</span>${segHtml('border', it.border || 'solid', [['solid', 'Continuo'], ['dashed', 'Tratteggiato'], ['none', 'Nessuno']])}</div>
          <label class="check"><input type="checkbox" data-f="curved" ${it.curved !== false ? 'checked' : ''}> Bordi arrotondati</label>
          <label class="check"><input type="checkbox" data-f="showName" ${it.showName !== false ? 'checked' : ''}> Scrivi il nome dentro l'area</label>
          <label class="check"><input type="checkbox" data-f="legend" ${it.legend !== false ? 'checked' : ''}> Mostra nella legenda</label>
          <p class="hint ed-shapehint">${ui('info', 13)} Trascina i pallini per modificare il confine; trascina i pallini piccoli per aggiungere un punto; doppio clic su un pallino per toglierlo.</p>`;
      }
      body += dateFieldHtml(it);
      body += `<div class="ed-tourbox">${ti === -1
        ? `<button type="button" class="btn btn-sm btn-ghost" data-act="tour-add-sel">${ui('route', 15)}Aggiungi alla visita guidata</button>`
        : `<span>${ui('route', 15)} Tappa <b>${ti + 1}</b> della visita guidata</span><button type="button" class="btn btn-sm btn-ghost" data-act="tab-tour">Vai alla visita</button>`}</div>`;
    }
    panelEl.innerHTML = `<div class="ed-form" data-item="${esc(it.id)}">${head}${body}</div>`;
  }

  // Applica un campo del modulo all'elemento selezionato.
  function applyField(el, isChange) {
    const it = selItem();
    if (!it) return;
    const f = el.dataset.f;
    let visual = true, soon = !isChange;
    switch (f) {
      case 'title': it.title = el.value; break;
      case 'text': it.text = el.value; break;
      case 'upper': case 'italic': case 'bold': it[f] = el.checked; break;
      case 'halo': it.halo = el.checked; break;
      case 'size': it.size = Number(el.value); break;
      case 'psize': {
        const v = Math.round(Number(el.value) * 10) / 10;
        if (v === 1) delete it.size; else it.size = v;
        const pv = panelEl.querySelector('[data-psval]'); if (pv) pv.textContent = Math.round(v * 100) + '%';
        break;
      }
      case 'rotate': it.rotate = Number(el.value); const rv = panelEl.querySelector('[data-rotval]'); if (rv) rv.textContent = Math.round(it.rotate) + '°'; break;
      case 'opacity': it.opacity = Number(el.value); break;
      case 'bend': it.bend = Number(el.value); break;
      case 'curved': case 'showName': case 'legend': it[f] = el.checked; if (f === 'curved') rerenderKeepScroll(); break;
      case 'color-custom': it.color = el.value.toLowerCase(); if (isChange) rerenderKeepScroll(); break;
      case 'img-caption': if (it.image) it.image.caption = el.value; visual = false; break;
      case 'img-credit': if (it.image) it.image.credit = el.value; visual = false; break;
      case 't-from': case 't-to': case 't-from-era': case 't-to-era': case 't-approx': applyDate(it); break;
      default: return;
    }
    if (visual) view.refresh();
    if (f === 'title' || f === 't-from' || f === 't-to' || f.indexOf('t-') === 0) tl.setDoc(E.doc);
    if (soon) commitSoon(); else commit();
    if (f === 'color-custom' || f === 'curved') renderItemHeadIcon(it);
  }
  function renderItemHeadIcon(it) {
    const ic = panelEl.querySelector('.ed-itemicon');
    if (!ic) return;
    ic.innerHTML = it.type === 'pin' ? pinSvg(itemColor(it, E.doc), (catById(E.doc, it.categoryId) || {}).icon) : it.type === 'arrow' ? arrowSample(it, itemColor(it, E.doc)) : it.type === 'area' ? areaSample(it, itemColor(it, E.doc)) : ui('text', 22);
  }
  function applyDate(it) {
    const q = s => panelEl.querySelector(`[data-f="${s}"]`);
    const err = panelEl.querySelector('[data-dateerr]');
    const fv = parseInt(q('t-from').value, 10), tv = parseInt(q('t-to').value, 10);
    const fe = q('t-from-era').value, te = q('t-to-era').value;
    err.textContent = '';
    if (!(fv > 0)) {
      if (q('t-from').value.trim() === '' && !(tv > 0)) { delete it.time; return; }
      if (!(fv > 0)) { err.textContent = q('t-from').value.trim() === '' ? 'Scrivi prima l\'anno di inizio.' : 'L\'anno deve essere un numero maggiore di 0 (l\'anno 0 non esiste).'; return; }
    }
    const from = fe === 'bc' ? -fv : fv;
    let to = tv > 0 ? (te === 'bc' ? -tv : tv) : null;
    if (to != null && toAstro(to) < toAstro(from)) { err.textContent = 'La fine è prima dell\'inizio: controlla gli anni e a.C./d.C.'; return; }
    if (to === from) to = null;
    it.time = { from: from, to: to, approx: q('t-approx').checked };
    if (!it.time.approx) delete it.time.approx;
    if (it.time.to == null) delete it.time.to;
  }

  // ---------- Immagini degli elementi ----------
  async function setImageFromLink(url) {
    const it = selItem();
    const err = panelEl.querySelector('[data-imgerr]');
    url = (url || '').trim();
    if (!/^https?:\/\//i.test(url)) { if (err) err.textContent = 'Il link deve iniziare con https://'; return; }
    if (err) err.textContent = 'Controllo il link…';
    let finalUrl = url, credit = '';
    const name = commonsFileName(url);
    if (name) {
      try {
        const info = await commonsInfo(name, 1280);
        finalUrl = info.thumb || info.url;
        credit = info.credit;
      } catch (e) {
        finalUrl = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(name.replace(/ /g, '_')) + '?width=1280';
        credit = 'Wikimedia Commons';
      }
    }
    try { await loadImage(finalUrl); } catch (e) {
      if (err) err.textContent = 'Da questo link non arriva un\'immagine. Usa l\'indirizzo dell\'immagine (tasto destro → Copia indirizzo immagine) o una pagina di Wikimedia Commons.';
      return;
    }
    if (!selItem() || selItem() !== it) return;
    it.image = { url: finalUrl, caption: '', credit: credit };
    E.imgMode = null;
    commit();
    rerenderKeepScroll();
    if (credit) toast('Immagine collegata: ho inserito autore e licenza nella fonte.', 'ok');
  }
  function uploadImage() {
    const inp = $('#fileImg');
    inp.value = '';
    inp.onchange = async () => {
      const file = inp.files[0];
      const it = selItem();
      if (!file || !it) return;
      const err = panelEl.querySelector('[data-imgerr]');
      if (err) err.textContent = 'Preparo l\'immagine…';
      try {
        const data = await prepareImage(file);
        const id = newId(8);
        E.assets.images[id] = data;
        E.assetsVer++;
        it.image = { asset: id, caption: '', credit: '' };
        commit();
        rerenderKeepScroll();
      } catch (e) { if (err) err.textContent = e.message; }
    };
    inp.click();
  }

  // ---------- Elenco ----------
  function renderList() {
    const q = E.listQuery.toLowerCase();
    const counts = { pin: 0, arrow: 0, area: 0, label: 0 };
    E.doc.items.forEach(it => counts[it.type]++);
    const useDC = docUsesBC(E.doc);
    const items = E.doc.items.filter(it => {
      if (E.listTypes.size && !E.listTypes.has(it.type)) return false;
      if (q && (itemTitle(it) + ' ' + (it.text || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    const glyph = it => it.type === 'pin' ? pinSvg(itemColor(it, E.doc), (catById(E.doc, it.categoryId) || {}).icon) : it.type === 'arrow' ? arrowSample(it, itemColor(it, E.doc)) : it.type === 'area' ? areaSample(it, itemColor(it, E.doc)) : ui('text', 18);
    panelEl.innerHTML = `<div class="ed-pad">
      <input class="input" type="search" data-list-q placeholder="Cerca negli elementi" value="${esc(E.listQuery)}">
      <div class="ed-typefilter">${['pin', 'arrow', 'area', 'label'].map(t => `<button type="button" data-ltype="${t}" aria-pressed="${E.listTypes.has(t)}">${ui(t === 'pin' ? 'pin' : t === 'arrow' ? 'arrow' : t === 'area' ? 'area' : 'text', 14)}${{ pin: 'Puntine', arrow: 'Frecce', area: 'Aree', label: 'Etichette' }[t]} <span class="muted">${counts[t]}</span></button>`).join('')}</div>
      ${E.doc.items.length ? `<ul class="ed-list">${items.map(it => {
        const st = view._visibleState(it);
        const miss = it.type !== 'label' && !(it.title || '').trim();
        return `<li><button type="button" class="ed-li${it.id === E.sel ? ' is-sel' : ''}${st === 'hide' ? ' is-hidden' : ''}" data-li="${esc(it.id)}">
          <span class="ed-li-g">${glyph(it)}</span>
          <span class="ed-li-t"><span class="ed-li-title${miss ? ' miss' : ''}">${esc(itemTitle(it))}</span>
          <span class="ed-li-sub">${TYPE_NAMES[it.type]}${it.time ? ' · ' + esc(fmtTime(it.time, useDC)) : ''}${tourIndex(it.id) !== -1 ? ' · tappa ' + (tourIndex(it.id) + 1) : ''}${st === 'hide' ? ' · nascosto dalla linea del tempo' : ''}</span></span>
        </button></li>`;
      }).join('') || '<li class="ed-empty">Nessun elemento corrisponde.</li>'}</ul>`
      : `<div class="ed-emptybox">${ui('pin', 26)}<p><b>Ancora nessun elemento.</b><br>Scegli uno strumento a sinistra (Puntina, Freccia, Area, Testo) e clicca sulla carta.</p></div>`}
    </div>`;
  }

  // ---------- Categorie ----------
  function renderCats() {
    const cats = E.doc.categories;
    const counts = {};
    E.doc.items.forEach(it => { if (it.type === 'pin') counts[it.categoryId] = (counts[it.categoryId] || 0) + 1; });
    panelEl.innerHTML = `<div class="ed-pad">
      <p class="ed-intro">Le categorie danno a ogni puntina un'<b>icona</b> e un <b>colore</b> e formano la <b>legenda</b> per gli studenti. Clicca la puntina per cambiare icona, il pallino per il colore.</p>
      <div class="ed-cats">${cats.map((c, i) => `
        <div class="cat-row">
          <button type="button" class="cat-pin" data-pick="${i}" aria-expanded="${E.catPick === i}" title="Cambia icona" aria-label="Cambia l'icona di ${esc(c.name)}">${pinSvg(safeColor(c.color), c.icon)}</button>
          <input class="input cat-name" data-catname="${i}" maxlength="40" value="${esc(c.name)}" aria-label="Nome della categoria">
          <button type="button" class="swatch cat-col" data-colpick="${i}" style="background:${safeColor(c.color)}" aria-label="Cambia colore" title="Cambia colore"></button>
          <span class="count" title="Puntine">${counts[c.id] || 0}</span>
          <button class="btn btn-ghost btn-sm btn-icon" data-catup="${i}" type="button" aria-label="Sposta su" ${i === 0 ? 'disabled' : ''}>${ui('up', 14)}</button>
          <button class="btn btn-danger-ghost btn-sm btn-icon" data-catdel="${i}" type="button" aria-label="Elimina ${esc(c.name)}">${ui('trash', 14)}</button>
        </div>
        ${E.colorPick === i ? `<div class="ed-pop"><div class="swatches">${PIN_PALETTE.map(col => `<button type="button" class="swatch" data-catcolor="${col}" style="background:${col}" aria-pressed="${col === c.color}" aria-label="Colore ${col}"></button>`).join('')}
          <label class="swatch-custom"><input type="color" data-catcolorcustom value="${safeColor(c.color)}">Altro</label></div></div>` : ''}
        ${E.catPick === i ? `<div class="ed-pop"><div class="icon-grid">${Object.keys(ICONS).map(k => `<button type="button" class="icon-opt" data-icon="${k}" aria-pressed="${k === c.icon}" aria-label="${esc(ICONS[k].label)}" title="${esc(ICONS[k].label)}">${iconSvg(k, 20)}</button>`).join('')}</div></div>` : ''}`).join('')
        || '<p class="muted">Nessuna categoria: le puntine avranno solo un colore.</p>'}</div>
      <button class="btn btn-sm" type="button" data-act="cat-new">${ui('plus', 16)}Nuova categoria</button>
    </div>`;
  }

  // ---------- Visita guidata ----------
  function renderTour() {
    const steps = E.doc.tour;
    const it = selItem();
    const canAdd = it && it.type !== 'label' && tourIndex(it.id) === -1;
    const dated = E.doc.items.filter(x => x.type !== 'label' && x.time && tourIndex(x.id) === -1).length;
    panelEl.innerHTML = `<div class="ed-pad">
      <p class="ed-intro">La visita guidata accompagna gli studenti <b>tappa per tappa</b>: a ogni tappa la carta inquadra l'elemento, mostra il suo testo e, se ha una data, porta la linea del tempo a quell'anno. Ottima da proiettare sulla LIM per raccontare una storia.</p>
      ${steps.length ? `<ol class="ed-steps">${steps.map((st, i) => {
        const x = E.doc.items.find(y => y.id === st.ref);
        if (!x) return '';
        return `<li class="ed-step${x.id === E.sel ? ' is-sel' : ''}">
          <span class="ed-stepn">${i + 1}</span>
          <button type="button" class="ed-step-t" data-stepgo="${i}"><b>${esc(itemTitle(x))}</b><small>${TYPE_NAMES[x.type]}${x.time ? ' · ' + esc(fmtTime(x.time, docUsesBC(E.doc))) : ''} · inquadratura ${st.view ? '<span class="ed-saved">salvata</span>' : 'automatica'}</small></button>
          <span class="ed-step-a">
            <button type="button" class="btn btn-ghost btn-sm btn-icon" data-stepview="${i}" title="Usa l'inquadratura attuale della carta per questa tappa" aria-label="Salva inquadratura">${ui('camera', 15)}</button>
            ${st.view ? `<button type="button" class="btn btn-ghost btn-sm btn-icon" data-stepviewclear="${i}" title="Torna all'inquadratura automatica" aria-label="Inquadratura automatica">${ui('fit', 15)}</button>` : ''}
            <button type="button" class="btn btn-ghost btn-sm btn-icon" data-stepup="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Sposta su">${ui('up', 15)}</button>
            <button type="button" class="btn btn-ghost btn-sm btn-icon" data-stepdown="${i}" ${i === steps.length - 1 ? 'disabled' : ''} aria-label="Sposta giù">${ui('down', 15)}</button>
            <button type="button" class="btn btn-danger-ghost btn-sm btn-icon" data-stepdel="${i}" aria-label="Togli dalla visita">${ui('close', 15)}</button>
          </span></li>`;
      }).join('')}</ol>` : '<div class="ed-emptybox">' + ui('route', 26) + '<p>Nessuna tappa. Seleziona un elemento sulla carta e aggiungilo qui.</p></div>'}
      <div class="btn-row">
        <button class="btn btn-sm" type="button" data-act="tour-add-sel" ${canAdd ? '' : 'disabled'}>${ui('plus', 15)}${it && it.type !== 'label' ? (canAdd ? 'Aggiungi "' + esc(itemTitle(it).slice(0, 26)) + '"' : 'Già nella visita') : 'Aggiungi l\'elemento selezionato'}</button>
        ${dated ? `<button class="btn btn-sm btn-ghost" type="button" data-act="tour-add-dated">${ui('clock', 15)}Aggiungi gli elementi datati in ordine cronologico (${dated})</button>` : ''}
      </div>
      <p class="hint">${ui('camera', 13)} Per scegliere tu l'inquadratura di una tappa: sistema la carta come vuoi, poi premi la fotocamera accanto alla tappa.</p>
    </div>`;
  }

  // ---------- Mappa ----------
  function renderMapTab() {
    const d = E.doc, m = d.map;
    const images = Object.keys(exportAssets().images).length;
    const mapInfo = m.kind === 'svg' ? 'Carta vettoriale (SVG): nitida a qualsiasi ingrandimento.'
      : `${m.w} × ${m.h} px${m.srcW && m.srcW !== m.w ? ` (originale ${m.srcW} × ${m.srcH})` : ''} · ${m.levels.length} livelli di zoom · ${m.format === 'webp' ? 'WebP' : 'JPEG'}`;
    panelEl.innerHTML = `<div class="ed-pad">
      <label class="field"><span class="label">Titolo della mappa</span><input class="input" data-m="title" maxlength="140" value="${esc(d.title)}" placeholder="Inserisci il titolo della mappa"></label>
      <label class="field"><span class="label">Consegna / introduzione per gli studenti</span><textarea class="input" data-m="description" rows="6" maxlength="5000" placeholder="Scrivi la consegna: che cosa devono fare o osservare gli studenti">${esc(d.description)}</textarea>
        <span class="hint">Una riga vuota separa i paragrafi. I link diventano cliccabili.</span></label>
      <label class="field"><span class="label">Autore <span class="muted">(facoltativo)</span></span><input class="input" data-m="author" maxlength="120" value="${esc(d.author)}" placeholder="Inserisci il tuo nome e la classe"></label>
      <div class="ed-card">
        <h3>Carta</h3>
        <div class="ed-mapthumb">${m.kind === 'tiles' && E.assets.tiles['0/0/0'] ? `<img src="${E.assets.tiles['0/0/0']}" alt="Carta attuale">` : ''}<p class="hint" style="margin:0">${esc(mapInfo)}</p></div>
        <label class="field"><span class="label">Fonte della carta</span><input class="input" data-m="mapCredit" maxlength="300" value="${esc(d.mapCredit)}" placeholder="Indica da dove viene la carta (sito, autore, licenza)"><span class="hint">Citare la fonte è anche un esempio per gli studenti.</span></label>
        <button class="btn btn-sm btn-ghost" type="button" data-act="replace-map">${ui('upload', 15)}Sostituisci la carta</button>
      </div>
      <div class="ed-card">
        <h3>Per gli studenti</h3>
        <label class="check"><input type="checkbox" data-m="quiz" ${d.settings.quiz !== false ? 'checked' : ''}><span>Attiva la modalità <b>Ripasso</b> (nomi nascosti da indovinare)</span></label>
      </div>
      <div class="ed-card">
        <h3>Linea del tempo</h3>
        <label class="check"><input type="checkbox" data-m="timeline" ${d.settings.timeline !== false ? 'checked' : ''}><span>Mostra la linea del tempo agli studenti</span></label>
        <p class="hint" style="margin-top:0">Se la togli, nella mappa esportata tutti gli elementi restano sempre visibili e le date compaiono solo nelle schede. Qui nell'editor resta visibile per aiutarti.</p>
        <div class="ed-tlopts" ${d.settings.timeline === false ? 'hidden' : ''}>
          <div class="field"><span class="label">Scala all'apertura</span>${segHtml('m-tlMode', d.settings.tlMode, [['years', 'Anni proporzionali'], ['events', 'Solo gli eventi']])}
            <span class="hint">"Solo gli eventi" salta da una data all'altra senza vuoti: utile quando gli eventi sono molto distanti. Gli studenti possono passare da una scala all'altra.</span></div>
          <label class="field ed-speedfield"><span class="label">Velocità all'apertura (quando si preme ▶)</span>
            <select class="input" data-m="tlSpeed">${tlSpeedOptions(d.settings.tlSpeed)}</select>
            <span class="hint">Gli studenti possono comunque cambiarla.</span></label>
        </div>
        <p class="hint">La linea del tempo compare solo se almeno un elemento ha una data.</p>
      </div>
      <p class="hint">Peso stimato del file: <b data-size>…</b>${images ? ` · ${images} immagini caricate` : ''}</p>
    </div>`;
    setTimeout(() => {
      const el = panelEl.querySelector('[data-size]');
      if (el) el.textContent = fmtBytes(new Blob([buildExportHtml()]).size);
    }, 30);
  }

  // =============== Eventi del pannello ===============
  panelEl.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.f) { if (el.type !== 'checkbox' && el.tagName !== 'SELECT') applyField(el, false); return; }
    if (el.dataset.m) {
      const k = el.dataset.m;
      if (k === 'quiz' || k === 'tlSpeed' || k === 'timeline') return;
      E.doc[k] = el.value;
      if (k === 'title') updateTitle();
      commitSoon();
      return;
    }
    if (el.dataset.listQ != null) {
      E.listQuery = el.value;
      renderList();
      const s = panelEl.querySelector('[data-list-q]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
      return;
    }
    if (el.dataset.catname != null) {
      const c = E.doc.categories[Number(el.dataset.catname)];
      if (c && el.value.trim()) { c.name = el.value.trim(); view.refresh(); commitSoon(); }
      return;
    }
    if (el.hasAttribute('data-catcolorcustom')) {
      const c = E.doc.categories[E.colorPick];
      if (c) { c.color = el.value.toLowerCase(); view.refresh(); commitSoon(); }
    }
  });
  panelEl.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.f) { applyField(el, true); return; }
    if (el.dataset.m === 'quiz') { E.doc.settings.quiz = el.checked; commit(); return; }
    if (el.dataset.m === 'timeline') { E.doc.settings.timeline = el.checked; commit(); rerenderKeepScroll(); return; }
    if (el.dataset.m === 'tlSpeed') { E.doc.settings.tlSpeed = Number(el.value); tl.setSpeed(E.doc.settings.tlSpeed); commit(); return; }
    if (el.dataset.m) { commit(); return; }
    if (el.dataset.catname != null) { if (!el.value.trim()) el.value = E.doc.categories[Number(el.dataset.catname)].name; commit(); return; }
    if (el.hasAttribute('data-catcolorcustom')) { commit(); rerenderKeepScroll(); }
  });
  panelEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset.f === 'img-url') { e.preventDefault(); setImageFromLink(e.target.value); }
    if (e.key === 'Enter' && e.target.dataset.catname != null) { e.preventDefault(); e.target.blur(); }
  });
  panelEl.addEventListener('click', e => {
    const it = selItem();
    const t = e.target;
    const sw = t.closest('.swatch[data-color]');
    if (sw && it) { it.color = sw.dataset.color || null; commit(); view.refresh(); rerenderKeepScroll(); return; }
    const cc = t.closest('.cat-choice[data-cat]');
    if (cc && it) {
      it.categoryId = cc.dataset.cat;
      if (it.categoryId) E.lastCat = it.categoryId;
      commit(); view.refresh(); rerenderKeepScroll(); return;
    }
    const mseg = t.closest('[data-seg="m-tlMode"]');
    if (mseg) { E.doc.settings.tlMode = mseg.dataset.v; tl.setMode(mseg.dataset.v); commit(); rerenderKeepScroll(); return; }
    const seg = t.closest('[data-seg]');
    if (seg && it) { it[seg.dataset.seg] = seg.dataset.v; commit(); view.refresh(); rerenderKeepScroll(); return; }
    const ls = t.closest('[data-lstyle]');
    if (ls && it) {
      const k = ls.dataset.lstyle;
      it.style = k; it.color = LABEL_STYLES[k].color;
      delete it.upper; delete it.italic; delete it.bold;
      E.lastLabelStyle = k;
      commit(); view.refresh(); rerenderKeepScroll(); return;
    }
    const li = t.closest('[data-li]');
    if (li) { select(li.dataset.li, { center: true }); return; }
    const lt = t.closest('[data-ltype]');
    if (lt) { const k = lt.dataset.ltype; E.listTypes.has(k) ? E.listTypes.delete(k) : E.listTypes.add(k); renderList(); return; }
    // Categorie
    if (t.closest('[data-pick]')) { const i = Number(t.closest('[data-pick]').dataset.pick); E.catPick = E.catPick === i ? null : i; E.colorPick = null; rerenderKeepScroll(); return; }
    if (t.closest('[data-colpick]')) { const i = Number(t.closest('[data-colpick]').dataset.colpick); E.colorPick = E.colorPick === i ? null : i; E.catPick = null; rerenderKeepScroll(); return; }
    if (t.closest('[data-icon]')) { const c = E.doc.categories[E.catPick]; if (c) { c.icon = t.closest('[data-icon]').dataset.icon; E.catPick = null; commit(); view.refresh(); rerenderKeepScroll(); } return; }
    if (t.closest('[data-catcolor]')) { const c = E.doc.categories[E.colorPick]; if (c) { c.color = t.closest('[data-catcolor]').dataset.catcolor; E.colorPick = null; commit(); view.refresh(); rerenderKeepScroll(); } return; }
    if (t.closest('[data-catup]')) {
      const i = Number(t.closest('[data-catup]').dataset.catup), cs = E.doc.categories;
      [cs[i - 1], cs[i]] = [cs[i], cs[i - 1]];
      E.catPick = E.colorPick = null; commit(); rerenderKeepScroll(); return;
    }
    if (t.closest('[data-catdel]')) {
      const i = Number(t.closest('[data-catdel]').dataset.catdel), c = E.doc.categories[i];
      const n = E.doc.items.filter(x => x.type === 'pin' && x.categoryId === c.id).length;
      confirmBox(n ? `La categoria "${c.name}" è usata da ${n} puntine: resteranno sulla carta senza categoria.` : `Eliminare la categoria "${c.name}"?`, { title: 'Elimina categoria', ok: 'Elimina', danger: true }).then(ok => {
        if (!ok) return;
        E.doc.categories.splice(i, 1);
        E.doc.items.forEach(x => { if (x.type === 'pin' && x.categoryId === c.id) x.categoryId = ''; });
        E.catPick = E.colorPick = null; commit(); view.refresh(); rerenderKeepScroll();
      });
      return;
    }
    // Visita guidata
    const sg = t.closest('[data-stepgo]');
    if (sg) {
      const st = E.doc.tour[Number(sg.dataset.stepgo)];
      const x = st && E.doc.items.find(y => y.id === st.ref);
      if (x) { E.sel = x.id; view.setSelected(x.id); if (st.view) view.setView(st.view, true); else view.focusItem(x, true); rerenderKeepScroll(); }
      return;
    }
    const sv = t.closest('[data-stepview]');
    if (sv) { E.doc.tour[Number(sv.dataset.stepview)].view = view.getView(); commit(); rerenderKeepScroll(); toast('Inquadratura salvata per questa tappa.', 'ok'); return; }
    const svc = t.closest('[data-stepviewclear]');
    if (svc) { delete E.doc.tour[Number(svc.dataset.stepviewclear)].view; commit(); rerenderKeepScroll(); return; }
    const su = t.closest('[data-stepup]'), sd = t.closest('[data-stepdown]');
    if (su || sd) {
      const i = Number((su || sd).dataset[su ? 'stepup' : 'stepdown']), j = su ? i - 1 : i + 1, ts = E.doc.tour;
      [ts[i], ts[j]] = [ts[j], ts[i]];
      commit(); rerenderKeepScroll(); return;
    }
    const sdel = t.closest('[data-stepdel]');
    if (sdel) { E.doc.tour.splice(Number(sdel.dataset.stepdel), 1); commit(); rerenderKeepScroll(); return; }
  });

  // Azioni generali (barra, banner, pannello, schermata iniziale).
  document.addEventListener('click', e => {
    const tb = e.target.closest('[data-tool]');
    if (tb) { setTool(tb.dataset.tool); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { flushCommit(); E.tab = tab.dataset.tab; E.catPick = E.colorPick = null; renderPanel(); return; }
    const a = e.target.closest('[data-act]');
    if (!a || a.closest('dialog')) return;
    const act = a.dataset.act;
    const it = selItem();
    switch (act) {
      case 'new': newMapFlow(); break;
      case 'open': openFlow(); break;
      case 'resume': resumeDraft(); break;
      case 'export': exportDialog('html'); break;
      case 'draft-delete': deleteDraftFlow(); break;
      case 'preview': previewFlow(); break;
      case 'help': helpDialog(); break;
      case 'undo': undo(); break;
      case 'redo': redo(); break;
      case 'panel-hide': setPanelHidden(true); break;
      case 'panel-show': setPanelHidden(false); break;
      case 'tab-map': if (E.doc) { setPanelHidden(false); E.tab = 'map'; renderPanel(); setTimeout(() => { const t = panelEl.querySelector('[data-m="title"]'); if (t) t.focus(); }, 20); } break;
      case 'tab-cats': E.tab = 'cats'; renderPanel(); break;
      case 'tab-tour': E.tab = 'tour'; renderPanel(); break;
      case 'tool-done': setTool('select'); break;
      case 'draw-finish': finishDrawing(); break;
      case 'draw-cancel': if (E.drawing && E.drawing.points.length) cancelDrawing(); else setTool('select'); break;
      case 'center': if (it) view.focusItem(it, true); break;
      case 'duplicate': duplicateSelected(); break;
      case 'delete': deleteSelected(); break;
      case 'img-upload': uploadImage(); break;
      case 'img-link': E.imgMode = 'link'; rerenderKeepScroll(); setTimeout(() => { const f = panelEl.querySelector('[data-f="img-url"]'); if (f) f.focus(); }, 20); break;
      case 'img-link-cancel': E.imgMode = null; rerenderKeepScroll(); break;
      case 'img-link-ok': setImageFromLink((panelEl.querySelector('[data-f="img-url"]') || {}).value); break;
      case 'psize-reset': if (it && it.type === 'pin') { delete it.size; commit(); view.refresh(); rerenderKeepScroll(); } break;
      case 'img-remove': if (it) { delete it.image; commit(); rerenderKeepScroll(); } break;
      case 'tour-add-sel':
        if (it && it.type !== 'label' && tourIndex(it.id) === -1) { E.doc.tour.push({ id: newId(8), ref: it.id }); commit(); rerenderKeepScroll(); toast(`Aggiunta come tappa ${E.doc.tour.length} della visita guidata.`, 'ok'); }
        break;
      case 'tour-add-dated': {
        const add = E.doc.items.filter(x => x.type !== 'label' && x.time && tourIndex(x.id) === -1)
          .sort((p, q) => toAstro(p.time.from) - toAstro(q.time.from));
        add.forEach(x => E.doc.tour.push({ id: newId(8), ref: x.id }));
        E.doc.tour.sort((p, q) => {
          const a1 = E.doc.items.find(x => x.id === p.ref), b1 = E.doc.items.find(x => x.id === q.ref);
          const ya = a1 && a1.time ? toAstro(a1.time.from) : Infinity, yb = b1 && b1.time ? toAstro(b1.time.from) : Infinity;
          return ya - yb;
        });
        commit(); rerenderKeepScroll();
        toast(`Aggiunte ${add.length} tappe, ordinate per data.`, 'ok');
        break;
      }
      case 'cat-new': {
        const used = E.doc.categories.map(c => c.color);
        E.doc.categories.push({ id: newId(8), name: 'Nuova categoria', icon: 'map-pin', color: PIN_PALETTE.find(c => used.indexOf(c) === -1) || PIN_PALETTE[0] });
        E.catPick = E.doc.categories.length - 1;
        commit(); rerenderKeepScroll();
        setTimeout(() => { const f = panelEl.querySelector(`[data-catname="${E.doc.categories.length - 1}"]`); if (f) { f.focus(); f.select(); } }, 20);
        break;
      }
      case 'replace-map': replaceMapFlow(); break;
    }
  });

  // =============== Tastiera ===============
  document.addEventListener('keydown', e => {
    const inField = e.target.closest && e.target.closest('input,textarea,select,[contenteditable]');
    const mod = e.ctrlKey || e.metaKey;
    if (document.querySelector('dialog[open]')) return;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); if (E.doc) exportDialog('html'); return; }
    if (!E.doc) return;
    if (inField) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
    if (mod) return;
    const k = e.key.toLowerCase();
    if (e.key === 'Enter' && E.drawing) { e.preventDefault(); finishDrawing(); return; }
    if (e.key === 'Escape') {
      if (E.drawing) cancelDrawing();
      else if (E.tool !== 'select') setTool('select');
      else if (E.sel) select(null);
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && E.sel) { e.preventDefault(); deleteSelected(); return; }
    const tools = { v: 'select', p: 'pin', f: 'arrow', a: 'area', t: 'label' };
    if (tools[k]) { setTool(tools[k]); return; }
  });

  // Avviso di uscita se ci sono modifiche non esportate (la bozza resta comunque nel browser).
  window.addEventListener('beforeunload', e => {
    if (E.doc && E.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  function flushDraft() {
    if (E.doc && E._draftT) { clearTimeout(E._draftT); E._draftT = null; saveDraft(); }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
  window.addEventListener('pagehide', flushDraft);

  function helpDialog() {
    const d = makeDialog(`<div class="dlg-in">
      <div class="dlg-head"><h2>Guida rapida</h2></div>
      <div class="dlg-body ed-help">
        <h3>Gli strumenti</h3>
        <ul>
          <li><b>Puntina (P)</b>: un clic sulla carta. Per luoghi, eventi, personaggi. Titolo, categoria, testo, immagine, data.</li>
          <li><b>Freccia (F)</b>: clicca i punti del percorso, dal primo all'ultimo; doppio clic o Invio per finire. Per spostamenti, campagne, rotte, migrazioni.</li>
          <li><b>Area (A)</b>: clicca i punti del confine; clicca il primo punto o premi Invio per chiudere. Per territori, regni, imperi, zone d'influenza.</li>
          <li><b>Testo (T)</b>: un clic per scrivere un nome sulla carta (mari, regioni, popoli…). Si può ruotare e ingrandire.</li>
          <li><b>Seleziona (V)</b>: clicca un elemento per modificarlo; trascinalo per spostarlo.</li>
        </ul>
        <h3>Date e linea del tempo</h3>
        <p>Se dai una data agli elementi, gli studenti trovano una linea del tempo: scorrendola vedono comparire eventi e territori. Un anno solo = evento; un periodo (dal… al…) = visibile solo in quegli anni. Per gli anni avanti Cristo scegli <b>a.C.</b></p>
        <h3>Scorciatoie</h3>
        <table class="ed-keys">
          <tr><td>Ctrl+Z / Ctrl+Y</td><td>Annulla / Ripeti</td></tr>
          <tr><td>Ctrl+S</td><td>Esporta la mappa</td></tr>
          <tr><td>Ctrl+D</td><td>Duplica l'elemento selezionato</td></tr>
          <tr><td>Canc</td><td>Elimina l'elemento selezionato</td></tr>
          <tr><td>Esc</td><td>Annulla il disegno / deseleziona</td></tr>
          <tr><td>Rotellina, + e −</td><td>Ingrandisci e rimpicciolisci</td></tr>
        </table>
        <h3>Esportare e riprendere il lavoro</h3>
        <p>Con <b>Esporta</b> crei ogni volta un nuovo file: la <b>pagina HTML</b> (per gli studenti e per riaprirla qui con <b>Apri</b>), un'<b>immagine PNG</b> o un <b>PDF</b> da stampare. Finché non esporti, il lavoro resta come bozza in questo browser e lo ritrovi con <b>Riprendi il lavoro</b>; puoi eliminare la bozza dalla schermata iniziale.</p>
      </div>
      <div class="dlg-foot"><button class="btn" type="button" data-close>Ho capito</button></div></div>`, 'wide');
    d.querySelector('[data-close]').onclick = () => d.close();
    d.showModal();
  }

  // =============== Avvio ===============
  renderHistoryBtns();
  showStart();
  window.maplabEditor = { E: E, view: view, tl: tl, loadDoc: loadDoc, buildExportHtml: buildExportHtml, parseMapLabHtml: parseMapLabHtml, importMapSource: importMapSource, select: select, setTool: setTool, commit: commit, refreshData: refreshData, renderPanel: renderPanel };
})();
</script>
</body>
