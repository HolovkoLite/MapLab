    const st = new Set();
    datedItems(doc).forEach(it => {
      st.add(toAstro(it.time.from));
      if (it.time.to != null) st.add(toAstro(it.time.to));
    });
    this.stops = Array.from(st).sort((x, y) => x - y);
    this.state.window = Math.max(0, Math.round((hi - lo) / 60));
    if (this.state.year < lo || this.state.year > hi) this.state.year = this.stops[0];
    this.el.querySelector('.tl-lo').textContent = fmtYear(fromAstro(this.stops[0]), this.useDC);
    this.el.querySelector('.tl-hi').textContent = fmtYear(fromAstro(this.stops[this.stops.length - 1]), this.useDC);
    this._layout();
  }
  setMode(m) {
    this.stop();
    this.mode = m === 'events' ? 'events' : 'years';
    this.el.querySelectorAll('.tl-mode [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === this.mode)));
    this.el.classList.toggle('mode-events', this.mode === 'events');
    if (this.r) {
      if (this.mode === 'events' && !this.state.all) this.state.year = this.stops[this._stopIndex(this.state.year)];
      this._layout();
    }
  }
  // Indice della tappa corrente (l'ultima non successiva all'anno dato).
  _stopIndex(y) {
    let i = 0;
    for (let k = 0; k < this.stops.length; k++) if (this.stops[k] <= y) i = k;
    return i;
  }
  _pos(y) {
    if (this.mode === 'events') {
      const n = this.stops.length;
      if (n < 2) return 50;
      return this._stopIndex(y) / (n - 1) * 100;
    }
    const lo = this.r.lo, hi = this.r.hi;
    return (y - lo) / (hi - lo) * 100;
  }
  _rangeToYear(v) { return this.mode === 'events' ? this.stops[clamp(Math.round(v), 0, this.stops.length - 1)] : v; }
  _layout() {
    if (!this.r) return;
    if (this.mode === 'events') {
      this.range.min = 0; this.range.max = Math.max(0, this.stops.length - 1); this.range.step = 1;
    } else {
      this.range.min = this.r.lo; this.range.max = this.r.hi; this.range.step = 1;
    }
    const seen = new Set();
    this.ticksEl.innerHTML = datedItems(this.doc).map(it => {
      const a = toAstro(it.time.from);
      const b = it.time.to != null ? toAstro(it.time.to) : null;
      const key = a + ':' + b;
      if (seen.has(key)) return '';
      seen.add(key);
      const p = this._pos(a);
      const tip = esc(itemTitle(it) + ' — ' + fmtTime(it.time, this.useDC));
      if (b != null && b !== a) {
        const q = this._pos(b);
        return `<span class="tl-span" style="left:${Math.min(p, q)}%;width:${Math.abs(q - p)}%" data-y="${a}" title="${tip}"></span>`;
      }
      return `<span class="tl-tick" style="left:${p}%" data-y="${a}" title="${tip}"></span>`;
    }).join('');
    this._paint();
  }
  set(st, silent) {
    Object.assign(this.state, st);
    if (this.r) this.state.year = clamp(this.state.year, this.r.lo, this.r.hi);
    this._paint();
    if (!silent && this.o.onChange) this.o.onChange(this.state);
  }
  _paint() {
    this.range.value = this.mode === 'events' ? this._stopIndex(this.state.year) : this.state.year;
    this.el.classList.toggle('is-all', this.state.all);
    this.allBtn.setAttribute('aria-pressed', String(this.state.all));
    this.yearEl.textContent = this.state.all ? '' : fmtYear(fromAstro(this.state.year), this.useDC);
    // Il pulsante si ridisegna solo quando passa da ▶ a pausa (e viceversa):
    // ridisegnarlo a ogni anno faceva perdere i clic durante lo scorrimento.
    if (this._paintedPlaying !== this.playing) {
      this._paintedPlaying = this.playing;
      this.playBtn.innerHTML = ui(this.playing ? 'pause' : 'play', 16);
      this.playBtn.setAttribute('aria-label', this.playing ? 'Pausa' : 'Riproduci');
      this.playBtn.title = this.playing ? 'Pausa' : 'Fai scorrere gli anni';
      this.el.classList.toggle('is-playing', this.playing);
    }
  }
  setSpeed(v) {
    this.speed = clamp(Math.round(Number(v) || 3), 1, 5);
    this.speedSel.value = String(this.speed);
  }
  _k() { return (TL_SPEEDS.find(o => o.v === this.speed) || TL_SPEEDS[2]).k; }
  play() {
    if (!this.r) return;
    const run = ++this._run;
    this.playing = true;
    if (this.mode === 'events') {
      const last = this.stops.length - 1;
      if (this.state.all || this._stopIndex(this.state.year) >= last) this.set({ all: false, year: this.stops[0] });
      this._paint();
      // Un passo per ogni data; la pausa tra un passo e l'altro dipende dalla velocità.
      const tick = () => {
        if (!this.playing || run !== this._run) return;
        const i = this._stopIndex(this.state.year);
        if (i >= last) { this.stop(); return; }
        this.set({ all: false, year: this.stops[i + 1] });
        if (i + 1 >= last) { this.stop(); return; }
        this._timer = setTimeout(tick, 700 * this._k());
      };
      this._timer = setTimeout(tick, 700 * this._k());
      return;
    }
    const span = this.r.hi - this.r.lo;
    if (this.state.all || this.state.year >= this.r.hi) this.set({ all: false, year: this.r.lo });
    this._paint();
    const baseDur = clamp(span * 250, 6000, 22000);
    let lastT = performance.now(), acc = this.state.year;
    const step = now => {
      if (!this.playing || run !== this._run) return;
      // La velocità si legge a ogni passo: cambiarla durante lo scorrimento ha effetto subito.
      acc += (now - lastT) * span / (baseDur * this._k()); lastT = now;
      const y = Math.min(this.r.hi, Math.floor(acc));
      if (y !== this.state.year) this.set({ all: false, year: y });
      if (y >= this.r.hi) { this.stop(); return; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  stop() { this._run++; clearTimeout(this._timer); if (this.playing) { this.playing = false; this._paint(); } }
}
</script>
<script type="text/plain" id="ml-viewer-js">
/* ================= MapLab — visualizzatore per gli studenti ================= */
'use strict';

const MapLabViewer = (function () {
  const $ = (sel, root) => (root || document).querySelector(sel);

  function start(root, doc, assets, opts) {
    opts = opts || {};
    const useDC = docUsesBC(doc);
    const S = {
      panel: 'intro',        // intro | list | item | tour | quiz
      panelOpen: true,
      itemId: null,
      tourIdx: -1,
      quiz: null,            // {revealed:Set, results:{}, current:null, shown:false}
      query: '',
      hiddenCats: new Set(),
      hiddenTypes: new Set(),
      hiddenLegend: new Set(),
      lim: false,
      legendOpen: window.innerWidth > 1100 || (window.innerWidth > 760 && window.innerWidth > window.innerHeight)
    };
    const hasTour = (doc.tour || []).some(st => doc.items.some(it => it.id === st.ref));
    const quizItems = () => doc.items.filter(it => it.type === 'label' ? (it.text || '').trim() : (it.title || '').trim());
    const hasQuiz = doc.settings.quiz !== false && quizItems().length >= 2;

    document.title = (doc.title || 'Mappa') + ' — MapLab';
    root.innerHTML = `
      <header class="topbar vw-top">
        ${MAPLAB_URL
          ? `<a class="brand" href="${esc(MAPLAB_URL)}" target="_blank" rel="noopener" title="Creato con MapLab — apri l'editor" aria-label="Creato con MapLab: apri l'editor in una nuova scheda">${BRAND_SVG}</a>`
          : `<span class="brand" aria-hidden="true">${BRAND_SVG}</span>`}
        <h1 class="topbar-title vw-title">${esc(doc.title || 'Mappa')}</h1>
        <span class="spacer"></span>
        <nav class="vw-actions" aria-label="Strumenti">
          <button class="btn btn-ghost btn-sm" type="button" data-a="intro" title="Consegna e informazioni">${ui('info', 17)}<span>Info</span></button>
          <button class="btn btn-ghost btn-sm" type="button" data-a="list" title="Elenco degli elementi">${ui('list', 17)}<span>Elenco</span></button>
          ${hasTour ? `<button class="btn btn-ghost btn-sm" type="button" data-a="tour" title="Visita guidata">${ui('route', 17)}<span>Visita guidata</span></button>` : ''}
          ${hasQuiz ? `<button class="btn btn-ghost btn-sm" type="button" data-a="quiz" title="Ripasso: prova a riconoscere gli elementi">${ui('quiz', 17)}<span>Ripasso</span></button>` : ''}
          <button class="btn btn-ghost btn-sm" type="button" data-a="lim" title="Schermo intero, caratteri grandi (per la LIM)">${ui('expand', 17)}<span>LIM</span></button>
        </nav>
      </header>
      <div class="vw-main">
        <div class="vw-mapcol">
          <div class="vw-mapwrap">
            <div class="vw-map"></div>
            <div class="vw-quizbar" hidden></div>
            <div class="vw-legend" hidden></div>
          </div>
          <div class="vw-tl"></div>
        </div>
        <aside class="vw-panel" aria-live="polite"></aside>
      </div>`;
    const mainEl = $('.vw-main', root);
    const panelEl = $('.vw-panel', root);
    const legendEl = $('.vw-legend', root);
    const quizbarEl = $('.vw-quizbar', root);

    const view = new MapView($('.vw-map', root), {
      onTap: onTap,
      onDoubleTap: (hit, w) => {
        if (hit) return;
        const p = view.toScreen(w.x, w.y);
        view.zoomAt(1.8, p.x, p.y, true);
      }
    });
    const tl = new Timeline($('.vw-tl', root), {
      onChange: st => { view.tl = st; view.applyVisibility(); renderLegend(); if (S.panel === 'list') renderList(); }
    });
    view.setDoc(doc, assets);
    tl.setMode(doc.settings.tlMode);
    tl.setSpeed(doc.settings.tlSpeed);
    tl.setDoc(doc, { disabled: doc.settings.timeline === false });
    view.tl = tl.state;

    // ---------- Pannello ----------
    function openPanel(mode) {
      S.panel = mode;
      S.panelOpen = true;
      renderPanel();
    }
    function closePanel() {
      S.panelOpen = false;
      renderPanel();
      if (!S.quiz) { view.setSelected(null); }
    }
    function renderPanel() {
      mainEl.classList.toggle('panel-closed', !S.panelOpen);
      root.querySelectorAll('.vw-actions [data-a]').forEach(b => {
        const a = b.dataset.a;
        const on = a === 'lim' ? S.lim : a === 'quiz' ? !!S.quiz : (S.panelOpen && (S.panel === a || (a === 'list' && S.panel === 'item' && !S.quiz)));
        b.setAttribute('aria-pressed', String(!!on));
      });
      if (!S.panelOpen) { panelEl.innerHTML = ''; return; }
      if (S.panel === 'intro') renderIntro();
      else if (S.panel === 'list') renderList();
      else if (S.panel === 'item') renderItem();
      else if (S.panel === 'tour') renderTour();
      else if (S.panel === 'quiz') renderQuizPanel();
      panelEl.scrollTop = 0;
    }
    const closeBtn = `<button class="btn btn-ghost btn-icon btn-sm vw-close" type="button" data-p="close" aria-label="Chiudi il pannello">${ui('close', 18)}</button>`;

    function renderIntro() {
      const counts = { pin: 0, arrow: 0, area: 0 };
      doc.items.forEach(it => { if (counts[it.type] != null) counts[it.type]++; });
      panelEl.innerHTML = `
        <div class="vw-phead"><span class="vw-kicker">Consegna</span>${closeBtn}</div>
        <div class="vw-pbody">
          <h2 class="vw-h">${esc(doc.title || 'Mappa')}</h2>
          ${doc.author ? `<p class="vw-author">${esc(doc.author)}</p>` : ''}
          <div class="vw-rich">${richText(doc.description) || '<p class="muted">Esplora la carta: tocca le puntine, le frecce e le aree per leggere le informazioni.</p>'}</div>
          <div class="vw-startbtns">
            ${hasTour ? `<button class="btn" type="button" data-p="tour">${ui('route', 18)}Inizia la visita guidata</button>` : ''}
            <button class="btn ${hasTour ? 'btn-ghost' : ''}" type="button" data-p="explore">${ui('eye', 18)}Esplora la carta</button>
          </div>
          <div class="vw-howto">
            <b>Come si usa</b>
            <ul>
              <li>Trascina per spostarti; usa la rotellina, i pulsanti + e − o due dita per ingrandire.</li>
              <li>Tocca una puntina, una freccia o un'area per leggere che cosa rappresenta.</li>
              ${tl.r ? '<li>Con la <b>linea del tempo</b> in basso vedi che cosa succede anno per anno; premi ▶ per farla scorrere.</li>' : ''}
              ${hasQuiz ? '<li>Con <b>Ripasso</b> gli elementi si nascondono: prova a riconoscerli.</li>' : ''}
            </ul>
          </div>
          ${doc.mapCredit ? `<p class="vw-credit"><b>Fonte della carta:</b> ${linkify(doc.mapCredit)}</p>` : ''}
          <p class="vw-made">Realizzata con MapLab</p>
        </div>`;
    }

    function listItems() {
      const q = S.query.toLowerCase();
      return doc.items.filter(it => {
        if (it.type === 'label') return false;
        if (S.hiddenTypes.has(it.type)) return false;
        if (it.type === 'pin') {
          const key = catById(doc, it.categoryId) ? it.categoryId : '';
          if (S.hiddenCats.has(key)) return false;
        }
        if (view._visibleState(it) === 'hide') return false;
        if (q && (itemTitle(it) + ' ' + (it.text || '')).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
    }
    function sortItems(arr) {
      const dated = !!timeRange(doc);
      return arr.slice().sort((a, b) => {
        if (dated) {
          const ya = a.time ? toAstro(a.time.from) : Infinity, yb = b.time ? toAstro(b.time.from) : Infinity;
          if (ya !== yb) return ya - yb;
        }
        return itemTitle(a).localeCompare(itemTitle(b), 'it');
      });
    }
    function itemGlyph(it, size) {
      const color = itemColor(it, doc);
      if (it.type === 'pin') {
        const cat = catById(doc, it.categoryId);
        return `<span class="vw-glyph">${pinSvg(color, cat && cat.icon)}</span>`;
      }
      if (it.type === 'arrow') return `<span class="vw-glyph">${arrowSample(it, color)}</span>`;
      if (it.type === 'area') return `<span class="vw-glyph">${areaSample(it, color)}</span>`;
      return '';
    }
    function itemKind(it) {
      if (it.type === 'pin') { const c = catById(doc, it.categoryId); return c ? c.name : 'Luogo'; }
      if (it.type === 'arrow') return 'Percorso';
      if (it.type === 'area') return 'Territorio';
      return 'Scritta';
    }
    function renderList() {
      if (S.panel !== 'list' || !S.panelOpen) return;
      const items = sortItems(listItems());
      const total = doc.items.filter(it => it.type !== 'label').length;
      const cats = (doc.categories || []).filter(c => doc.items.some(it => it.type === 'pin' && it.categoryId === c.id));
      const types = ['arrow', 'area'].filter(t => doc.items.some(it => it.type === t));
      const chips = cats.map(c => `<button type="button" class="vw-filter" data-cat="${esc(c.id)}" aria-pressed="${!S.hiddenCats.has(c.id)}">${iconSvg(c.icon, 15)}${esc(c.name)}</button>`)
        .concat(types.map(t => `<button type="button" class="vw-filter" data-type="${t}" aria-pressed="${!S.hiddenTypes.has(t)}">${ui(t === 'arrow' ? 'arrow' : 'area', 15)}${t === 'arrow' ? 'Percorsi' : 'Territori'}</button>`)).join('');
      const focused = document.activeElement && document.activeElement.classList.contains('vw-search');
      panelEl.innerHTML = `
        <div class="vw-phead"><span class="vw-kicker">Elenco <span class="muted">(${total})</span></span>${closeBtn}</div>
        <div class="vw-pbody vw-listbody">
          <input class="input vw-search" type="search" placeholder="Cerca" aria-label="Cerca negli elementi" value="${esc(S.query)}">
          ${chips ? `<div class="vw-filters">${chips}</div>` : ''}
          ${!tl.state.all && tl.r ? `<p class="vw-tlnote">${ui('clock', 14)}Stai vedendo l'anno <b>${esc(fmtYear(fromAstro(tl.state.year), useDC))}</b>. <button type="button" class="linklike" data-p="tl-all">Mostra tutte le date</button></p>` : ''}
          <ul class="vw-list">${items.length ? items.map(it => `
            <li><button type="button" class="vw-li" data-id="${esc(it.id)}">
              ${itemGlyph(it)}
              <span class="vw-li-t"><span class="vw-li-title">${esc(itemTitle(it))}</span>
              <span class="vw-li-sub">${esc(itemKind(it))}${it.time ? ' · ' + esc(fmtTime(it.time, useDC)) : ''}</span></span>
            </button></li>`).join('') : `<li class="vw-empty">${total ? 'Nessun elemento corrisponde.' : 'Questa mappa non ha ancora elementi.'}</li>`}</ul>
        </div>`;
      if (focused) { const s = $('.vw-search', panelEl); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }

    function figureHtml(it) {
      const src = imageSrc(it.image, assets);
      if (!src) return '';
      const cap = [it.image.caption, it.image.credit ? 'Fonte: ' + it.image.credit : ''].filter(Boolean);
      return `<figure class="vw-fig"><button type="button" class="vw-figbtn" data-p="zoomimg" aria-label="Ingrandisci l'immagine"><img src="${esc(src)}" alt="${esc(it.image.caption || itemTitle(it))}" loading="lazy" referrerpolicy="no-referrer"></button>
        ${cap.length ? `<figcaption>${it.image.caption ? esc(it.image.caption) : ''}${it.image.caption && it.image.credit ? '<br>' : ''}${it.image.credit ? `<span class="vw-src">Fonte: ${linkify(it.image.credit)}</span>` : ''}</figcaption>` : ''}</figure>`;
    }
    function itemBodyHtml(it) {
      const color = itemColor(it, doc);
      const cat = it.type === 'pin' ? catById(doc, it.categoryId) : null;
      const chip = it.type === 'pin'
        ? `<span class="vw-chip"><span class="vw-dot" style="background:${color}">${cat ? iconSvg(cat.icon, 13, inkOn(color)) : ''}</span>${esc(itemKind(it))}</span>`
        : `<span class="vw-chip">${itemGlyph(it)}${esc(itemKind(it))}</span>`;
      const title = it.type === 'label' ? (it.text || '') : itemTitle(it);
      return `${chip}
        <h2 class="vw-h vw-item-title">${esc(title)}</h2>
        ${it.time ? `<p class="vw-date">${ui('clock', 15)}${esc(fmtTime(it.time, useDC))}</p>` : ''}
        ${figureHtml(it)}
        <div class="vw-rich">${richText(it.text && it.type !== 'label' ? it.text : '')}</div>`;
    }
    function renderItem() {
      const it = doc.items.find(x => x.id === S.itemId);
      if (!it) { S.panel = 'list'; renderList(); return; }
      if (S.quiz) { renderQuizItem(it); return; }
      panelEl.innerHTML = `
        <div class="vw-phead"><button class="btn btn-ghost btn-sm" type="button" data-p="list">${ui('back', 16)}Elenco</button>${closeBtn}</div>
        <div class="vw-pbody">${itemBodyHtml(it)}
          <div class="btn-row vw-itemfoot"><button class="btn btn-ghost btn-sm" type="button" data-p="center">${ui('target', 16)}Mostra sulla carta</button></div>
        </div>`;
    }
    function openItem(id, focus) {
      const it = doc.items.find(x => x.id === id);
      if (!it) return;
      if (it.type === 'label' && !S.quiz) return;
      S.itemId = id;
      view.setSelected(id);
      openPanel('item');
      setTimeout(() => { if (focus) view.focusItem(it, true); else view.ensureVisible(it); }, 60);
    }

    // ---------- Visita guidata ----------
    function tourSteps() { return (doc.tour || []).filter(st => doc.items.some(it => it.id === st.ref)); }
    function goStep(i) {
      const steps = tourSteps();
      if (!steps.length) return;
      S.tourIdx = clamp(i, 0, steps.length);
      if (S.tourIdx === steps.length) { renderPanel(); view.setSelected(null); view.forceShowId = null; view.fit(true); return; }
      const st = steps[S.tourIdx];
      const it = doc.items.find(x => x.id === st.ref);
      view.forceShowId = it.id;
      if (tl.r) {
        if (it.time) tl.set({ all: false, year: toAstro(it.time.from) });
      }
      view.setSelected(it.id);
      view.applyVisibility();
      renderPanel();
      setTimeout(() => { if (st.view) view.setView(st.view, true); else view.focusItem(it, true); }, 60);
    }
    function renderTour() {
      const steps = tourSteps();
      if (S.tourIdx >= steps.length) {
        panelEl.innerHTML = `
          <div class="vw-phead"><span class="vw-kicker">Visita guidata</span>${closeBtn}</div>
          <div class="vw-pbody vw-tourend">
            <div class="vw-endicon">${ui('check', 34)}</div>
            <h2 class="vw-h">Fine della visita</h2>
            <p>Hai visto tutte le ${steps.length} tappe. Ora puoi esplorare la carta da solo${hasQuiz ? ' o metterti alla prova con il ripasso' : ''}.</p>
            <div class="vw-startbtns">
              <button class="btn btn-ghost" type="button" data-p="tour-restart">${ui('restart', 18)}Ricomincia</button>
              <button class="btn btn-ghost" type="button" data-p="explore">${ui('eye', 18)}Esplora la carta</button>
              ${hasQuiz ? `<button class="btn" type="button" data-p="quiz">${ui('quiz', 18)}Ripasso</button>` : ''}
            </div>
          </div>`;
        return;
      }
      const st = steps[S.tourIdx];
      const it = doc.items.find(x => x.id === st.ref);
      const pct = ((S.tourIdx + 1) / steps.length) * 100;
      panelEl.innerHTML = `
        <div class="vw-phead"><span class="vw-kicker">Visita guidata · tappa ${S.tourIdx + 1} di ${steps.length}</span>${closeBtn}</div>
        <div class="vw-progress" aria-hidden="true"><span style="width:${pct}%"></span></div>
        <div class="vw-pbody">${itemBodyHtml(it)}</div>
        <div class="vw-tournav">
          <button class="btn btn-ghost" type="button" data-p="prev" ${S.tourIdx === 0 ? 'disabled' : ''}>${ui('back', 18)}Indietro</button>
          <button class="btn" type="button" data-p="next">${S.tourIdx === steps.length - 1 ? 'Fine' : 'Avanti'}${ui('next', 18)}</button>
        </div>`;
    }
    function startTour() {
      endQuiz(true);
      S.panel = 'tour';
      S.panelOpen = true;
      goStep(0);
    }
    function endTour() {
      if (S.panel !== 'tour') return;
      view.forceShowId = null;
      if (tl.r) tl.set({ all: true });
      view.setSelected(null);
      view.applyVisibility();
    }

    // ---------- Ripasso ----------
    function startQuiz() {
      endTour();
      S.quiz = { revealed: new Set(), results: {}, shown: false };
      view.quiz = S.quiz;
      view.setSelected(null);
      view.refresh();
      renderQuizbar();
      renderLegend();
      openPanel('quiz');
    }
    function endQuiz(silent) {
      if (!S.quiz) return;
      S.quiz = null;
      view.quiz = null;
      view.setSelected(null);
      view.refresh();
      renderQuizbar();
      renderLegend();
      if (!silent) openPanel('list');
    }
    function quizStats() {
      const all = quizItems();
      const q = S.quiz;
      let ok = 0, no = 0;
      Object.values(q.results).forEach(v => { if (v === 'ok') ok++; else if (v === 'no') no++; });
      return { total: all.length, revealed: all.filter(it => q.revealed.has(it.id)).length, ok: ok, no: no };
    }
    function renderQuizbar() {
      if (!S.quiz) { quizbarEl.hidden = true; return; }
      const st = quizStats();
      quizbarEl.hidden = false;
      quizbarEl.innerHTML = `<span class="vw-qb-t">${ui('quiz', 16)}Ripasso</span>
        <span>Scoperti <b>${st.revealed}</b> di ${st.total}</span>
        <span class="vw-qb-ok" title="Lo sapevo">${ui('check', 14)}${st.ok}</span><span class="vw-qb-no" title="Non lo sapevo">${ui('x', 14)}${st.no}</span>
        <button type="button" class="btn btn-sm btn-ghost" data-q="restart">Ricomincia</button>
        <button type="button" class="btn btn-sm" data-q="exit">Esci</button>`;
    }
    function renderQuizPanel() {
      const st = quizStats();
      const done = st.revealed >= st.total;
      panelEl.innerHTML = `
        <div class="vw-phead"><span class="vw-kicker">Ripasso</span>${closeBtn}</div>
        <div class="vw-pbody">
          ${done ? `<h2 class="vw-h">Ripasso completato!</h2>
            <p class="vw-score"><span class="vw-qb-ok">${ui('check', 18)}${st.ok} lo sapevo</span><span class="vw-qb-no">${ui('x', 18)}${st.no} da ripassare</span></p>
            <p>${st.no ? 'Riguarda gli elementi segnati in rosso sulla carta, poi riprova.' : 'Complimenti: li conoscevi tutti.'}</p>
            <div class="vw-startbtns"><button class="btn" type="button" data-q="restart">${ui('restart', 18)}Ricomincia</button><button class="btn btn-ghost" type="button" data-q="exit">Esci dal ripasso</button></div>`
          : `<h2 class="vw-h">Mettiti alla prova</h2>
            <p>I nomi sono nascosti. Tocca un elemento con il <b>?</b> e prova a dire di che cosa si tratta. Poi controlla la risposta e sii sincero: <i>lo sapevo</i> o <i>non lo sapevo</i>?</p>
            <p class="muted">Scoperti ${st.revealed} di ${st.total}.</p>
            <div class="vw-startbtns"><button class="btn" type="button" data-q="random">${ui('target', 18)}Scegline uno a caso</button></div>`}
        </div>`;
    }
    function renderQuizItem(it) {
      const q = S.quiz;
      const revealed = q.revealed.has(it.id);
      const res = q.results[it.id];
      const question = it.type === 'label' ? 'Che cosa c\'è scritto qui?' : it.type === 'arrow' ? 'Che cosa indica questa freccia?' : it.type === 'area' ? 'Che territorio è questo?' : 'Che cosa c\'è in questo punto?';
      const cat = it.type === 'pin' ? catById(doc, it.categoryId) : null;
      panelEl.innerHTML = `
        <div class="vw-phead"><button class="btn btn-ghost btn-sm" type="button" data-q="panel">${ui('back', 16)}Ripasso</button>${closeBtn}</div>
        <div class="vw-pbody">
          ${revealed ? itemBodyHtml(it) : `
            <p class="vw-kicker">${esc(question)}</p>
            <div class="vw-qcard">${ui('quiz', 40)}<p>Pensa alla risposta, poi controlla.</p>
              ${cat ? `<p class="muted">Indizio: categoria <b>${esc(cat.name)}</b></p>` : ''}
              ${it.time ? `<p class="muted">Indizio: ${esc(fmtTime(it.time, useDC))}</p>` : ''}
            </div>
            <button class="btn vw-reveal" type="button" data-q="reveal">${ui('eye', 18)}Mostra la risposta</button>`}
          ${revealed && !res ? `<div class="vw-selfcheck"><p><b>Lo sapevi?</b></p><div class="btn-row">
            <button class="btn vw-yes" type="button" data-q="ok">${ui('check', 18)}Lo sapevo</button>
            <button class="btn vw-no" type="button" data-q="no">${ui('x', 18)}Non lo sapevo</button></div></div>` : ''}
          ${res ? `<p class="vw-result ${res}">${res === 'ok' ? ui('check', 16) + 'Lo sapevi.' : ui('x', 16) + 'Da ripassare.'}</p>
            <div class="btn-row"><button class="btn" type="button" data-q="random">${ui('next', 18)}Un altro</button></div>` : ''}
        </div>`;
    }
    function quizRandom() {
      const left = quizItems().filter(it => !S.quiz.revealed.has(it.id) && view._visibleState(it) !== 'hide');
      if (!left.length) { openPanel('quiz'); return; }
      const it = left[Math.floor(Math.random() * left.length)];
      openItem(it.id, true);
    }

    // ---------- Legenda ----------
    function renderLegend() {
      const entries = [];
      const usedCats = (doc.categories || []).filter(c => doc.items.some(it => it.type === 'pin' && it.categoryId === c.id));
      usedCats.forEach(c => entries.push(`<li><button type="button" class="vw-lg" data-lcat="${esc(c.id)}" aria-pressed="${!S.hiddenCats.has(c.id)}" title="Mostra o nascondi">
        <span class="vw-lg-g">${pinSvg(safeColor(c.color), c.icon)}</span><span>${esc(c.name)}</span></button></li>`));
      if (!S.quiz) {
        const seen = new Set();
        legendItems().forEach(it => {
          const color = itemColor(it, doc);
          const key = legendKey(it);
          if (seen.has(key)) return;
          seen.add(key);
          const off = S.hiddenLegend.has(key);
          const timeOff = !off && timeState(it, view.tl) === 'hide';
          entries.push(`<li><button type="button" class="vw-lg ${timeOff ? 'is-off' : ''}" data-lkey="${esc(key)}" aria-pressed="${!off}" title="${timeOff ? 'Non visibile in questo anno — clic per nascondere' : 'Mostra o nascondi'}">
            <span class="vw-lg-g">${it.type === 'area' ? areaSample(it, color) : arrowSample(it, color)}</span><span>${esc(it.title.trim())}</span></button></li>`);
        });
      }
      legendEl.hidden = !entries.length;
      legendEl.classList.toggle('is-open', S.legendOpen);
      legendEl.innerHTML = `<button type="button" class="vw-lg-head" aria-expanded="${S.legendOpen}">${ui('legend', 16)}Legenda${ui(S.legendOpen ? 'down' : 'up', 14)}</button>
        ${S.legendOpen ? `<ul>${entries.join('')}</ul>` : ''}`;
    }

    function legendItems() {
      return doc.items.filter(it => (it.type === 'area' || it.type === 'arrow') && it.legend !== false && (it.title || '').trim());
    }
    function legendKey(it) {
      return it.type + '|' + itemColor(it, doc) + '|' + it.title.trim() + '|' + (it.dash || '') + '|' + (it.fill || '');
    }
    function syncLegendHidden() {
      view.hiddenIds = new Set(legendItems().filter(it => S.hiddenLegend.has(legendKey(it))).map(it => it.id));
    }

    // ---------- Eventi ----------
    function onTap(hit) {
      if (hit && hit.kind === 'item') {
        const it = doc.items.find(x => x.id === hit.id);
        if (!it) return;
        if (S.panel === 'tour' && S.panelOpen) {
          const idx = tourSteps().findIndex(st => st.ref === it.id);
          if (idx !== -1) { goStep(idx); return; }
          endTour();
        }
        if (it.type === 'label' && !S.quiz) return;
        openItem(it.id);
        return;
      }
      if (S.panel === 'tour' && S.panelOpen) return;
      view.setSelected(null);
      if (S.panel === 'item' && S.panelOpen) {
        if (window.innerWidth <= 760) closePanel();
        else if (S.quiz) openPanel('quiz');
        else openPanel('list');
      }
    }

    root.addEventListener('click', e => {
      const a = e.target.closest('[data-a]');
      if (a) {
        const act = a.dataset.a;
        if (act === 'lim') { toggleLim(); return; }
        if (act === 'quiz') { S.quiz ? endQuiz() : startQuiz(); return; }
        if (act === 'tour') { if (S.panel === 'tour' && S.panelOpen) { endTour(); closePanel(); } else startTour(); return; }
        if (S.panelOpen && (S.panel === act || (act === 'list' && S.panel === 'item'))) { if (S.panel === 'tour') endTour(); closePanel(); return; }
        if (S.panel === 'tour') endTour();
        if (act === 'list' && S.quiz) { toast('Durante il ripasso l\'elenco è nascosto.'); openPanel('quiz'); return; }
        openPanel(act);
        return;
      }
      const p = e.target.closest('[data-p]');
      if (p) {
        const act = p.dataset.p;
        if (act === 'close') { if (S.panel === 'tour') endTour(); closePanel(); }
        else if (act === 'list') openPanel('list');
        else if (act === 'explore') { if (S.panel === 'tour') endTour(); if (window.innerWidth <= 760) closePanel(); else openPanel('list'); view.fit(true); }
        else if (act === 'tour' || act === 'tour-restart') startTour();
        else if (act === 'prev') goStep(S.tourIdx - 1);
        else if (act === 'next') goStep(S.tourIdx + 1);
        else if (act === 'quiz') startQuiz();
        else if (act === 'center') { const it = doc.items.find(x => x.id === S.itemId); if (it) view.focusItem(it, true); }
        else if (act === 'tl-all') tl.set({ all: true });
        else if (act === 'zoomimg') zoomImage(p.querySelector('img'));
        return;
      }
      const q = e.target.closest('[data-q]');
      if (q) {
        const act = q.dataset.q;
        if (act === 'exit') endQuiz();
        else if (act === 'restart') { endQuiz(true); startQuiz(); }
        else if (act === 'panel') { view.setSelected(null); openPanel('quiz'); }
        else if (act === 'random') quizRandom();
        else if (act === 'reveal') { S.quiz.revealed.add(S.itemId); view.refresh(); renderItem(); renderQuizbar(); }
        else if (act === 'ok' || act === 'no') { S.quiz.results[S.itemId] = act; view.refresh(); renderItem(); renderQuizbar(); }
        return;
      }
      const li = e.target.closest('.vw-li');
      if (li) { openItem(li.dataset.id, true); return; }
      const f = e.target.closest('.vw-filter');
      if (f) {
        if (f.dataset.cat != null) toggleSet(S.hiddenCats, f.dataset.cat); else toggleSet(S.hiddenTypes, f.dataset.type);
        syncFilters();
        return;
      }
      const lh = e.target.closest('.vw-lg-head');
      if (lh) { S.legendOpen = !S.legendOpen; renderLegend(); return; }
      const lc = e.target.closest('[data-lcat]');
      if (lc) { toggleSet(S.hiddenCats, lc.dataset.lcat); syncFilters(); return; }
      const lk = e.target.closest('[data-lkey]');
      if (lk) {
        toggleSet(S.hiddenLegend, lk.dataset.lkey);
        syncLegendHidden();
        const cur = doc.items.find(x => x.id === S.itemId);
        if (cur && view.hiddenIds.has(cur.id) && S.panel === 'item') { view.setSelected(null); openPanel('list'); }
        syncFilters();
      }
    });
    root.addEventListener('input', e => {
      if (e.target.classList.contains('vw-search')) { S.query = e.target.value.trim(); renderList(); }
    });
    function toggleSet(set, k) { set.has(k) ? set.delete(k) : set.add(k); }
    function syncFilters() {
      view.hiddenCats = S.hiddenCats;
      view.hiddenLayers = S.hiddenTypes;
      view.applyVisibility();
      renderLegend();
      renderList();
    }

    document.addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input,textarea,select')) return;
      if (document.querySelector('dialog[open]')) return;
      if (S.panel === 'tour' && S.panelOpen) {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goStep(S.tourIdx + 1); return; }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goStep(S.tourIdx - 1); return; }
      }
      if (e.key === 'Escape' && S.panelOpen) { if (S.panel === 'tour') endTour(); closePanel(); }
    });

    // ---------- Modalità LIM ----------
    function toggleLim() {
      S.lim = !S.lim;
      document.body.classList.toggle('lim', S.lim);
      view.uiScale = S.lim ? 1.35 : 1;
      view.refresh();
      renderPanel();
      const fs = document.fullscreenElement;
      if (S.lim && !fs && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {
          if (window.self !== window.top && /^https?:/.test(location.protocol)) {
            toast('Per lo schermo intero apro la mappa in una nuova scheda.');
            window.open(location.href, '_blank', 'noopener');
          }
        });
      } else if (!S.lim && fs && document.exitFullscreen) {
        document.exitFullscreen().catch(() => { /* niente */ });
      }
    }
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && S.lim) { S.lim = false; document.body.classList.remove('lim'); view.uiScale = 1; view.refresh(); renderPanel(); }
    });

    function zoomImage(img) {
      if (!img) return;
      const d = makeDialog(`<div class="dlg-in vw-lightbox"><button class="btn btn-icon vw-lb-close" type="button" aria-label="Chiudi">${ui('close')}</button><img src="${esc(img.src)}" alt="${esc(img.alt)}" referrerpolicy="no-referrer"></div>`, 'vw-lb');
      d.addEventListener('click', () => d.close());
      d.showModal();
    }

    // Avvio
    renderPanel();
    renderLegend();
    if (window.innerWidth <= 760 && !doc.description && !hasTour) closePanel();
    return { view: view, timeline: tl, state: S };
  }

  // Avvio automatico nel file esportato.
  function boot() {
    const d = document.getElementById('maplab-doc');
    const a = document.getElementById('maplab-assets');
    if (!d) return;
    let doc, assets;
    try {
      doc = normalizeDoc(JSON.parse(d.textContent));
      assets = a ? JSON.parse(a.textContent) : {};
    } catch (e) {
      document.body.innerHTML = '<p style="padding:24px">Il file della mappa è danneggiato e non può essere aperto.</p>';
      return;
    }
    const root = document.getElementById('app');
    window.maplab = start(root, doc, assets);
  }
  return { start: start, boot: boot };
})();
</script>
<script>
/* ================= MapLab — esportazione come immagine (PNG) e PDF ================= */
'use strict';

const MapLabRender = (function () {
  const SERIF = "'Palatino Linotype','Book Antiqua',Palatino,'Iowan Old Style',Georgia,serif";
  const SANS = "'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif";

  function loadImg(src) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('Immagine non caricata'));
      im.src = src;
    });
  }
  function svgToImage(svg) {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    return loadImg(url).finally(() => setTimeout(() => URL.revokeObjectURL(url), 1000));
  }
  const n = v => (Math.round(v * 10) / 10).toString();
  // Larghezza approssimativa di un testo (per decidere impaginazione e troncamenti).
  const textW = (s, fs, k) => String(s).length * fs * (k || 0.56);

  // ---------- Carta di base ----------
  async function drawBase(ctx, doc, assets, R, k, mx, my, mw, mh) {
    const m = doc.map;
    ctx.save();
    ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if (m.kind === 'svg') {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(mw)}" height="${Math.round(mh)}" viewBox="${R.x0} ${R.y0} ${R.x1 - R.x0} ${R.y1 - R.y0}" preserveAspectRatio="none"><rect width="${m.w}" height="${m.h}" fill="#fff"/>${assets.svg}</svg>`;
      const im = await svgToImage(svg);
      ctx.drawImage(im, mx, my, mw, mh);
    } else {
      const levels = m.levels, TS = m.tile;
      const need = m.w * k;
      let li = levels.length - 1;
      for (let i = 0; i < levels.length; i++) if (levels[i].w >= need * 0.95) { li = i; break; }
      const L = levels[li], f = m.w / L.w;
      const c0 = Math.max(0, Math.floor(R.x0 / f / TS)), c1 = Math.min(L.cols - 1, Math.floor((R.x1 / f - 0.001) / TS));
      const r0 = Math.max(0, Math.floor(R.y0 / f / TS)), r1 = Math.min(L.rows - 1, Math.floor((R.y1 / f - 0.001) / TS));
      const jobs = [];
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const src = assets.tiles[li + '/' + c + '/' + r];
        if (!src) continue;
        jobs.push(loadImg(src).then(im => {
          const lx0 = c * TS, ly0 = r * TS, lx1 = Math.min(L.w, lx0 + TS), ly1 = Math.min(L.h, ly0 + TS);
          const X0 = mx + (lx0 * f - R.x0) * k, Y0 = my + (ly0 * f - R.y0) * k;
          const X1 = mx + (lx1 * f - R.x0) * k, Y1 = my + (ly1 * f - R.y0) * k;
          // Mezzo pixel in più per evitare sottili fessure tra le tessere.
          ctx.drawImage(im, 0, 0, lx1 - lx0, ly1 - ly0, X0, Y0, X1 - X0 + 0.5, Y1 - Y0 + 0.5);
        }));
      }
      await Promise.all(jobs);
    }
    ctx.restore();
  }

  // ---------- Disegni, scritte e puntine (SVG) ----------
  function overlaySvg(doc, R, k, u, mx, my, opt) {
    const W = doc.map.w, H = doc.map.h;
    const X = x => mx + (x - R.x0) * k, Y = y => my + (y - R.y0) * k;
    const P = p => [X(p.x), Y(p.y)];
    let defs = '', areas = '', arrows = '', labels = '', pins = '';
    const vis = it => opt.visible ? opt.visible(it) : 'show';
    doc.items.forEach(it => {
      const st = vis(it);
      if (st === 'hide') return;
      const op = st === 'fade' ? ' opacity="0.4"' : '';
      const color = itemColor(it, doc);
      if (it.type === 'area' && it.points && it.points.length >= 3) {
        const pts = smoothPoints(itemWorldPoints(it, W, H), true, it.curved !== false).map(P);
        const d = pts.map((q, i) => (i ? 'L' : 'M') + n(q[0]) + ' ' + n(q[1])).join('') + 'Z';
        const o = it.opacity == null ? 0.35 : it.opacity;
        let fill = `fill="${color}" fill-opacity="${o}"`;
        if (it.fill === 'hatch') {
          const id = 'h' + it.id;
          const s = 12 * u;
          defs += `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${n(s)}" height="${n(s)}" patternTransform="rotate(45)"><rect width="${n(s)}" height="${n(s)}" fill="${color}" fill-opacity="${o * 0.35}"/><rect width="${n(s / 3)}" height="${n(s)}" fill="${color}" fill-opacity="${Math.min(1, o * 1.6)}"/></pattern>`;
          fill = `fill="url(#${id})"`;
        }
        const dash = it.border === 'dashed' ? ` stroke-dasharray="${n(9 * u)} ${n(6 * u)}"` : '';
        areas += `<g${op}><path d="${d}" ${fill} stroke="${it.border === 'none' ? 'none' : color}" stroke-width="${n(2.2 * u)}" stroke-linejoin="round"${dash}/>`;
        if (opt.texts && it.showName !== false && (it.title || '').trim()) {
          const c = P(polyCentroid(smoothPoints(itemWorldPoints(it, W, H), true, it.curved !== false)));
          const b = bbox(pts.map(q => ({ x: q[0], y: q[1] })));
          const fs = 14 * u;
          if (b.x1 - b.x0 > textW(it.title.trim(), fs, 0.6)) {
            areas += `<text x="${n(c[0])}" y="${n(c[1])}" text-anchor="middle" dominant-baseline="middle" font-family="${SANS}" font-weight="700" font-size="${n(fs)}" fill="${shade(color, -0.45)}" stroke="#fff" stroke-opacity="0.9" stroke-width="${n(3.5 * u)}" paint-order="stroke" stroke-linejoin="round">${esc(it.title.trim())}</text>`;
          }
        }
        areas += '</g>';
      } else if (it.type === 'arrow' && it.points && it.points.length >= 2) {
        const pts = smoothPoints(itemWorldPoints(it, W, H), false, it.curved !== false, it.bend).map(P);
        const w = arrowWidth(it) * u;
        const headLen = Math.max(11 * u, w * 3.2), headW = Math.max(9 * u, w * 2.6);
        const hs = it.heads || 'end';
        const tr = trimPolyline(pts, hs === 'none' ? 0 : headLen * 0.75, hs === 'both' ? headLen * 0.75 : 0);
        const d = tr.map((q, i) => (i ? 'L' : 'M') + n(q[0]) + ' ' + n(q[1])).join('');
        const dash = it.dash === 'dashed' ? ` stroke-dasharray="${n(w * 2.4)} ${n(w * 1.6)}"` : it.dash === 'dotted' ? ` stroke-dasharray="0.1 ${n(w * 2)}"` : '';
        let g = `<g${op}><path d="${d}" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="${n(w + 3.2 * u)}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`;
        g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`;
        const head = end => {
          const tip = end ? pts[pts.length - 1] : pts[0];
          const back = pointBack(pts, end, headLen);
          const a = Math.atan2(tip[1] - back[1], tip[0] - back[0]);
          const bx = tip[0] - Math.cos(a) * headLen, by = tip[1] - Math.sin(a) * headLen;
          const nx = -Math.sin(a) * headW / 2, ny = Math.cos(a) * headW / 2;
          const mx2 = tip[0] - Math.cos(a) * headLen * 0.72, my2 = tip[1] - Math.sin(a) * headLen * 0.72;
          return `<path d="M${n(tip[0])} ${n(tip[1])}L${n(bx + nx)} ${n(by + ny)}L${n(mx2)} ${n(my2)}L${n(bx - nx)} ${n(by - ny)}Z" fill="${color}" stroke="#fff" stroke-opacity="0.8" stroke-width="${n(1.2 * u)}" stroke-linejoin="round"/>`;
        };
        if (hs === 'end' || hs === 'both') g += head(true);
        if (hs === 'both') g += head(false);
        arrows += g + '</g>';
      } else if (it.type === 'label' && opt.texts) {
        const st2 = labelStyle(it);
        const fs = (it.size || 0.018) * W * k;
        if (fs < 3) return;
        const lines = String(it.text || '').split('\n');
        if (!lines.join('').trim()) return;
        const x = X(it.x * W), y = Y(it.y * H);
        const yTop = -((lines.length - 1) * 1.15 * fs) / 2 + fs * 0.35;
        const halo = it.halo === false ? '' : ` stroke="${haloFor(color)}" stroke-width="${n(Math.max(2, fs * 0.16))}" paint-order="stroke" stroke-linejoin="round"`;
        labels += `<g${op} transform="translate(${n(x)} ${n(y)}) rotate(${it.rotate || 0}) translate(0 ${n(yTop)})"><text text-anchor="middle" font-family="${SERIF}" font-size="${n(fs)}" font-weight="${st2.bold ? 700 : 500}"${st2.italic ? ' font-style="italic"' : ''} letter-spacing="${n(fs * (st2.spacing || 0))}" fill="${color}"${halo}>`
          + lines.map((ln, i) => `<tspan x="0" dy="${i ? n(1.15 * fs) : 0}">${esc(st2.upper ? ln.toUpperCase() : ln)}</tspan>`).join('') + '</text></g>';
      } else if (it.type === 'pin') {
        const s = u * pinSize(it);
        const x = X(it.x * W), y = Y(it.y * H);
        const cat = catById(doc, it.categoryId);
        pins += `<g${op} transform="translate(${n(x - 15 * s)} ${n(y - 40 * s)}) scale(${n(s * 100) / 100})">${pinSvg(itemColor(it, doc), cat && cat.icon)}</g>`;
        if (opt.pinNames && (it.title || '').trim()) {
          const fs = 13 * u * Math.max(0.85, Math.min(1.3, pinSize(it)));
          pins += `<text${op} x="${n(x + 13 * s)}" y="${n(y - 25 * s)}" dominant-baseline="middle" font-family="${SANS}" font-weight="700" font-size="${n(fs)}" fill="#1d2529" stroke="#fff" stroke-width="${n(3.2 * u)}" paint-order="stroke" stroke-linejoin="round">${esc(it.title.trim())}</text>`;
        }
      }
    });
    return { defs: defs, body: `<g>${areas}</g><g>${arrows}</g><g>${labels}</g><g>${pins}</g>` };
  }

  // ---------- Legenda ----------
  function legendEntries(doc, visible) {
    const out = [];
    const shown = doc.items.filter(it => !visible || visible(it) !== 'hide');
    (doc.categories || []).forEach(c => {
      if (shown.some(it => it.type === 'pin' && it.categoryId === c.id)) out.push({ glyph: 'pin', svg: pinSvg(safeColor(c.color), c.icon), text: c.name });
    });
    const seen = new Set();
    shown.filter(it => (it.type === 'area' || it.type === 'arrow') && it.legend !== false && (it.title || '').trim()).forEach(it => {
      const color = itemColor(it, doc);
      const key = [it.type, color, it.title.trim(), it.dash || '', it.fill || ''].join('|');
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ glyph: 'shape', svg: it.type === 'area' ? areaSample(it, color) : arrowSample(it, color), text: it.title.trim() });
    });
    return out;
  }

  // ---------- Composizione ----------
  // opt: { region:{x0,y0,x1,y1} in pixel carta, width: larghezza della carta in uscita,
  //        title, legend, pinNames, texts (bool), visible: funzione(item) → 'show'|'fade'|'hide' }
  async function render(doc, assets, opt) {
    const m = doc.map;
    const R = opt.region || { x0: 0, y0: 0, x1: m.w, y1: m.h };
    const rw = R.x1 - R.x0, rh = R.y1 - R.y0;
    const mw = Math.round(opt.width), k = mw / rw, mh = Math.round(rh * k);
    const u = Math.max(0.5, mw / 1400);
    const pad = Math.round(28 * u);
    const titleText = (doc.title || '').trim();
    const showTitle = opt.title && (titleText || doc.author);
    const headH = showTitle ? Math.round((titleText ? 44 * u : 0) + (doc.author ? 24 * u : 0) + 12 * u) : 0;
    const entries = opt.legend ? legendEntries(doc, opt.visible) : [];
    const colW = 300 * u, rowH = 32 * u;
    const cols = Math.max(1, Math.floor(mw / colW));
    const rows = Math.ceil(entries.length / cols);
    const legH = entries.length ? Math.round(24 * u + 30 * u + rows * rowH) : 0;
    const credit = (doc.mapCredit || '').trim();
    const footH = credit ? Math.round(30 * u) : 0;
    const TW = mw + pad * 2, TH = pad + headH + mh + legH + footH + pad;
    const mx = pad, my = pad + headH;

    const canvas = document.createElement('canvas');
    canvas.width = TW; canvas.height = TH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, TW, TH);
    await drawBase(ctx, doc, assets, R, k, mx, my, mw, mh);

    const ov = overlaySvg(doc, R, k, u, mx, my, opt);
    let extra = '';
    // cornice della carta
    extra += `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="none" stroke="#3a3f44" stroke-width="${n(Math.max(1, 1.5 * u))}"/>`;
    if (showTitle) {
      let y = pad;
      if (titleText) { y += 34 * u; extra += `<text x="${pad}" y="${n(y)}" font-family="${SERIF}" font-weight="700" font-size="${n(30 * u)}" fill="#1d2529">${esc(titleText)}</text>`; }
      if (doc.author) { y += 24 * u; extra += `<text x="${pad}" y="${n(y)}" font-family="${SANS}" font-size="${n(15 * u)}" fill="#55626a">${esc(doc.author)}</text>`; }
    }
    if (entries.length) {
      let y = my + mh + 24 * u;
      extra += `<text x="${pad}" y="${n(y + 16 * u)}" font-family="${SANS}" font-weight="700" font-size="${n(16 * u)}" fill="#1d2529">Legenda</text>`;
      y += 30 * u;
      entries.forEach((e, i) => {
        const c = i % cols, r = Math.floor(i / cols);
        const x = pad + c * colW, yy = y + r * rowH;
        const g = e.glyph === 'pin'
          ? `<g transform="translate(${n(x + 5 * u)} ${n(yy)}) scale(${n(u * 0.62 * 100) / 100})">${e.svg}</g>`
          : `<g transform="translate(${n(x)} ${n(yy + 3 * u)}) scale(${n(u * 100) / 100})">${e.svg}</g>`;
        const maxChars = Math.max(6, Math.floor((colW - 44 * u) / (14 * u * 0.56)));
        const t = e.text.length > maxChars ? e.text.slice(0, maxChars - 1) + '…' : e.text;
        extra += g + `<text x="${n(x + 40 * u)}" y="${n(yy + 13 * u)}" dominant-baseline="middle" font-family="${SANS}" font-size="${n(14 * u)}" fill="#1d2529">${esc(t)}</text>`;
      });
    }
    if (credit) {
      const maxChars = Math.floor(mw / (11 * u * 0.55));
      const t = 'Fonte della carta: ' + credit;
      extra += `<text x="${pad}" y="${n(TH - pad - 8 * u)}" font-family="${SANS}" font-size="${n(11 * u)}" fill="#6f7a80">${esc(t.length > maxChars ? t.slice(0, maxChars - 1) + '…' : t)}</text>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${TW}" height="${TH}" viewBox="0 0 ${TW} ${TH}"><defs>${ov.defs}<clipPath id="mapclip"><rect x="${mx}" y="${my}" width="${mw}" height="${mh}"/></clipPath></defs><g clip-path="url(#mapclip)">${ov.body}</g>${extra}</svg>`;
    const im = await svgToImage(svg);
    ctx.drawImage(im, 0, 0);
    return canvas;
  }

  // ---------- PDF (una pagina A4 con l'immagine JPEG) ----------
  function canvasBlob(canvas, type, q) {
    return new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('Conversione non riuscita')), type, q));
  }
  async function toPdf(canvas) {
    const jpg = new Uint8Array(await (await canvasBlob(canvas, 'image/jpeg', 0.92)).arrayBuffer());
    const iw = canvas.width, ih = canvas.height;
    const land = iw > ih;
    const PW = land ? 841.89 : 595.28, PH = land ? 595.28 : 841.89;
    const M = 28;
    const s = Math.min((PW - 2 * M) / iw, (PH - 2 * M) / ih);
    const dw = iw * s, dh = ih * s, dx = (PW - dw) / 2, dy = (PH - dh) / 2;
    const enc = new TextEncoder();
    const parts = [], offsets = [];
    let len = 0;
    const push = b => { const a = typeof b === 'string' ? enc.encode(b) : b; parts.push(a); len += a.length; };
    const obj = (i, body) => { offsets[i] = len; push(`${i} 0 obj\n${body}\nendobj\n`); };
    push('%PDF-1.4\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
    offsets[4] = len;
    push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
    push(jpg);
    push('\nendstream\nendobj\n');
    const content = `q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm /Im0 Do Q`;
    obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    const xref = len;
    let x = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  }
  async function toPng(canvas) { return canvasBlob(canvas, 'image/png'); }

  return { render: render, toPdf: toPdf, toPng: toPng };
})();

    const k = Math.min(1, maxSide / Math.max(W0, H0));
    const W = Math.max(1, Math.round(W0 * k)), H = Math.max(1, Math.round(H0 * k));
    // Riduzione a passi (più nitida) quando l'originale è molto più grande.
    let src = img, sw = W0, sh = H0;
    while (sw / W > 2.05) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(sw / 2); c.height = Math.ceil(sh / 2);
      const cx = c.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(src, 0, 0, c.width, c.height);
      src = c; sw = c.width; sh = c.height;
    }
    const full = document.createElement('canvas');
    full.width = W; full.height = H;
    const fctx = full.getContext('2d');
    fctx.fillStyle = '#fff';
    fctx.fillRect(0, 0, W, H);
    fctx.imageSmoothingQuality = 'high';
    fctx.drawImage(src, 0, 0, W, H);
    const pyr = [full];
    while (pyr[pyr.length - 1].width > TILE || pyr[pyr.length - 1].height > TILE) {
      const p = pyr[pyr.length - 1];
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.ceil(p.width / 2)); c.height = Math.max(1, Math.ceil(p.height / 2));
      const cx = c.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(p, 0, 0, c.width, c.height);
      pyr.push(c);
    }
    pyr.reverse();
    const levels = pyr.map(c => ({ w: c.width, h: c.height, cols: Math.ceil(c.width / TILE), rows: Math.ceil(c.height / TILE) }));
    const total = levels.reduce((n, L) => n + L.cols * L.rows, 0);
    const tiles = {};
    let done = 0, bytes = 0;
    for (let k2 = 0; k2 < pyr.length; k2++) {
      const L = levels[k2], P = pyr[k2];
      for (let r = 0; r < L.rows; r++) {
        for (let c = 0; c < L.cols; c++) {
          const tw = Math.min(TILE, L.w - c * TILE), th = Math.min(TILE, L.h - r * TILE);
          const t = document.createElement('canvas');
          t.width = tw; t.height = th;
          t.getContext('2d').drawImage(P, c * TILE, r * TILE, tw, th, 0, 0, tw, th);
          const url = await canvasToDataUrl(t, 0.84);
          tiles[k2 + '/' + c + '/' + r] = url;
          bytes += url.length;
          done++;
          if (onProgress && done % 4 === 0) onProgress(done / total);
        }
      }
    }
    if (onProgress) onProgress(1);
    return {
      map: { kind: 'tiles', id: newId(8), w: W, h: H, tile: TILE, levels: levels, format: canWebp() ? 'webp' : 'jpeg', srcW: W0, srcH: H0, bytes: bytes },
      tiles: tiles
    };
  }

  // Chiede la qualità e costruisce la carta. Restituisce {map, tiles, svg} o null.
  async function importMapSource(blob, nameHint) {
    const isSvg = /svg/i.test(blob.type || '') || /\.svg$/i.test(nameHint || '');
    if (isSvg) {
      const text = await readText(blob);
      const r = sanitizeSvg(text);
      return { map: { kind: 'svg', id: newId(8), w: r.w, h: r.h, bytes: r.markup.length }, tiles: {}, svg: r.markup };
    }
    if (blob.type && !/^image\//.test(blob.type)) throw new Error('Il file scelto non è un\'immagine.');
    const url = URL.createObjectURL(blob);
    let img;
    try { img = await loadImage(url); } catch (e) { URL.revokeObjectURL(url); throw new Error('Non riesco ad aprire questa immagine. Prova con JPG, PNG, WebP o SVG.'); }
    const W0 = img.naturalWidth, H0 = img.naturalHeight;
    const long = Math.max(W0, H0);
    let maxSide = Math.min(long, 6144);
    const choice = await new Promise(resolve => {
      const opts = [
        { v: 4096, t: 'Standard', d: 'File più leggero. Buono per carte semplici.' },
        { v: 6144, t: 'Alta (consigliata)', d: 'Molto ingrandibile, peso ragionevole.' },
        { v: 8192, t: 'Massima', d: 'Per carte ricche di dettagli minuti. File più pesante.' }
      ].filter((o, i, a) => o.v <= long || i === 0 || a[i - 1].v < long);
      const small = long < 2000;
      const d = makeDialog(`<form class="dlg-in" novalidate>
        <div class="dlg-head"><h2>Qualità della carta</h2></div>
        <div class="dlg-body">
          <p style="margin-top:0">L'immagine è di <b>${W0} × ${H0}</b> pixel.</p>
          ${small ? `<p class="notice warn">È un'immagine piccola: ingrandendo si sgranerà presto. Se puoi, cerca una versione più grande (su Wikimedia Commons scegli <i>Originale</i> o la risoluzione più alta).</p>` : ''}
          ${long > 4096 ? `<div class="ed-radio">${opts.map(o => {
            const v = Math.min(o.v, long);
            return `<label class="ed-rcard"><input type="radio" name="q" value="${v}" ${o.v === 6144 || (long < 6144 && o.v >= long) ? 'checked' : ''}><span><b>${o.t}</b> — ${v >= long ? 'risoluzione originale' : 'lato lungo ' + v + ' px'}<br><small>${o.d}</small></span></label>`;
          }).join('')}</div>` : '<p>La carta verrà conservata alla risoluzione originale.</p>'}
          <p class="hint">La carta viene divisa in tessere: gli studenti scaricano solo la parte che stanno guardando, alla nitidezza giusta per lo zoom.</p>
        </div>
        <div class="dlg-foot"><button class="btn btn-ghost" type="button" data-no>Annulla</button><button class="btn" type="submit">Prepara la carta</button></div>
      </form>`);
      let result = null;
      const form = d.querySelector('form');
      d.querySelector('[data-no]').onclick = () => d.close();
      form.onsubmit = e => {
        e.preventDefault();
        const q = form.querySelector('input[name=q]:checked');
        result = q ? Number(q.value) : long;
        d.close();
      };
      d.addEventListener('close', () => resolve(result));
      d.showModal();
    });
    if (!choice) { URL.revokeObjectURL(url); return null; }
    maxSide = choice;
    const prog = makeDialog(`<div class="dlg-in"><div class="dlg-head"><h2>Preparo la carta…</h2></div>
      <div class="dlg-body"><div class="ed-progress"><span></span></div><p class="hint" data-t>Divido l'immagine in tessere: può volerci qualche secondo.</p></div></div>`);
    prog.addEventListener('cancel', e => e.preventDefault());
    prog.showModal();
    const bar = prog.querySelector('.ed-progress span');
    try {
      await new Promise(r => setTimeout(r, 30));
      const res = await buildTiles(img, maxSide, p => { bar.style.width = Math.round(p * 100) + '%'; });
      return { map: res.map, tiles: res.tiles, svg: '' };
    } catch (e) {
      throw new Error('La preparazione della carta non è riuscita (immagine troppo grande per questo browser?). Prova con la qualità Standard.');
    } finally {
      URL.revokeObjectURL(url);
      prog.close();
    }
  }

  // Scelta della carta: file dal computer o link.
  function chooseMapSource(title) {
    return new Promise(resolve => {
      const d = makeDialog(`<form class="dlg-in" novalidate>
        <div class="dlg-head"><h2>${esc(title)}</h2></div>
        <div class="dlg-body">
          <div class="ed-drop" data-drop tabindex="0">
            ${ui('upload', 30)}
            <b>Scegli un'immagine dal computer</b>
            <span>oppure trascinala qui — JPG, PNG, WebP o SVG</span>
          </div>
          <div class="ed-or"><span>oppure</span></div>
          <label class="field"><span class="label">Link a Wikimedia Commons</span>
            <input class="input" name="url" placeholder="Incolla il link della pagina del file su Wikimedia Commons" autocomplete="off"></label>
          <p class="hint" style="margin-top:-8px">Incolla l'indirizzo della pagina del file: scarico io l'immagine alla massima risoluzione con autore e licenza.</p>
          <p class="err" data-err></p>
        </div>
        <div class="dlg-foot"><button class="btn btn-ghost" type="button" data-no>Annulla</button><button class="btn" type="submit">Usa il link</button></div>
      </form>`);
      let result = null;
      const form = d.querySelector('form');
      const err = d.querySelector('[data-err]');
      const drop = d.querySelector('[data-drop]');
      const pick = () => {
        const inp = $('#fileMap');
        inp.value = '';
        inp.onchange = () => { if (inp.files[0]) { result = { blob: inp.files[0], name: inp.files[0].name }; d.close(); } };
        inp.click();
      };
      drop.onclick = pick;
      drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = e => {
        e.preventDefault();
        const f = e.dataTransfer.files[0];
        if (f) { result = { blob: f, name: f.name }; d.close(); }
      };
      d.querySelector('[data-no]').onclick = () => d.close();
      form.onsubmit = async e => {
        e.preventDefault();
        const url = form.elements.url.value.trim();
        if (!url) { err.textContent = 'Incolla un link oppure scegli un file.'; return; }
        const name = commonsFileName(url);
        if (!name) { err.textContent = 'Per la carta accetto solo link di Wikimedia Commons. Per altre immagini scaricale e poi scegli il file.'; return; }
        err.textContent = 'Scarico la carta da Wikimedia Commons…';
        try {
          const info = await commonsInfo(name, null);
          let src = info.url;
          if (!/svg/.test(info.mime) && Math.max(info.w, info.h) > 8192) {
            const big = await commonsInfo(name, info.w >= info.h ? 8192 : Math.round(8192 * info.w / info.h));
            src = big.thumb;
          }
          const res = await fetch(src);
          if (!res.ok) throw new Error();
          const blob = await res.blob();
          result = { blob: blob, name: name, credit: info.credit };
          d.close();
        } catch (ex) {
          err.textContent = 'Non riesco a scaricare questa carta. Controlla il link o la connessione, oppure scaricala e scegli il file.';
        }
      };
      d.addEventListener('close', () => resolve(result));
      d.showModal();
    });
  }

  async function newMapFlow() {
    if (E.doc && E.dirty) {
      const ok = await confirmBox('La mappa aperta ha modifiche non esportate. Se inizi una nuova mappa, andranno perse.', { title: 'Nuova mappa', ok: 'Continua', danger: true });
      if (!ok) return;
    }
    const src = await chooseMapSource('Nuova mappa: scegli la carta');
    if (!src) return;
    let built;
    try { built = await importMapSource(src.blob, src.name); } catch (e) { toast(e.message, 'err'); return; }
    if (!built) return;
    const doc = emptyDoc();
    doc.map = built.map;
    doc.title = '';
    if (src.credit) doc.mapCredit = src.credit;
    loadDoc(doc, { tiles: built.tiles, svg: built.svg, images: {} }, { fileName: '', handle: null });
    E.dirty = true;
    E.tab = 'map';
    renderPanel();
    updateStatus();
    saveDraftSoon(true);
    setTimeout(() => { const t = panelEl.querySelector('[data-m="title"]'); if (t) t.focus(); }, 60);
    toast('Carta pronta. Dai un titolo alla mappa, poi scegli uno strumento a sinistra.', 'ok');
  }

  async function replaceMapFlow() {
    const src = await chooseMapSource('Sostituisci la carta');
    if (!src) return;
    let built;
    try { built = await importMapSource(src.blob, src.name); } catch (e) { toast(e.message, 'err'); return; }
    if (!built) return;
    const oldR = E.doc.map.w / E.doc.map.h, newR = built.map.w / built.map.h;
    if (Math.abs(oldR - newR) / oldR > 0.03) {
      const ok = await confirmBox(`La nuova carta ha proporzioni diverse dalla precedente: puntine e disegni potrebbero non combaciare più. Usala solo se ha la stessa inquadratura.`, { title: 'Proporzioni diverse', ok: 'Usa comunque' });
      if (!ok) return;
    }
    E.doc.map = built.map;
    E.assets.tiles = built.tiles;
    E.assets.svg = built.svg;
    if (src.credit && !E.doc.mapCredit) E.doc.mapCredit = src.credit;
    E.assetsVer++;
    // La sostituzione della carta non si può annullare.
    E.history = [JSON.stringify(E.doc)]; E.hIndex = 0;
    markChanged();
    view.setDoc(E.doc, E.assets);
    renderPanel();
    toast('Carta sostituita.', 'ok');
  }

  // =============== Documento, cronologia, bozza ===============
  function loadDoc(doc, assets, meta) {
    E.doc = normalizeDoc(doc);
    E.assets = { tiles: assets.tiles || {}, svg: assets.svg || '', images: assets.images || {} };
    E.assetsVer++;
    E.sel = null;
    E.drawing = null;
    E.tool = 'select';
    E.history = [JSON.stringify(E.doc)];
    E.hIndex = 0;
    E.lastExport = '';
    E.fileName = meta && meta.fileName || '';
    E.dirty = false;
    E.lastCat = null;
    view.selectedId = null;
    view.setDoc(E.doc, E.assets);
    view.fit(false);
    tl.set({ all: true }, true);
    tl.setMode(E.doc.settings.tlMode);
    tl.setSpeed(E.doc.settings.tlSpeed);
    tl.setDoc(E.doc);
    $('#edStart').hidden = true;
    document.body.classList.add('has-doc');
    if (E.tab === 'item') E.tab = 'list';
    renderAll();
  }
  function renderAll() {
    renderTools();
    renderBanner();
    renderPanel();
    updateTitle();
    updateStatus();
  }
  function updateTitle() {
    const t = E.doc && E.doc.title.trim();
    const b = $('.ed-titlebtn');
    b.textContent = t || 'Mappa senza titolo';
    b.classList.toggle('empty', !t);
    document.title = (t ? t + ' — ' : '') + 'MapLab editor';
  }
  function commit() {
    clearTimeout(E._commitT);
    E._commitT = null;
    if (!E.doc) return;
    const snap = JSON.stringify(E.doc);
    if (snap === E.history[E.hIndex]) return;
    E.history = E.history.slice(0, E.hIndex + 1);
    E.history.push(snap);
    if (E.history.length > 150) E.history.shift();
    E.hIndex = E.history.length - 1;
    markChanged();
  }
  function commitSoon() {
    clearTimeout(E._commitT);
    E._commitT = setTimeout(commit, 500);
    markChanged(true);
  }
  function flushCommit() { if (E._commitT) commit(); }
  function markChanged(soft) {
    E.dirty = true;
    updateStatus();
    saveDraftSoon();
    if (!soft) renderHistoryBtns();
  }
  function undo() {
    flushCommit();
    if (E.hIndex <= 0) { toast('Niente da annullare.'); return; }
    E.hIndex--;
    restoreSnapshot();
  }
  function redo() {
    flushCommit();
    if (E.hIndex >= E.history.length - 1) { toast('Niente da ripetere.'); return; }
    E.hIndex++;
    restoreSnapshot();
  }
  function restoreSnapshot() {
    E.doc = normalizeDoc(JSON.parse(E.history[E.hIndex]));
    if (E.sel && !selItem()) E.sel = null;
    E.drawing = null;
    view.selectedId = E.sel;
    view.setDoc(E.doc, E.assets);
    tl.setMode(E.doc.settings.tlMode);
    tl.setSpeed(E.doc.settings.tlSpeed);
    tl.setDoc(E.doc);
    E.dirty = true;
    saveDraftSoon();
    renderAll();
    renderHistoryBtns();
  }
  function renderHistoryBtns() {
    const u = $('[data-act="undo"]'), r = $('[data-act="redo"]');
    u.disabled = !E.doc || E.hIndex <= 0;
    r.disabled = !E.doc || E.hIndex >= E.history.length - 1;
  }
  function updateStatus() {
    if (!E.doc) { statusEl.textContent = ''; return; }
    const name = E.fileName ? esc(E.fileName) : '';
    statusEl.innerHTML = E.dirty
      ? `<span class="ed-dot"></span>modifiche non esportate`
      : E.lastExport ? `${ui('check', 14)}Esportata come ${esc(E.lastExport)}`
      : `${ui('check', 14)}${name ? 'Aperta da ' + name : 'Nessuna modifica'}`;
    statusEl.title = 'Finché non esporti, il lavoro resta come bozza in questo browser.';
    renderHistoryBtns();
  }

  // Bozza automatica nel browser (IndexedDB).
  const DB = {
    _db: null,
    open() {
      if (this._db) return Promise.resolve(this._db);
      return new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open('maplab-editor', 1); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => { this._db = req.result; resolve(this._db); };
        req.onerror = () => reject(req.error);
      });
    },
    async get(k) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const r = db.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    },
    async del(keys) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        keys.forEach(k => tx.objectStore('kv').delete(k));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
    async put(k, v) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
  };
  let savedAssetsVer = -1;
  function saveDraftSoon(now) {
    clearTimeout(E._draftT);
    E._draftT = setTimeout(() => { E._draftT = null; saveDraft(); }, now ? 50 : 400);
  }
  async function saveDraft() {
    if (!E.doc) return;
    try {
      if (savedAssetsVer !== E.assetsVer) {
        const ver = E.assetsVer;
        await DB.put('assets', { tiles: E.assets.tiles, svg: E.assets.svg, images: E.assets.images });
        savedAssetsVer = ver;
      }
      await DB.put('doc', { doc: E.doc, savedAt: Date.now(), fileName: E.fileName, dirty: E.dirty });
    } catch (e) {
      if (!E._draftWarned) { E._draftWarned = true; toast('Non riesco a salvare la bozza nel browser: ricordati di esportare la mappa.', 'err'); }
    }
  }

  // =============== Apri e salva ===============
  function parseMapLabHtml(text) {
    const get = id => {
      const m = new RegExp('<script type="application/json" id="' + id + '">([\\s\\S]*?)<\\/script>').exec(text);
      return m ? JSON.parse(m[1]) : null;
    };
    const doc = get('maplab-doc');
    if (!doc || doc.app !== 'MapLab') throw new Error('Questo file non è una mappa di MapLab.');
    const assets = get('maplab-assets') || {};
    return { doc: doc, assets: assets };
  }
  async function openFlow(fileArg) {
    if (E.doc && E.dirty) {
      const ok = await confirmBox('La mappa aperta ha modifiche non esportate. Se ne apri un\'altra, andranno perse.', { title: 'Apri una mappa', ok: 'Apri comunque', danger: true });
      if (!ok) return;
    }
    let file = fileArg;
    if (!file) {
      file = await new Promise(resolve => {
        const inp = $('#fileOpen');
        inp.value = '';
        inp.onchange = () => resolve(inp.files[0] || null);
        inp.click();
      });
    }
    if (!file) return;
    try {
      const { doc, assets } = parseMapLabHtml(await readText(file));
      loadDoc(doc, assets, { fileName: file.name });
      saveDraftSoon(true);
      toast('Mappa aperta: ' + file.name, 'ok');
    } catch (e) {
      toast(e.message || 'Non riesco ad aprire questo file.', 'err');
    }
  }

  function exportAssets() {
    const used = {};
    E.doc.items.forEach(it => { if (it.image && it.image.asset && E.assets.images[it.image.asset]) used[it.image.asset] = E.assets.images[it.image.asset]; });
    return { tiles: E.doc.map.kind === 'tiles' ? E.assets.tiles : {}, svg: E.doc.map.kind === 'svg' ? E.assets.svg : '', images: used };
  }
  function jsonScript(id, obj) {
    return `<script type="application/json" id="${id}">${JSON.stringify(obj).replace(/</g, '\\u003c')}<\/script>`;
  }
  function buildExportHtml() {
    flushCommit();
    const css = $('#ml-core-css').textContent + '\n' + $('#ml-viewer-css').textContent;
    const coreJs = $('#ml-core-js').textContent;
    const viewerJs = $('#ml-viewer-js').textContent;
    const d = JSON.parse(JSON.stringify(E.doc));
    d.savedAt = new Date().toISOString();
    return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="MapLab ${MAPLAB_VERSION}">
<title>${esc((E.doc.title || 'Mappa') + ' — MapLab')}</title>
<link rel="icon" type="image/svg+xml" href="${FAVICON_HREF}">
<style>${css}</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">Per vedere questa mappa serve JavaScript attivo nel browser.</p></noscript></div>
${jsonScript('maplab-doc', d)}
${jsonScript('maplab-assets', exportAssets())}
<script>${coreJs}<\/script>
<script>${viewerJs}<\/script>
<script>MapLabViewer.boot();<\/script>
</body>
</html>`;
  }
  function suggestedName() { return safeFileName(E.doc.title || 'mappa') + '.html'; }

  function afterExport(name) {
    E.dirty = false;
    E.lastExport = name;
    updateStatus();
    saveDraftSoon(true);
  }
  function baseName() { return safeFileName(E.doc.title || 'mappa'); }

  // ---------- Finestra "Esporta" ----------
  function exportDialog(kind) {
    if (!E.doc) return;
    flushCommit();
    const html = buildExportHtml();
    const size = new Blob([html]).size;
    const tlOn = !!(tl.r && !tl.state.all);
    const cur = view.getView();
    const X = {
      kind: kind || 'html',
      region: 'all', elems: 'all', res: 2000,
      title: true, legend: true, pinNames: true, texts: true
    };
    const card = (k, icon, t, d) => `<button type="button" class="ed-expkind" data-kind="${k}" aria-pressed="false">${ui(icon, 24)}<span><b>${t}</b><small>${d}</small></span></button>`;
    const d = makeDialog(`<div class="dlg-in">
      <div class="dlg-head"><h2>Esporta la mappa</h2></div>
      <div class="dlg-body">
        <div class="ed-expkinds">
          ${card('html', 'file', 'Pagina interattiva (HTML)', 'Per gli studenti e per riaprirla qui')}
          ${card('png', 'image', 'Immagine (PNG)', 'Per presentazioni, documenti, Classroom')}
          ${card('pdf', 'download', 'PDF da stampare', 'Una pagina A4 con carta e legenda')}
        </div>
        <div data-pane="html">
          <p style="margin-top:0">Ogni esportazione crea <b>un nuovo file HTML</b> (${fmtBytes(size)}) nella cartella dei download: il file che avevi aperto non viene sovrascritto.</p>
          <ul class="ed-ul">
            <li><b>gli studenti</b> lo aprono per consultare la mappa (senza poterla modificare);</li>

          </ul>
          ${size > 25 * 1024 * 1024 ? '<p class="notice warn">Il file è molto pesante: sui telefoni potrebbe caricarsi lentamente. Valuta la qualità Standard per la carta o immagini da link.</p>' : ''}
          <details class="ed-howto">
            <summary>Come pubblicarla per gli studenti</summary>
