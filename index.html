<style id="ml-core-css">
/* ================= MapLab — stili comuni ================= */
:root{
  --ink:#1d2529;
  --ink-2:#55626a;
  --ink-3:#6f7a80;
  --line:#d3d9da;
  --line-2:#e6eaea;
  --surface:#ffffff;
  --bg:#eef1f0;
  --bar:#1e2f36;
  --bar-ink:#e8efee;
  --bar-ink-2:#a9bbbd;
  --accent:#2c5a66;
  --accent-hover:#234a54;
  --accent-soft:#e1ecee;
  --danger:#a3312a;
  --danger-soft:#f7e6e4;
  --ok:#2f6b3a;
  --ok-soft:#e3f1e5;
  --warn:#7a5200;
  --warn-soft:#fbf0d9;
  --map-bg:#d6dcda;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:6px;
  --r-md:10px;
  --shadow:0 10px 30px rgba(20,32,38,.18),0 2px 6px rgba(20,32,38,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #5aa3b3;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.linklike{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:600}

/* ---------- Barra superiore ---------- */
.topbar{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;background:var(--bar);color:var(--bar-ink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;white-space:nowrap;color:inherit;text-decoration:none}
.brand svg{flex:none}
a.brand{cursor:pointer}
a.brand:hover{opacity:.82}
a.brand:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:10px}
.topbar .sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.18)}
.topbar-title{font-family:var(--serif);font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.topbar .btn-ghost{color:var(--bar-ink);border-color:rgba(255,255,255,.28)}
.topbar .btn-ghost:hover{background:rgba(255,255,255,.1)}
.topbar .btn-ghost[aria-pressed="true"]{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}

/* ---------- Pulsanti ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--accent);color:#fff;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{flex:none}
.btn-ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:#86271f}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:#e3c3bf}
.btn-danger-ghost:hover{background:var(--danger-soft)}
.btn-sm{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn-icon{width:38px;padding:0}
.btn-sm.btn-icon{width:32px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Campi ---------- */
.field{display:block;margin:0 0 14px}
.field > .label,.label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.hint{display:block;font-size:.8rem;color:var(--ink-3);margin-top:4px}
.input,textarea.input,select.input{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(44,90,102,.18)}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:4px 0 0}

/* ---------- Finestre di dialogo ---------- */
dialog.dlg{border:none;padding:0;border-radius:var(--r-md);box-shadow:var(--shadow);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--ink);overflow:hidden}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg > form,dialog.dlg > .dlg-in{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
dialog.dlg.wide{width:min(760px,calc(100vw - 24px))}
dialog.dlg::backdrop{background:rgba(18,28,33,.55)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.dlg-head h2{margin:0;font-size:1.1rem;flex:1}
.dlg-body{padding:6px 18px 8px;overflow:auto;flex:1 1 auto;min-height:0}
.dlg-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
.dlg-foot .left{margin-right:auto}

/* ---------- Avvisi ---------- */
.toast-wrap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:1000;width:min(460px,calc(100vw - 32px));pointer-events:none}
.toast{padding:10px 14px;border-radius:var(--r-sm);background:var(--bar);color:#fff;box-shadow:var(--shadow);font-size:.92rem;pointer-events:auto}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
.notice{padding:10px 12px;border-radius:var(--r-sm);font-size:.88rem;background:var(--accent-soft);color:var(--accent-hover)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.danger{background:var(--danger-soft);color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}

/* ---------- Carta ---------- */
.mv{position:relative;overflow:hidden;background:var(--map-bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;--pin-scale:1}
.mv.dragging{cursor:grabbing}
.mv:focus-visible{outline:3px solid #5aa3b3;outline-offset:-3px}
.mv-canvas{position:absolute;left:0;top:0;display:block}
.mv-vec{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;will-change:transform;pointer-events:none}
.mv-vec-svg{position:absolute;display:block;overflow:hidden}
.mv-ov,.mv-hd{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mv-ov .mv-item{pointer-events:auto;cursor:pointer}
.mv-ov .mv-item.is-faded{opacity:.38}
.mv-area.is-sel .mv-area-stroke{stroke-width:3.4}
.mv-area-name{font-family:var(--sans);font-weight:700;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;letter-spacing:.02em}
.mv-arrow.is-sel .mv-arrow-line{filter:drop-shadow(0 0 3px rgba(255,255,255,.95))}
.mv-label-text{pointer-events:auto}
.mv-label.is-sel .mv-label-text{text-decoration:underline dotted}
.mv-q{font-family:var(--sans);font-weight:800;font-size:19px;fill:#fff;paint-order:stroke;stroke:#1e2f36;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.mv-qbox{fill:#fff;fill-opacity:.55;stroke:#1e2f36;stroke-width:1.5;stroke-dasharray:4 3}
.mv-pins{position:absolute;left:0;top:0;width:0;height:0}
.mv-pin{position:absolute;left:0;top:0;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;will-change:transform}
.mv-pin svg{position:absolute;left:-15px;top:-40px;display:block;transform:scale(calc(var(--pin-scale) * var(--ps,1)));transform-origin:50% 100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transition:transform .12s}
.mv-pin:hover svg,.mv-pin:focus-visible svg,.mv-pin.is-sel svg{transform:scale(calc(var(--pin-scale) * var(--ps,1) * 1.2))}
.mv-pin.is-sel{z-index:5}
.mv-pin.is-sel::after{content:"";position:absolute;left:-9px;top:-5px;width:18px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--accent);pointer-events:none}
.mv-pin.is-faded svg{opacity:.4}
.mv-pin.q-ok svg{filter:drop-shadow(0 0 0 #2f6b3a) drop-shadow(0 0 4px #4caf50)}
.mv-pin.q-no svg{filter:drop-shadow(0 0 4px #e0584b)}
.mv-pin:focus-visible{outline:none}
.mv-pin:focus-visible svg{outline:3px solid #5aa3b3;outline-offset:2px;border-radius:4px}
.mv-empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.mv-ctrl{position:absolute;right:12px;top:12px;display:grid;gap:6px;z-index:10}
.mv-ctrl button{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mv-ctrl button:hover{background:var(--accent-soft)}
.mv-ctrl @media (prefers-reduced-motion:reduce){.mv-pin svg{transition:none}}

/* ---------- Linea del tempo ---------- */
.tl{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:8px 12px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.tl-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;min-width:34px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--accent)}
.tl-btn:hover{background:var(--accent-soft)}

.ed-expkind{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;text-align:left;cursor:pointer;color:var(--accent)}
.ed-expkind span{display:flex;flex-direction:column;color:var(--ink)}
.ed-expkind small{color:var(--ink-2);font-size:.8rem;margin-top:2px}
.ed-expkind:hover{background:var(--accent-soft)}
.ed-expkind[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ed-expimg{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:18px;align-items:start}
.ed-expopts .check{padding:3px 0}
.ed-expprev{display:grid;place-items:center;min-height:260px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:#e9eded}
.ed-expprev img{display:block;max-width:100%;max-height:58dvh;box-shadow:0 2px 10px rgba(0,0,0,.2);background:#fff}
@media (max-width:760px){
  .ed-expkinds{grid-template-columns:1fr}
  .ed-expimg{grid-template-columns:1fr}
}
</style>
<script type="text/plain" id="ml-viewer-css">
/* ================= MapLab — visualizzatore ================= */
body{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100dvh;overflow:hidden}
#app{display:contents}
.vw-top{gap:10px;padding:6px 12px;min-height:52px}
.vw-title{margin:0;font-weight:600}
.vw-actions{display:flex;gap:6px;flex-wrap:nowrap}
.vw-actions .btn{border-color:rgba(255,255,255,.25)}
.vw-main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
.vw-main.panel-closed{grid-template-columns:minmax(0,1fr) 0}
.vw-mapcol{position:relative;display:grid;grid-template-rows:1fr auto;min-height:0;min-width:0}
.vw-mapwrap{position:relative;min-height:0}
.vw-map{position:absolute;inset:0}
.vw-panel{display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--surface);border-left:1px solid var(--line)}
.vw-main.panel-closed .vw-panel{display:none}
.vw-phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px;background:#fff;border-bottom:1px solid var(--line-2)}
.vw-phead .vw-close{margin-left:auto}
.vw-kicker{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.vw-pbody{padding:14px 18px 22px}
.vw-h{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.2;margin:6px 0 8px;overflow-wrap:anywhere}
.vw-author{margin:0 0 10px;color:var(--ink-2);font-size:.92rem}
.vw-rich{font-size:1rem;line-height:1.6;overflow-wrap:anywhere}
.vw-rich p{margin:0 0 .8em}
.vw-startbtns{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.vw-howto{margin:18px 0 10px;padding:12px 14px;border-radius:var(--r-md);background:#f4f6f6;font-size:.88rem;color:var(--ink-2)}
.vw-howto ul{margin:6px 0 0;padding-left:18px}
.vw-howto li{margin:3px 0}
.vw-credit{font-size:.82rem;color:var(--ink-2);overflow-wrap:anywhere}
.vw-made{font-size:.75rem;color:var(--ink-3);margin-top:18px}
.vw-listbody{padding-top:12px}
.vw-search{margin-bottom:10px}
.vw-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.vw-filter{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.82rem;cursor:pointer}
.vw-filter[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.vw-tlnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.84rem;background:var(--accent-soft);color:var(--accent-hover);padding:7px 10px;border-radius:var(--r-sm);margin:0 0 8px}
.vw-list{list-style:none;margin:0;padding:0}
.vw-li{display:flex;gap:10px;align-items:center;width:100%;padding:8px 6px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer}
.vw-li:hover{background:var(--accent-soft)}
.vw-glyph{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;overflow:hidden}
.vw-glyph > svg[viewBox="0 0 30 40"]{transform:scale(.72)}
.vw-li-t{min-width:0}
.vw-li-title{display:block;font-weight:600;line-height:1.25}
.vw-li-sub{display:block;font-size:.8rem;color:var(--ink-3)}
.vw-empty{padding:16px 6px;color:var(--ink-3);font-size:.9rem}
.vw-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.vw-chip .vw-glyph{width:26px;height:22px}
.vw-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.vw-date{display:flex;align-items:center;gap:6px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.vw-fig{margin:6px 0 14px}
.vw-figbtn{display:block;padding:0;border:0;background:none;cursor:zoom-in;width:100%}
.vw-fig img{display:block;max-width:100%;max-height:44vh;margin:0 auto;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#f3f3f3}
.vw-fig figcaption{font-size:.82rem;color:var(--ink-2);margin-top:6px;line-height:1.4;overflow-wrap:anywhere}
.vw-src{color:var(--ink-3)}
.vw-itemfoot{margin-top:14px}
.vw-progress{height:4px;background:var(--line-2)}
.vw-progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.vw-tournav{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid var(--line-2);margin-top:auto}
.vw-tournav .btn{min-height:44px;padding:8px 18px;font-size:1rem}
.vw-tourend{text-align:center}
.vw-tourend .vw-startbtns{justify-content:center}
.vw-endicon{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);margin-top:10px}

/* Legenda */
.vw-legend{position:absolute;left:12px;bottom:12px;z-index:8;max-width:min(300px,calc(100% - 80px));max-height:calc(100% - 90px);overflow:auto;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.vw-lg-head{display:flex;align-items:center;gap:7px;width:100%;padding:8px 12px;border:0;background:none;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--ink)}
.vw-lg-head svg:last-child{margin-left:auto}
.vw-legend ul{list-style:none;margin:0;padding:0 6px 8px}
.vw-lg{display:flex;align-items:center;gap:8px;width:100%;padding:2px 6px;border:0;border-radius:var(--r-sm);background:none;font-size:.85rem;text-align:left;cursor:pointer}
.vw-lg:hover{background:var(--accent-soft)}
.vw-lg[aria-pressed="false"],.vw-lg.is-off{opacity:.4}
.vw-lg[aria-pressed="false"] span:last-child{text-decoration:line-through}
.vw-lg-g{flex:none;display:grid;place-items:center;width:30px;height:28px;overflow:hidden}
.vw-lg-g > svg[viewBox="0 0 30 40"]{transform:scale(.68)}

/* Ripasso */
.vw-quizbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:9;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;background:var(--bar);color:#fff;box-shadow:var(--shadow);font-size:.88rem;max-width:calc(100% - 80px)}
.vw-quizbar .btn-ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.vw-quizbar .btn-ghost:hover{background:rgba(255,255,255,.1)}
.vw-quizbar .btn:not(.btn-ghost){background:#fff;color:var(--ink)}
.vw-qb-t{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.vw-qb-ok,.vw-qb-no{display:inline-flex;align-items:center;gap:3px;font-weight:700}
.vw-qb-ok{color:#8fd49b}.vw-qb-no{color:#ffa89e}
.vw-pbody .vw-qb-ok{color:var(--ok)}.vw-pbody .vw-qb-no{color:var(--danger)}
.vw-score{display:flex;gap:16px;font-size:1.05rem}
.vw-qcard{display:grid;justify-items:center;gap:4px;text-align:center;padding:22px 14px;margin:8px 0 14px;border:2px dashed var(--line);border-radius:var(--r-md);color:var(--accent)}
.vw-qcard p{margin:0;color:var(--ink-2)}
.vw-reveal{width:100%;min-height:46px;font-size:1rem}
.vw-selfcheck{margin-top:16px;padding:12px 14px;border-radius:var(--r-md);background:#f4f6f6}
.vw-selfcheck p{margin:0 0 8px}
.vw-yes{background:var(--ok)}.vw-yes:hover{background:#255630}
.vw-no{background:var(--danger)}
.vw-result{display:flex;align-items:center;gap:6px;font-weight:700;margin:14px 0 10px}
.vw-result.ok{color:var(--ok)}.vw-result.no{color:var(--danger)}

/* Immagine ingrandita */
dialog.vw-lb{width:auto;max-width:96vw;max-height:94dvh;background:#111}
.vw-lightbox{position:relative;display:grid;place-items:center}
.vw-lightbox img{max-width:96vw;max-height:94dvh;display:block}
.vw-lb-close{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.9);color:var(--ink)}

/* Modalità LIM: tutto più grande */
body.lim{font-size:18px}
body.lim .vw-main{grid-template-columns:minmax(0,1fr) 440px}
body.lim .vw-main.panel-closed{grid-template-columns:minmax(0,1fr) 0}
body.lim .vw-h{font-size:1.9rem}
body.lim .vw-rich{font-size:1.15rem}
body.lim .tl{padding:12px 16px}
body.lim .tl-year{font-size:1.7rem;min-width:130px}
body.lim .tl-btn{min-height:44px;min-width:44px;font-size:1rem}
body.lim .tl-speed{min-height:44px}
body.lim .tl-mode button{min-height:42px;font-size:1rem;padding:6px 14px}
body.lim .tl-speed select{font-size:1rem;max-width:150px}
body.lim .mv-ctrl button{width:52px;height:52px}
body.lim .vw-legend{font-size:1.05rem}
body.lim .vw-lg{font-size:1rem}

@media (max-width:760px){
  .vw-actions .btn span{display:none}
  .vw-actions .btn{width:38px;padding:0}
  .vw-top .brand{display:none}
  .vw-title{font-size:1rem}
  .vw-main,.vw-main.panel-closed,body.lim .vw-main,body.lim .vw-main.panel-closed{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .vw-panel{max-height:52dvh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.1)}
  .vw-h{font-size:1.25rem}
  .vw-pbody{padding:10px 16px 16px}
  .tl{gap:2px 6px;padding:6px 8px;flex-wrap:wrap}
  .tl-mid{order:3;flex:1 1 100%}
  .tl-ctrls{gap:4px;min-width:0}
  .tl-right{margin-left:auto;gap:4px}
  .tl-long{display:none}
  .tl-btn{min-height:32px;min-width:32px}
  .tl-mode button{padding:4px 7px;font-size:.74rem;min-height:30px}
  .tl-speed{min-height:32px}
  .tl-speed svg{display:none}
  .tl-all{padding:4px 8px;font-size:.78rem}
  .tl-speed{padding:0 2px 0 6px}
  .tl-speed select{max-width:92px;font-size:.74rem}
  .tl-year{min-width:0;font-size:1rem}
  .vw-legend{left:8px;bottom:8px}
  .vw-quizbar{top:8px;left:8px;transform:none;max-width:calc(100% - 70px);gap:6px;font-size:.8rem;border-radius:14px}
  .mv-ctrl{right:8px;top:8px}
}
@media (max-width:420px){
  .tl-speed select{max-width:70px}
  .tl-year{font-size:.92rem}
  .vw-actions{gap:3px}
  .vw-actions .btn{width:34px;min-height:34px}
}

/* Tablet in verticale: pannello sotto la carta */
@media (orientation:portrait) and (min-width:761px) and (max-width:1100px){
  .vw-main,.vw-main.panel-closed,body.lim .vw-main,body.lim .vw-main.panel-closed{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .vw-panel{max-height:42dvh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.1)}
}
</script>

// ---------- Utilità ----------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
// Testo con paragrafi: righe vuote separano i paragrafi, a capo semplici restano.
function richText(text) {
  const t = String(text || '').trim();
  if (!t) return '';
  return t.split(/\n\s*\n/).map(p => `<p>${linkify(p).replace(/\n/g, '<br>')}</p>`).join('');
}
function newId(len) {
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  const arr = new Uint32Array(len || 10);
  crypto.getRandomValues(arr);
  return Array.from(arr, n => chars[n % chars.length]).join('');
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function safeFileName(s) {
  return String(s || '').replace(/[\\/:*?"<>|#%]+/g, '-').replace(/\s+/g, '_').replace(/^[_.-]+|[_.-]+$/g, '').slice(0, 60) || 'mappa';
}
function fmtBytes(n) {
  if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' kB';
  return (n / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
}

// ---------- Date storiche ----------
// Anni "storici": -218 = 218 a.C., 1492 = 1492 d.C. L'anno 0 non esiste.
// Per i calcoli si usa l'anno "astronomico" (1 a.C. = 0, 2 a.C. = -1…).
function toAstro(y) { return y < 0 ? y + 1 : y; }
function fromAstro(a) { return a <= 0 ? a - 1 : a; }
function fmtYear(y, useDC) {
  if (y == null || isNaN(y)) return '';
  if (y < 0) return (-y) + ' a.C.';
  return useDC ? y + ' d.C.' : String(y);
}
function fmtTime(t, useDC) {
  if (!t || t.from == null) return '';
  const pre = t.approx ? 'c. ' : '';
  if (t.to == null || t.to === t.from) return pre + fmtYear(t.from, useDC);
  const a = t.from, b = t.to;
  if (a < 0 && b < 0) return pre + (-a) + '–' + (-b) + ' a.C.';
  if (a > 0 && b > 0 && !useDC) return pre + a + '–' + b;
  if (a > 0 && b > 0) return pre + a + '–' + b + ' d.C.';
  return pre + fmtYear(a, true) + ' – ' + fmtYear(b, true);
}
function docUsesBC(doc) {
  return (doc.items || []).some(it => it.time && (it.time.from < 0 || (it.time.to != null && it.time.to < 0)));
}
function datedItems(doc) {
  return (doc.items || []).filter(it => it.time && it.time.from != null);
}
function timeRange(doc) {
  let lo = Infinity, hi = -Infinity;
  datedItems(doc).forEach(it => {
    const a = toAstro(it.time.from), b = it.time.to != null ? toAstro(it.time.to) : a;
    lo = Math.min(lo, a, b); hi = Math.max(hi, a, b);
  });
  if (lo === Infinity) return null;
  return { lo: lo, hi: hi };
}
// Visibilità di un elemento rispetto all'anno scelto sulla linea del tempo.
// Periodi: visibili solo dentro il periodo. Eventi (un solo anno): compaiono
// nel loro anno e poi restano sulla carta in trasparenza.
function timeState(item, tl) {
  if (!tl || tl.all || !item.time || item.time.from == null) return 'show';
  const Y = tl.year;
  const a = toAstro(item.time.from);
  if (item.time.to != null && item.time.to !== item.time.from) {
    const b = toAstro(item.time.to);
    return (Y >= Math.min(a, b) && Y <= Math.max(a, b)) ? 'show' : 'hide';
  }
  if (Y < a) return 'hide';
  return (Y - a <= (tl.window || 0)) ? 'show' : 'fade';
}

// ---------- Colori ----------
const PIN_PALETTE = ['#b23a2e', '#d4762a', '#c9a227', '#4f8a3c', '#2a8a86', '#2c5a7c', '#5b4a9e', '#9c3d78', '#6b4f3a', '#3a3f44'];
const DEFAULT_PIN_COLOR = '#b23a2e';
function isLight(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  if (!m) return false;
  const [r, g, b] = [m[1], m[2], m[3]].map(h => {
    const c = parseInt(h, 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.42;
}
function inkOn(hex) { return isLight(hex) ? '#1d2529' : '#ffffff'; }
function safeColor(c, fallback) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : (fallback || DEFAULT_PIN_COLOR); }

function imageSrc(image, assets) {
  if (!image) return '';

}

// ---------- Geometria ----------
// Da una serie di punti (in pixel della carta) a una linea morbida campionata.
function smoothPoints(pts, closed, curved, bend) {
  const n = pts.length;
  if (n < 2) return pts.slice();
  if (!curved) return closed ? pts.concat([pts[0]]) : pts.slice();
  const out = [];
  if (n === 2 && !closed) {
    const a = pts[0], b = pts[1];
    const k = bend == null ? 0.15 : bend;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const cx = mx - dy * k * 2, cy = my + dx * k * 2;
    for (let i = 0; i <= 32; i++) {
      const t = i / 32, u = 1 - t;
      out.push({ x: u * u * a.x + 2 * u * t * cx + t * t * b.x, y: u * u * a.y + 2 * u * t * cy + t * t * b.y });
    }
    return out;
  }
  const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    const steps = 16;
    for (let s = (i === 0 ? 0 : 1); s <= steps; s++) {
      const t = s / steps, u = 1 - t;
      out.push({
        x: u * u * u * p1.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p2.x,
        y: u * u * u * p1.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p2.y
      });
    }
  }
  return out;
}
function polyCentroid(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const f = p.x * q.y - q.x * p.y;
    a += f; cx += (p.x + q.x) * f; cy += (p.y + q.y) * f;
  }
  if (Math.abs(a) < 1e-9) {
    const b = bbox(pts);
    return { x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2 };
  }
  return { x: cx / (3 * a), y: cy / (3 * a) };
}
function bbox(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
  return { x0: x0, y0: y0, x1: x1, y1: y1 };
}
// Punti di un elemento in pixel della carta.
function itemWorldPoints(item, W, H) {
  if (item.type === 'pin' || item.type === 'label') return [{ x: item.x * W, y: item.y * H }];
  return (item.points || []).map(p => ({ x: p[0] * W, y: p[1] * H }));
}
function itemBBox(item, W, H) {
  const pts = itemWorldPoints(item, W, H);
  if (!pts.length) return null;
  return bbox(item.type === 'area' || item.type === 'arrow' ? smoothPoints(pts, item.type === 'area', item.curved !== false, item.bend) : pts);
}

// ---------- Avvisi e dialoghi ----------
function toast(msg, kind) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    wrap.setAttribute('role', 'status');
    wrap.setAttribute('aria-live', 'polite');
    document.body.appendChild(wrap);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6500 : 3800);
}
function makeDialog(html, cls) {
  const d = document.createElement('dialog');
  d.className = 'dlg' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener('close', () => setTimeout(() => d.remove(), 0));
  return d;
}
function confirmBox(message, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const d = makeDialog(`
      <div class="dlg-head"><h2>${esc(opts.title || 'Conferma')}</h2></div>
      <div class="dlg-body"><p style="margin:0 0 8px">${esc(message)}</p></div>
      <div class="dlg-foot">
        <button class="btn btn-ghost" data-no type="button">${esc(opts.cancel || 'Annulla')}</button>
        <button class="btn ${opts.danger ? 'btn-danger' : ''}" data-yes type="button">${esc(opts.ok || 'Conferma')}</button>
      </div>`);
    let answer = false;
    d.querySelector('[data-no]').onclick = () => d.close();
    d.querySelector('[data-yes]').onclick = () => { answer = true; d.close(); };
    d.addEventListener('close', () => resolve(answer));
    d.showModal();
    d.querySelector('[data-yes]').focus();
  });
}

// ---------- Documento ----------
function emptyDoc() {
  return {
    app: 'MapLab', version: MAPLAB_VERSION,
    title: '', description: '', author: '', mapCredit: '',
    map: null,
    categories: [
      { id: newId(8), name: 'Luogo', icon: 'map-pin', color: '#2c5a7c' },
      { id: newId(8), name: 'Evento', icon: 'flag', color: '#b23a2e' },
      { id: newId(8), name: 'Personaggio', icon: 'user', color: '#5b4a9e' }
    ],
    items: [], tour: [],
    settings: { quiz: true, tlSpeed: 3, tlMode: 'years', timeline: true }
  };
}
// Completa i campi mancanti (file creati con versioni precedenti o incompleti).
function normalizeDoc(d) {
  d = d || {};
  d.app = 'MapLab';
  d.version = d.version || MAPLAB_VERSION;
  ['title', 'description', 'author', 'mapCredit'].forEach(k => { if (typeof d[k] !== 'string') d[k] = ''; });
  if (!Array.isArray(d.categories)) d.categories = [];
  if (!Array.isArray(d.items)) d.items = [];
  if (!Array.isArray(d.tour)) d.tour = [];
  if (!d.settings || typeof d.settings !== 'object') d.settings = {};
  if (d.settings.quiz == null) d.settings.quiz = true;
  d.settings.tlSpeed = clamp(Math.round(Number(d.settings.tlSpeed) || 3), 1, 5);
  if (d.settings.tlMode !== 'events') d.settings.tlMode = 'years';
  if (d.settings.timeline == null) d.settings.timeline = true;
  // Versione precedente: grandezza unica per tutte le puntine → la porto su ogni puntina.
  if (d.settings.pinScale != null) {
    const g = clamp(Number(d.settings.pinScale) || 1, 0.5, 2.5);
    if (g !== 1) d.items.forEach(it => { if (it && it.type === 'pin' && it.size == null) it.size = g; });
    delete d.settings.pinScale;
  }
  d.items = d.items.filter(it => it && it.id && ['pin', 'arrow', 'area', 'label'].indexOf(it.type) !== -1);
  d.tour = d.tour.filter(st => st && st.ref);
  return d;
}

// ---------- Visualizzatore della carta ----------
// Coordinate "mondo" = pixel della carta alla risoluzione piena (doc.map.w × doc.map.h).
// Gli elementi salvano posizioni normalizzate (0–1), così la carta si può sostituire.
class MapView {
  constructor(el, opts) {
    this.el = el;
    this.o = opts || {};
    this.doc = null;
    this.assets = null;
    this.W = 0; this.H = 0;
    this.s = 1; this.tx = 0; this.ty = 0;
    this.fitScale = 1; this.minScale = 0.1; this.maxScale = 4;

    this.pointers = new Map();
    this.gesture = null;
    this.selectedId = null;
    this.tl = null;               // stato della linea del tempo
    this.quiz = null;             // {revealed:Set} in modalità ripasso
    this.hiddenLayers = new Set(); // 'pin','arrow','area','label'
    this.hiddenCats = new Set();
    this.hiddenIds = null;        // Set di id da nascondere (filtri esterni)
    this.uiScale = 1;
    this.insets = { top: 0, right: 0, bottom: 0, left: 0 };
    this.tileCache = new Map();
    this._raf = 0;
    this._anim = null;
    this.dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

    el.classList.add('mv');
    el.tabIndex = 0;
    el.setAttribute('role', 'application');
    el.setAttribute('aria-label', 'Carta: trascina per spostarti, rotellina o pizzico per ingrandire');
    el.innerHTML = `
      <canvas class="mv-canvas"></canvas>
      <div class="mv-vec"></div>
      <svg class="mv-ov" aria-hidden="false"><defs></defs><g class="mv-areas"></g><g class="mv-arrows"></g><g class="mv-labels"></g></svg>
      <div class="mv-pins"></div>
      <svg class="mv-hd"></svg>
      <div class="mv-empty" hidden></div>
      <div class="mv-ctrl">
        <button type="button" data-z="in" aria-label="Ingrandisci" title="Ingrandisci">${ui('plus')}</button>
        <button type="button" data-z="out" aria-label="Rimpicciolisci" title="Rimpicciolisci">${ui('minus')}</button>
        <button type="button" data-z="fit" aria-label="Mostra tutta la carta" title="Mostra tutta la carta">${ui('fit')}</button>
      </div>`;
    this.canvas = el.querySelector('.mv-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.vecEl = el.querySelector('.mv-vec');
    this.ov = el.querySelector('.mv-ov');
    this.defs = this.ov.querySelector('defs');
    this.gAreas = this.ov.querySelector('.mv-areas');
    this.gArrows = this.ov.querySelector('.mv-arrows');
    this.gLabels = this.ov.querySelector('.mv-labels');
    this.pinsEl = el.querySelector('.mv-pins');
    this.hd = el.querySelector('.mv-hd');
    this.emptyEl = el.querySelector('.mv-empty');
    this.ctrlEl = el.querySelector('.mv-ctrl');

    this.ctrlEl.addEventListener('click', e => {
      const b = e.target.closest('[data-z]');
      if (!b) return;
      const c = this.viewCenter();
      if (b.dataset.z === 'fit') this.fit(true);
      else this.zoomAt(b.dataset.z === 'in' ? 1.6 : 1 / 1.6, c.x, c.y, true);
    });
    el.addEventListener('pointerdown', e => this._down(e));
    el.addEventListener('pointermove', e => this._move(e));
    el.addEventListener('pointerup', e => this._up(e));
    el.addEventListener('pointercancel', e => this._up(e, true));
    el.addEventListener('pointerleave', e => { if (!this.pointers.size && this.o.onHover) this.o.onHover(null, null); });
    el.addEventListener('wheel', e => {
      if (!this.W || e.target.closest('.mv-ctrl')) return;
      e.preventDefault();
      const r = this.el.getBoundingClientRect();
      this._lastWheel = performance.now();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 30;
      this.zoomAt(Math.exp(-dy * 0.0016), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    el.addEventListener('keydown', e => {
      if (e.target !== el) return;
      const step = 70;
      const map = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      const c = this.viewCenter();
      if (map[e.key]) { e.preventDefault(); this.panBy(map[e.key][0], map[e.key][1]); }
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); this.zoomAt(1.4, c.x, c.y, true); }
      else if (e.key === '-') { e.preventDefault(); this.zoomAt(1 / 1.4, c.x, c.y, true); }

    const first = !this.W;
    this.W = m.w; this.H = m.h;
    if (m.kind === 'svg' && this.assets.svg) {
      const svgMarkup = this.assets.svg;
      this.vecEl.innerHTML = `<svg class="mv-vec-svg" xmlns="http://www.w3.org/2000/svg"><g><rect width="${m.w}" height="${m.h}" fill="#fff"/>${svgMarkup}</g></svg>`;
      this.vecSvg = this.vecEl.firstChild;
      this.vecG = this.vecSvg.firstChild;
      const inner = this.vecG.querySelector('svg');
      if (inner) { inner.setAttribute('width', m.w); inner.setAttribute('height', m.h); inner.setAttribute('x', 0); inner.setAttribute('y', 0); }
      this._crisp = null;
    }
    this._computeFit();
    if (first || this.atFit) this.fit(false);
  }
  showMessage(text) {
    this.emptyEl.innerHTML = text || '';
    this.emptyEl.hidden = !text;
    this.ctrlEl.hidden = !!text;
  }

  // Ricostruisce puntine e disegni (dopo una modifica ai dati).
  refresh() {
    if (!this.doc) return;
    this._applyPinScale();
    this._buildOverlay();
    this._buildPins();
    this.render();
  }

  _visibleState(it) {
    if (this.hiddenLayers.has(it.type)) return 'hide';
    if (this.hiddenIds && this.hiddenIds.has(it.id)) return 'hide';
    if (it.type === 'pin' && this.hiddenCats.size) {
      const key = catById(this.doc, it.categoryId) ? it.categoryId : '';
      if (this.hiddenCats.has(key)) return 'hide';
    }
    if (this.forceShowId && it.id === this.forceShowId) return 'show';
    return timeState(it, this.tl);
  }

  _buildPins() {
    const doc = this.doc;
    const pins = doc.items.filter(it => it.type === 'pin');
    const quiz = this.quiz;
    this.pinsEl.innerHTML = pins.map(p => {
      const cat = catById(doc, p.categoryId);
      const st = this._visibleState(p);
      const hidden = quiz && !quiz.revealed.has(p.id);
      const mark = quiz ? (quiz.revealed.has(p.id) ? null : '?') : (p._mark || null);
      const label = hidden ? 'Puntina da indovinare' : itemTitle(p);
      const cls = ['mv-pin'];
      if (p.id === this.selectedId) cls.push('is-sel');
      if (st === 'fade') cls.push('is-faded');
      if (quiz && quiz.results && quiz.results[p.id]) cls.push('q-' + quiz.results[p.id]);
      const ps = pinSize(p);
      return `<button type="button" class="${cls.join(' ')}" data-hit="item" data-id="${esc(p.id)}" ${ps !== 1 ? `style="--ps:${ps}"` : ''} ${st === 'hide' ? 'hidden' : ''} aria-label="${esc(label)}" ${hidden ? '' : `title="${esc(label)}"`}>${pinSvg(itemColor(p, doc), cat && cat.icon, mark)}</button>`;
    }).join('');
    this.pinEls = Array.from(this.pinsEl.children).map((el, i) => ({ el: el, item: pins[i] }));
  }

  _buildOverlay() {
    const doc = this.doc, W = this.W, H = this.H;
    const NS = 'http://www.w3.org/2000/svg';
    this.defs.innerHTML = '';
    this.gAreas.innerHTML = ''; this.gArrows.innerHTML = ''; this.gLabels.innerHTML = '';
    this.ovItems = [];
    if (!W) return;
    const mk = (tag, attrs, parent) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    };
    const quiz = this.quiz;
    doc.items.forEach(it => {
      if (it.type === 'pin') return;
      const st = this._visibleState(it);
      const color = itemColor(it, doc);
      const sel = it.id === this.selectedId;
      if (it.type === 'area') {
        if (!it.points || it.points.length < 3) return;
        const g = mk('g', { class: 'mv-item mv-area' + (sel ? ' is-sel' : '') + (st === 'fade' ? ' is-faded' : ''), 'data-hit': 'item', 'data-id': it.id }, this.gAreas);
        if (st === 'hide') g.setAttribute('display', 'none');
        const op = it.opacity == null ? 0.35 : it.opacity;
        let fill = color, fillOp = op;
        let pat = null;
        if (it.fill === 'hatch') {
          const pid = 'pat-' + it.id;
          pat = mk('pattern', { id: pid, patternUnits: 'userSpaceOnUse', width: 12, height: 12 }, this.defs);
          mk('rect', { width: 12, height: 12, fill: color, 'fill-opacity': op * 0.35 }, pat);
          mk('rect', { x: 0, y: 0, width: 4, height: 12, fill: color, 'fill-opacity': Math.min(1, op * 1.6) }, pat);
          fill = `url(#${pid})`; fillOp = 1;
        }
        const pFill = mk('path', { class: 'mv-area-fill', fill: fill, 'fill-opacity': fillOp, 'pointer-events': 'all' }, g);
        const dash = it.border === 'dashed' ? '9 6' : null;
        const pStroke = mk('path', { class: 'mv-area-stroke', fill: 'none', stroke: it.border === 'none' ? 'none' : color, 'stroke-width': 2.2 * this.uiScale, 'stroke-dasharray': dash, 'stroke-linejoin': 'round', 'pointer-events': 'none' }, g);
        let name = null;
        const showName = it.showName !== false && (it.title || '').trim() && !(quiz && !quiz.revealed.has(it.id));
        if (showName) name = mk('text', { class: 'mv-area-name', 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: shade(color, -0.45) }, g);
        if (name) name.textContent = it.title.trim();
        let qmark = null;
        if (quiz && !quiz.revealed.has(it.id)) { qmark = mk('text', { class: 'mv-q', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, g); qmark.textContent = '?'; }
        const pts = itemWorldPoints(it, W, H);
        const smooth = smoothPoints(pts, true, it.curved !== false);
        this.ovItems.push({ item: it, g: g, parts: { fill: pFill, stroke: pStroke, name: name, q: qmark, pat: pat }, world: smooth, centroid: polyCentroid(smooth), bb: bbox(smooth) });
      } else if (it.type === 'arrow') {
        if (!it.points || it.points.length < 2) return;
        const g = mk('g', { class: 'mv-item mv-arrow' + (sel ? ' is-sel' : '') + (st === 'fade' ? ' is-faded' : ''), 'data-hit': 'item', 'data-id': it.id }, this.gArrows);
        if (st === 'hide') g.setAttribute('display', 'none');
        const w = arrowWidth(it) * this.uiScale;
        const dash = it.dash === 'dashed' ? `${w * 2.4} ${w * 1.6}` : it.dash === 'dotted' ? `0.1 ${w * 2}` : null;
        const hit = mk('path', { class: 'mv-hit', fill: 'none', stroke: 'transparent', 'stroke-width': Math.max(18, w + 12), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'stroke' }, g);
        const halo = mk('path', { fill: 'none', stroke: '#fff', 'stroke-opacity': 0.75, 'stroke-width': w + 3.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': dash, 'pointer-events': 'none' }, g);
        const line = mk('path', { class: 'mv-arrow-line', fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': dash, 'pointer-events': 'none' }, g);
        const heads = [];
        const hs = it.heads || 'end';
        if (hs === 'end' || hs === 'both') heads.push({ end: true, el: mk('path', { fill: color, stroke: '#fff', 'stroke-width': 1.2, 'stroke-opacity': 0.8, 'stroke-linejoin': 'round' }, g) });
        if (hs === 'both') heads.push({ end: false, el: mk('path', { fill: color, stroke: '#fff', 'stroke-width': 1.2, 'stroke-opacity': 0.8, 'stroke-linejoin': 'round' }, g) });
        let qmark = null;
        if (quiz && !quiz.revealed.has(it.id)) { qmark = mk('text', { class: 'mv-q', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, g); qmark.textContent = '?'; }
        const pts = itemWorldPoints(it, W, H);
        const smooth = smoothPoints(pts, false, it.curved !== false, it.bend);
        this.ovItems.push({ item: it, g: g, parts: { hit: hit, halo: halo, line: line, heads: heads, w: w, q: qmark }, world: smooth, bb: bbox(smooth) });
      } else if (it.type === 'label') {
        const g = mk('g', { class: 'mv-item mv-label' + (sel ? ' is-sel' : '') + (st === 'fade' ? ' is-faded' : ''), 'data-hit': 'item', 'data-id': it.id }, this.gLabels);
        if (st === 'hide') g.setAttribute('display', 'none');
        const hiddenQ = quiz && !quiz.revealed.has(it.id);
        const lines = String(it.text || 'Testo').split('\n');
        const style = labelStyle(it);
        let box = null;
        if (hiddenQ) box = mk('rect', { class: 'mv-qbox', rx: 4 }, g);
        const t = mk('text', {
          class: 'mv-label-text', 'text-anchor': 'middle', fill: hiddenQ ? 'transparent' : color,
          'font-style': style.italic ? 'italic' : null, 'font-weight': style.bold ? '700' : '500',
          'font-family': 'var(--serif)', stroke: hiddenQ ? 'none' : (it.halo === false ? 'none' : haloFor(color)),
          'paint-order': 'stroke', 'stroke-linejoin': 'round'
        }, g);
        lines.forEach((ln, i) => {
          const ts = mk('tspan', { x: 0, dy: i === 0 ? 0 : '1.15em' }, t);
          ts.textContent = style.upper ? ln.toUpperCase() : ln;
        });
        let q = null;
        if (hiddenQ) { q = mk('text', { class: 'mv-q', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, g); q.textContent = '?'; }
        this.ovItems.push({ item: it, g: g, parts: { text: t, lines: lines.length, box: box, q: q, style: style, maxLen: Math.max(...lines.map(l => l.length)) }, world: [{ x: it.x * W, y: it.y * H }] });
      }
    });
  }

  applyVisibility() {
    // Aggiorna solo la visibilità (linea del tempo, filtri) senza ricostruire tutto.
    if (!this.doc) return;
    (this.pinEls || []).forEach(({ el, item }) => {
      const st = this._visibleState(item);
      el.hidden = st === 'hide';
      el.classList.toggle('is-faded', st === 'fade');
    });
    (this.ovItems || []).forEach(o => {
      const st = this._visibleState(o.item);
      if (st === 'hide') o.g.setAttribute('display', 'none'); else o.g.removeAttribute('display');
      o.g.classList.toggle('is-faded', st === 'fade');
    });
    this.render();
  }

  setSelected(id) {
    this.selectedId = id;
    (this.pinEls || []).forEach(({ el, item }) => el.classList.toggle('is-sel', item.id === id));
    (this.ovItems || []).forEach(o => o.g.classList.toggle('is-sel', o.item.id === id));
    this.render();
  }

  // ---------- Coordinate ----------
  toScreen(x, y) { return { x: x * this.s + this.tx, y: y * this.s + this.ty }; }
  toWorld(sx, sy) { return { x: (sx - this.tx) / this.s, y: (sy - this.ty) / this.s }; }
  size() { return { w: this.el.clientWidth, h: this.el.clientHeight }; }
  viewCenter() {
    const z = this.size(), i = this.insets;
    return { x: i.left + (z.w - i.left - i.right) / 2, y: i.top + (z.h - i.top - i.bottom) / 2 };
  }
  getView() {
    // Inquadratura salvabile: il rettangolo visibile, in coordinate normalizzate.
    const z = this.size(), i = this.insets;
    const a = this.toWorld(i.left, i.top), b = this.toWorld(z.w - i.right, z.h - i.bottom);
    const r = v => Math.round(v * 10000) / 10000;
    return { x0: r(clamp(a.x / this.W, 0, 1)), y0: r(clamp(a.y / this.H, 0, 1)), x1: r(clamp(b.x / this.W, 0, 1)), y1: r(clamp(b.y / this.H, 0, 1)) };
  }
  setView(v, animate) {
    if (!v || v.x1 == null) return;
    this.fitBox({ x0: v.x0 * this.W, y0: v.y0 * this.H, x1: v.x1 * this.W, y1: v.y1 * this.H, exact: true }, animate);
  }
  // Per i movimenti automatici: se la carta è più grande della finestra,
  // evito di mostrare il vuoto oltre i bordi.
  _cover(s, tx, ty) {
    const z = this.size(), i = this.insets;
    const vw = z.w - i.left - i.right, vh = z.h - i.top - i.bottom;
    const mw = this.W * s, mh = this.H * s;
    if (mw >= vw) tx = clamp(tx, i.left + vw - mw, i.left); else tx = i.left + (vw - mw) / 2;
    if (mh >= vh) ty = clamp(ty, i.top + vh - mh, i.top); else ty = i.top + (vh - mh) / 2;
    return { tx: tx, ty: ty };
  }

  _resize() {
    const z = this.size();
    if (!z.w || !z.h) return;
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    this.dpr = dpr;
    this.canvas.width = Math.round(z.w * dpr);
    this.canvas.height = Math.round(z.h * dpr);
    this.canvas.style.width = z.w + 'px';
    this.canvas.style.height = z.h + 'px';
    if (!this.W) return;
    const old = this.fitScale;
    this._computeFit();
    if (this.atFit || !this._sized) this.fit(false);
    else this.render();
    this._sized = true;
    this._crisp = null;
  }
  _computeFit() {
    const z = this.size(), i = this.insets;
    if (!this.W || !z.w || !z.h) return;
    const w = Math.max(50, z.w - i.left - i.right), h = Math.max(50, z.h - i.top - i.bottom);
    this.fitScale = Math.min(w / this.W, h / this.H) * 0.96;
    this.minScale = this.fitScale * 0.5;
    const nativeMax = this.doc && this.doc.map && this.doc.map.kind === 'svg' ? this.fitScale * 250 : 2.2;
    this.maxScale = Math.max(this.fitScale * 4, nativeMax);
  }
  fit(animate) {
    if (!this.W) return;
    this._computeFit();
    const c = this.viewCenter();
    const s = this.fitScale;
    this._goto(s, c.x - this.W * s / 2, c.y - this.H * s / 2, animate);
    this.atFit = true;
  }
  fitBox(b, animate, maxFactor) {
    // Inquadra un rettangolo (pixel carta) lasciando un po' di margine.
    if (!this.W || !b) return;
    this._computeFit();
    const z = this.size(), i = this.insets;
    const pad = b.exact ? 0 : 80;
    const vw = Math.max(80, z.w - i.left - i.right - pad), vh = Math.max(80, z.h - i.top - i.bottom - (b.exact ? 0 : 100));
    const bw = Math.max(1, b.x1 - b.x0), bh = Math.max(1, b.y1 - b.y0);
    let s = Math.min(vw / bw, vh / bh);
    if (!b.exact) s = Math.min(s, this.fitScale * (maxFactor || 3));
    s = clamp(Math.max(s, this.fitScale), this.minScale, this.maxScale);
    const c = this.viewCenter();
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    const t = this._cover(s, c.x - cx * s, c.y - cy * s);
    this._goto(s, t.tx, t.ty, animate);
    this.atFit = false;
  }
  focusItem(item, animate) {
    const b = itemBBox(item, this.W, this.H);
    if (!b) return;
    if (item.type === 'pin') { b.pinOffset = true; b.y0 -= 40 / this.fitScale / 3; }
    if (item.type === 'pin' || item.type === 'label') {
      // Un punto: ingrandisco quanto basta, senza esagerare.
      const s = clamp(Math.max(this.s, this.fitScale * 2.2), this.minScale, this.maxScale);
      const c = this.viewCenter();
      const p = itemWorldPoints(item, this.W, this.H)[0];
      const t = this._cover(s, c.x - p.x * s, c.y - p.y * s + (item.type === 'pin' ? 20 : 0));
      this._goto(s, t.tx, t.ty, animate);
      this.atFit = false;
      return;
    }
    this.fitBox(b, animate, 4);
  }
  // Porta un punto dentro l'area visibile se è fuori (senza cambiare zoom).
  ensureVisible(item) {
    const b = itemBBox(item, this.W, this.H);
    if (!b) return;
    const z = this.size(), i = this.insets;
    const a = this.toScreen(b.x0, b.y0), c = this.toScreen(b.x1, b.y1);
    const m = 40;
    if (a.x >= i.left + m && c.x <= z.w - i.right - m && a.y >= i.top + m && c.y <= z.h - i.bottom - m) return;
    this.focusItem(item, true);
  }
  zoomAt(factor, cx, cy, animate) {
    if (!this.W) return;
    const s2 = clamp(this.s * factor, this.minScale, this.maxScale);
    const tx = cx - (cx - this.tx) * (s2 / this.s);
    const ty = cy - (cy - this.ty) * (s2 / this.s);
    this._goto(s2, tx, ty, animate);
    this.atFit = false;
  }
  panBy(dx, dy) {
    this._goto(this.s, this.tx + dx, this.ty + dy, false);
    this.atFit = false;
  }
  _clamp() {
    const z = this.size();
    const keep = 80;
    this.tx = Math.min(z.w - keep, Math.max(keep - this.W * this.s, this.tx));
    this.ty = Math.min(z.h - keep, Math.max(keep - this.H * this.s, this.ty));
  }
  _goto(s, tx, ty, animate) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this._anim = null;
    if (!animate || reduce) {
      this.s = s; this.tx = tx; this.ty = ty;
      this._clamp();
      this.render();
      this._viewChanged();
      return;
    }
    const from = { s: this.s, tx: this.tx, ty: this.ty }, t0 = performance.now(), dur = 420;
    // Interpolo in modo che lo zoom sia lineare in scala logaritmica.
    const anim = { from: from, to: { s: s, tx: tx, ty: ty } };
    this._anim = anim;
    const step = now => {
      if (this._anim !== anim) return;
      let t = Math.min(1, (now - t0) / dur);
      t = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const ls = Math.log(from.s) + (Math.log(s) - Math.log(from.s)) * t;
      const sN = Math.exp(ls);
      // Punto fisso: interpolo la posizione del centro schermo nel mondo.
      const c = this.viewCenter();
      const w0 = { x: (c.x - from.tx) / from.s, y: (c.y - from.ty) / from.s };
      const w1 = { x: (c.x - tx) / s, y: (c.y - ty) / s };
      const wx = w0.x + (w1.x - w0.x) * t, wy = w0.y + (w1.y - w0.y) * t;
      this.s = sN; this.tx = c.x - wx * sN; this.ty = c.y - wy * sN;
      this._clamp();
      this.render(true);
      if (t < 1) requestAnimationFrame(step);
      else { this._anim = null; this._viewChanged(); }
    };
    requestAnimationFrame(step);
  }
  _viewChanged() {
    clearTimeout(this._vcT);
    this._vcT = setTimeout(() => { if (this.o.onView) this.o.onView(); }, 150);
  }

  // ---------- Disegno ----------
  render(now) {
    if (now) { this._draw(); return; }
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = 0; this._draw(); });
  }
  _draw() {
    if (!this.W) {
      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      return;
    }
    this.el.style.setProperty('--mv-s', this.s);
    if (this.doc.map.kind === 'svg') this._drawVector(); else this._drawTiles();
    this._drawOverlay();
    this._drawPins();
    if (this.o.onRender) this.o.onRender(this);
  }

  _drawTiles() {
    const ctx = this.ctx, dpr = this.dpr, m = this.doc.map;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    const X0 = Math.round((this.tx) * dpr), Y0 = Math.round(this.ty * dpr);
    const X1 = Math.round((this.tx + this.W * this.s) * dpr), Y1 = Math.round((this.ty + this.H * this.s) * dpr);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.28)';
    ctx.shadowBlur = 14 * dpr;
    ctx.shadowOffsetY = 2 * dpr;
    ctx.fillStyle = '#fff';
    ctx.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
    ctx.restore();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const levels = m.levels || [];
    if (!levels.length) return;
    const need = this.W * this.s * dpr;
    let target = levels.length - 1;
    for (let k = 0; k < levels.length; k++) { if (levels[k].w >= need * 0.92) { target = k; break; } }
    const drawLevel = (k, load) => {
      const L = levels[k], TS = m.tile;
      const f = this.W / L.w; // pixel carta per pixel del livello
      const z = this.size();
      const wx0 = Math.max(0, (-this.tx) / this.s), wy0 = Math.max(0, (-this.ty) / this.s);
      const wx1 = Math.min(this.W, (z.w - this.tx) / this.s), wy1 = Math.min(this.H, (z.h - this.ty) / this.s);
      if (wx1 <= wx0 || wy1 <= wy0) return true;
      const c0 = Math.floor(wx0 / f / TS), c1 = Math.min(L.cols - 1, Math.floor((wx1 / f - 0.001) / TS));
      const r0 = Math.floor(wy0 / f / TS), r1 = Math.min(L.rows - 1, Math.floor((wy1 / f - 0.001) / TS));
      let complete = true;
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          const key = k + '/' + c + '/' + r;
          const t = this._tile(key, load);
          if (!t || !t.ready) { complete = false; continue; }
          const lx0 = c * TS, ly0 = r * TS;
          const lx1 = Math.min(L.w, lx0 + TS), ly1 = Math.min(L.h, ly0 + TS);
          const sx0 = Math.round((lx0 * f * this.s + this.tx) * dpr), sy0 = Math.round((ly0 * f * this.s + this.ty) * dpr);
          const sx1 = Math.round((lx1 * f * this.s + this.tx) * dpr), sy1 = Math.round((ly1 * f * this.s + this.ty) * dpr);
          ctx.drawImage(t.img, 0, 0, lx1 - lx0, ly1 - ly0, sx0, sy0, sx1 - sx0, sy1 - sy0);
          t.used = performance.now();
        }
      }
      return complete;
    };
    // Prima il livello più grossolano (sempre pronto), poi quelli intermedi già
    // in memoria, infine il livello giusto per lo zoom attuale.
    drawLevel(0, true);
    for (let k = 1; k < target; k++) {
      if (k >= target - 2) drawLevel(k, false);
    }
    if (target > 0) drawLevel(target, true);
    this._evictTiles();
  }
  _tile(key, load) {
    let t = this.tileCache.get(key);
    if (t) return t;
    if (!load) return null;
    const src = this.assets.tiles && this.assets.tiles[key];
