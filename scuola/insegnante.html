<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapLab — Pannello insegnante</title>
<style>
:root{
  --ink:#1d2529;
  --ink-2:#55626a;
  --ink-3:#7d888e;
  --line:#d3d9da;
  --line-2:#e6eaea;
  --surface:#ffffff;
  --bg:#eef1f0;
  --bar:#1e2f36;
  --bar-ink:#e8efee;
  --bar-ink-2:#a9bbbd;
  --accent:#2c5a66;
  --accent-hover:#234a54;
  --accent-soft:#e1ecee;
  --danger:#a3312a;
  --danger-soft:#f7e6e4;
  --ok:#2f6b3a;
  --ok-soft:#e3f1e5;
  --warn:#7a5200;
  --warn-soft:#fbf0d9;
  --map-bg:#d6dcda;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:6px;
  --r-md:10px;
  --shadow:0 10px 30px rgba(20,32,38,.18),0 2px 6px rgba(20,32,38,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #5aa3b3;outline-offset:2px}

/* ---------- Barra superiore ---------- */
.topbar{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;background:var(--bar);color:var(--bar-ink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;white-space:nowrap;color:inherit;text-decoration:none}
.brand svg{flex:none}
.topbar .sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.18)}
.topbar-title{font-family:var(--serif);font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.topbar .btn-ghost{color:var(--bar-ink);border-color:rgba(255,255,255,.28)}
.topbar .btn-ghost:hover{background:rgba(255,255,255,.08)}

/* ---------- Pulsanti ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--accent);color:#fff;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{flex:none}
.btn-ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:#86271f}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:#e3c3bf}
.btn-danger-ghost:hover{background:var(--danger-soft)}
.btn-sm{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn-icon{width:38px;padding:0}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Campi ---------- */
.field{display:block;margin:0 0 14px}
.field > .label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .hint{display:block;font-size:.8rem;color:var(--ink-3);margin-top:4px}
.input,textarea.input,select.input{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(44,90,102,.18)}
.check{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Finestre di dialogo ---------- */
dialog.dlg{border:none;padding:0;border-radius:var(--r-md);box-shadow:var(--shadow);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--ink);overflow:hidden}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg > form,dialog.dlg > .capsule{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
dialog.dlg.wide{width:min(760px,calc(100vw - 24px))}
dialog.dlg::backdrop{background:rgba(18,28,33,.55)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.dlg-head h2{margin:0;font-size:1.1rem;flex:1}
.dlg-body{padding:6px 18px 8px;overflow:auto;flex:1 1 auto;min-height:0}
.dlg-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
.dlg-foot .left{margin-right:auto}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:4px 0 0}

/* ---------- Avvisi ---------- */
.toast-wrap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:1000;width:min(460px,calc(100vw - 32px));pointer-events:none}
.toast{padding:10px 14px;border-radius:var(--r-sm);background:var(--bar);color:#fff;box-shadow:var(--shadow);font-size:.92rem;pointer-events:auto}
.toast.err{background:var(--danger);color:#fff;margin:0}
.toast.ok{background:var(--ok)}
.notice{padding:10px 12px;border-radius:var(--r-sm);font-size:.88rem;background:var(--accent-soft);color:var(--accent-hover)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.danger{background:var(--danger-soft);color:var(--danger)}

/* ---------- Chip ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.closed{background:var(--danger-soft);color:var(--danger)}
.chip.muted{background:#eceeee;color:var(--ink-3)}

/* ---------- Visualizzatore mappa ---------- */
.viewer{position:relative;overflow:hidden;background:var(--map-bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.viewer.dragging{cursor:grabbing}
.viewer.placing{cursor:crosshair}
.viewer .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.viewer .stage.animating{transition:transform .35s ease}
.viewer .map-img{display:block;width:100%;height:100%;pointer-events:none;box-shadow:0 2px 14px rgba(0,0,0,.25);background:#fff}
.viewer .pins{position:absolute;inset:0}
.pin{position:absolute;width:0;height:0;transform:scale(var(--inv,1))}
.pin-btn{position:absolute;left:-15px;top:-40px;width:30px;height:40px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transform-origin:50% 100%;transition:transform .12s}
.pin-btn:hover,.pin.is-active .pin-btn{transform:scale(1.22)}
.pin.is-active{z-index:5}
.pin.ghost .pin-btn{opacity:.75;pointer-events:none}
.pin.pending .pin-btn{opacity:.6}
.pending-note{color:var(--accent);font-weight:600}
.save-status{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.12);color:var(--bar-ink)}
.save-status .dot{width:8px;height:8px;border-radius:50%;background:#f0c05a;animation:pulse 1s ease-in-out infinite alternate}
.save-status[data-state="saved"]{color:#bfe3c6}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.save-status .dot{animation:none}}
.pin svg{display:block}
.viewer-empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.viewer-controls{position:absolute;right:12px;top:12px;display:grid;gap:6px;z-index:10}
.viewer-controls button{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.viewer-controls button:hover{background:var(--accent-soft)}
.placing-banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--bar);color:#fff;box-shadow:var(--shadow);font-size:.9rem;max-width:calc(100% - 90px)}
.placing-banner .btn{min-height:30px;padding:3px 12px;background:#fff;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.viewer .stage.animating{transition:none}.pin-btn{transition:none}}

/* ---------- Capsula (contenuto di una puntina) ---------- */
.capsule{display:flex;flex-direction:column}
.capsule-author{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#f5f7f7;border-bottom:1px solid var(--line-2)}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1rem;letter-spacing:.02em}
.avatar.small{width:30px;height:30px;font-size:.8rem}
.author-name{font-weight:700;font-size:.95rem;line-height:1.2}
.author-sub{font-size:.8rem;color:var(--ink-2);margin-top:2px}
.capsule-author .close{margin-left:auto}
.capsule-main{padding:16px 18px 6px;overflow:auto;flex:1 1 auto;min-height:0}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.cat-chip .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.capsule-title{font-family:var(--serif);font-size:1.45rem;line-height:1.2;margin:10px 0 8px;overflow-wrap:anywhere}
.capsule-text{font-size:1rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px;max-width:62ch}
.capsule-text.empty{color:var(--ink-3);font-style:italic}
.capsule-figure{margin:4px 0 12px}
.capsule-figure img{display:block;max-width:100%;max-height:50vh;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#f3f3f3}
.capsule-dates{font-size:.78rem;color:var(--ink-3);padding:0 18px 12px}
.capsule-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line-2)}

/* ---------- Modulo puntina ---------- */
.form-pin-preview{flex:none;width:30px;height:40px}
.cat-choices{display:flex;flex-wrap:wrap;gap:6px}
.cat-choice{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:.88rem}
.cat-choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-hover);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.swatch-custom{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2);cursor:pointer}
.swatch-custom.on input{box-shadow:0 0 0 3px var(--ink)}
.swatch-custom input{width:36px;height:32px;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;cursor:pointer}
.img-preview{display:flex;align-items:center;gap:10px;margin-top:8px}
.img-preview img{width:84px;height:64px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}

/* ---------- Griglia icone ---------- */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px}
.icon-opt{display:grid;place-items:center;aspect-ratio:1;padding:0;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;cursor:pointer;color:var(--ink)}
.icon-opt:hover{background:var(--accent-soft)}
.icon-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-hover);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}

.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(238,241,240,.7);z-index:20}
.muted{color:var(--ink-3)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


body{display:grid;grid-template-rows:auto 1fr;height:100dvh;overflow:hidden}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:7px 12px;border-radius:var(--r-sm);color:var(--bar-ink-2);text-decoration:none;font-weight:600;font-size:.92rem}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14)}
.content{overflow:auto;min-height:0}
.page-inner{max-width:1080px;margin:0 auto;padding:24px 16px 56px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.view-head h1{font-family:var(--serif);font-weight:600;font-size:1.7rem;margin:0}
.view-head p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}

.map-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.map-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;overflow:hidden;color:inherit;text-decoration:none}
.map-card:hover{border-color:var(--accent)}
.map-card .thumb{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--map-bg);display:block}
.map-card .body{padding:12px 14px 14px;display:grid;gap:8px}
.map-card h3{font-family:var(--serif);margin:0;font-size:1.12rem}
.map-card.archived{opacity:.7}
.empty-state{padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--ink-2);background:#fff}

/* Dettaglio mappa */
.detail{display:grid;grid-template-rows:auto auto 1fr;height:100%;min-height:0}
.detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.detail-head h1{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0;min-width:0;overflow-wrap:anywhere}
.detail-head .grow{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:11px 14px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.92rem;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab-body{min-height:0;overflow:auto}
.tab-map{position:relative;height:100%}
.tab-map .viewer{position:absolute;inset:0}
.tab-map .map-actions{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:12}
.tab-map .map-actions .btn{box-shadow:var(--shadow);border-radius:999px;min-height:44px;padding:10px 18px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:1.05rem}
.card > p.sub{margin:0 0 14px;color:var(--ink-2);font-size:.9rem}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-width:140px}
.toolbar .search{flex:1;min-width:180px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}
.tbl th{text-align:left;font-size:.78rem;color:var(--ink-2);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:#fafbfb}
.tbl .who{display:flex;align-items:center;gap:8px}
.tbl .title-cell{font-weight:600}
.tbl .text-cell{color:var(--ink-2);font-size:.84rem;max-width:36ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .actions{white-space:nowrap;text-align:right}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.code{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:1.02rem;letter-spacing:.12em;font-weight:600}
.code.off{text-decoration:line-through;color:var(--ink-3)}

.cat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.cat-row:last-child{border-bottom:0}
.cat-row.picking{border-bottom:0}
.cat-pin{flex:none;width:44px;height:48px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;cursor:pointer}
.cat-pin:hover,.cat-pin[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cat-name{flex:1;min-width:120px;font-weight:600;border-color:transparent;background:transparent}
.cat-name:hover{border-color:var(--line)}
.cat-name:focus{background:#fff}
.icon-picker{padding:10px;margin:0 0 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:#f7f9f9}
.cat-row .count{color:var(--ink-3);font-size:.85rem;white-space:nowrap}

.class-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px;overflow:hidden}
.class-card summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;cursor:pointer;list-style:none}
.class-card summary::-webkit-details-marker{display:none}
.class-card summary h2{margin:0;font-size:1.15rem;font-family:var(--serif)}
.class-card summary .meta{color:var(--ink-2);font-size:.88rem;flex:1}
.class-card .inner{padding:0 18px 18px;border-top:1px solid var(--line-2)}
.class-code-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft)}
.class-code-box .lbl{font-size:.85rem;color:var(--accent-hover)}

.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.thumb-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumb-box img{width:180px;height:130px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--map-bg)}
.link-box{display:flex;gap:8px}
.link-box .input{font-size:.85rem}
.qr-big{display:grid;place-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);margin:12px auto 0;width:max-content}
.qr-big svg{width:220px;height:220px;display:block}
.radio-cards{display:grid;gap:8px}
.radio-card{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin-top:3px;accent-color:var(--accent)}
.radio-card b{display:block}
.radio-card span{font-size:.85rem;color:var(--ink-2)}

.login{display:grid;place-items:center;padding:24px}
.login form{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:26px}
.login h1{font-family:var(--serif);font-weight:600;margin:0 0 6px;font-size:1.6rem}
.login p{color:var(--ink-2);margin:0 0 18px}
@media (max-width:700px){
  .nav a{padding:7px 8px}
  .topbar .brand span{display:none}
  .tbl .text-cell{display:none}
}
</style>
</head>

<header class="topbar">
  <a class="brand" href="#mappe"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="#e8efee"/><path d="M5 19l5-9 4 6 3-4 4 7z" fill="#2c5a66"/><path d="M17.5 3.5c-2.2 0-4 1.7-4 3.9 0 2.9 4 7.1 4 7.1s4-4.2 4-7.1c0-2.2-1.8-3.9-4-3.9z" fill="#b23a2e"/><circle cx="17.5" cy="7.4" r="1.4" fill="#fff"/></svg><span>MapLab</span></a>
  <nav class="nav" id="nav" hidden>
    <a href="#mappe" data-nav="mappe">Mappe</a>
    <a href="#classi" data-nav="classi">Classi e codici</a>
  </nav>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus" hidden></span>
  <button class="btn btn-ghost btn-sm" id="btnLogout" type="button" hidden>Esci</button>
</header>

<main class="content" id="content"></main>

<script>
// ===================== CONFIGURAZIONE =====================
// Indirizzo della Web App di Apps Script (lo stesso di studenti.html).
const WEBAPP_URL = 'INSERISCI_QUI_URL_WEBAPP';
// Indirizzo pubblico di studenti.html (serve per i link e i QR code),
// es. 'https://tuonome.github.io/maplab/studenti.html'.
// Se lasci vuoto e questo pannello è online nella stessa cartella, viene ricavato da solo.
const STUDENT_PAGE_URL = '';
// ==========================================================

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

// ---------- Comunicazione con il server (Apps Script) ----------
async function api(action, params) {
  if (!WEBAPP_URL || /INSERISCI/.test(WEBAPP_URL)) {
    throw new Error("Manca l'indirizzo del server: inserisci WEBAPP_URL in cima al file (vedi ISTRUZIONI).");
  }
  let res;
  try {
    res = await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action }, params || {}))
    });
  } catch (e) {
    throw new Error('Connessione al server non riuscita. Controlla la rete e riprova.');
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error('Il server ha risposto in modo inatteso. Controlla che la Web App sia pubblicata con accesso "Chiunque".');
  }
  if (!data.ok) throw new Error(data.error || 'Errore sconosciuto.');
  return data;
}

// ---------- Salvataggio in sottofondo ----------
// Le modifiche compaiono subito sullo schermo; il server le riceve una alla volta,
// nell'ordine in cui sono state fatte. Se qualcosa va storto, la pagina si
// riallinea con i dati veri del server.
class SyncQueue {
  constructor(opts) {
    this.opts = opts || {};
    this.tasks = [];
    this.busy = false;
    this.failed = false;
    this.lastData = null;
    window.addEventListener('beforeunload', e => {
      if (this.pending) { e.preventDefault(); e.returnValue = ''; }
    });
  }
  get pending() { return this.tasks.length + (this.busy ? 1 : 0); }
  push(task) {
    this.tasks.push(task);
    this._status();
    this._run();
  }
  async _run() {
    if (this.busy) return;
    this.busy = true;
    while (this.tasks.length) {
      const t = this.tasks.shift();
      try {
        const res = await t.run();
        if (res && res.data) this.lastData = res.data;
        if (t.onSuccess) t.onSuccess(res);
      } catch (e) {
        this.failed = true;
        toast((t.label ? t.label + ': ' : '') + e.message, 'err');
        if (t.onError) t.onError(e);
      }
      this._status();
    }
    this.busy = false;
    const result = { failed: this.failed, data: this.lastData };
    this.failed = false;
    this.lastData = null;
    this._status(result.failed);
    if (this.opts.onIdle) await this.opts.onIdle(result);
  }
  _status(failed) { if (this.opts.onStatus) this.opts.onStatus(this.pending, failed); }
}

// Indicatore "Salvataggio… / Salvato" nella barra in alto.
function saveIndicator(el) {
  let timer;
  return (pending, failed) => {
    clearTimeout(timer);
    if (pending) {
      el.hidden = false;
      el.dataset.state = 'saving';
      el.innerHTML = '<span class="dot"></span>Salvataggio…';
    } else if (failed) {
      el.hidden = true;
    } else {
      el.dataset.state = 'saved';
      el.innerHTML = '✓ Salvato';
      timer = setTimeout(() => { el.hidden = true; }, 2200);
    }
  };
}

function newId(len) {
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  const arr = new Uint32Array(len || 12);
  crypto.getRandomValues(arr);
  return Array.from(arr, n => chars[n % chars.length]).join('');
}

function nowIso() { return new Date().toISOString(); }

// Applica localmente i campi del modulo a una puntina (prima che il server risponda).
function applyFieldsLocally(p, fields) {
  ['title', 'text', 'categoryId', 'color', 'authorName'].forEach(k => {
    if (fields[k] !== undefined) p[k] = k === 'title' || k === 'authorName' ? String(fields[k]).trim() : fields[k];
  });
  if (fields.removeImage) p.imageFileId = '';
  if (fields.image) {
    p.imageFileId = 'local-' + newId(8);
    imageCache[p.imageFileId] = 'data:' + fields.image.mime + ';base64,' + fields.image.base64;
  }
  p.updatedAt = nowIso();
  p._pending = true;
  return p;
}

// ---------- Testo ----------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

function fmtDate(iso, withTime) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const opts = { day: 'numeric', month: 'short', year: 'numeric' };
  if (withTime) { opts.hour = '2-digit'; opts.minute = '2-digit'; }
  return d.toLocaleString('it-IT', opts);
}

function initials(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  const a = parts[0][0] || '';
  const b = parts.length > 1 ? parts[parts.length - 1][0] : (parts[0][1] || '');
  return (a + b).toUpperCase();
}

function isLight(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  if (!m) return false;
  const [r, g, b] = [m[1], m[2], m[3]].map(h => {
    const c = parseInt(h, 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.42;
}

// ---------- Immagini ----------
// Ridimensiona e comprime in JPEG prima di inviare, per risparmiare spazio e tempo.
function prepareImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('Il file scelto non è un\'immagine.')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ base64: dataUrl.split(',')[1], mime: 'image/jpeg', w: w, h: h, dataUrl: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Impossibile leggere questa immagine. Prova con un JPG o PNG.')); };
    img.src = url;
  });
}

function driveThumb(fileId, size) {
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w${size}`;
}

// Prova l'anteprima pubblica di Drive; se non funziona (file appena caricato o
// condivisione vietata dal dominio) chiede l'immagine al server.
const imageCache = {};
function loadDriveImage(img, mapId, fileId, size) {
  if (!fileId) return;
  if (imageCache[fileId]) { img.src = imageCache[fileId]; return; }
  let triedFallback = false;
  img.onerror = async () => {
    if (triedFallback) return;
    triedFallback = true;
    try {
      const data = await api('getImage', { mapId: mapId, fileId: fileId });
      imageCache[fileId] = data.dataUrl;
      img.src = data.dataUrl;
    } catch (e) {
      img.alt = 'Immagine non disponibile';
      img.dispatchEvent(new Event('maplab-failed'));
    }
  };
  img.src = driveThumb(fileId, size);
}

// ---------- Avvisi e dialoghi ----------
function toast(msg, kind) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    wrap.setAttribute('role', 'status');
    wrap.setAttribute('aria-live', 'polite');
    document.body.appendChild(wrap);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3500);
}

function makeDialog(html, cls) {
  const d = document.createElement('dialog');
  d.className = 'dlg' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener('close', () => setTimeout(() => d.remove(), 0));
  return d;
}

function confirmBox(message, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const d = makeDialog(`
      <div class="dlg-head"><h2>${esc(opts.title || 'Conferma')}</h2></div>
      <div class="dlg-body"><p style="margin:0 0 8px">${esc(message)}</p></div>
      <div class="dlg-foot">
        <button class="btn btn-ghost" data-no type="button">Annulla</button>
        <button class="btn ${opts.danger ? 'btn-danger' : ''}" data-yes type="button">${esc(opts.ok || 'Conferma')}</button>
      </div>`);
    let answer = false;
    d.querySelector('[data-no]').onclick = () => d.close();
    d.querySelector('[data-yes]').onclick = () => { answer = true; d.close(); };
    d.addEventListener('close', () => resolve(answer));
    d.showModal();
  });
}

function anyDialogOpen() {
  return !!document.querySelector('dialog[open]');
}

// ---------- File da scaricare ----------
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// CSV con punto e virgola e BOM: si apre correttamente con Excel in italiano.
function toCsv(rows) {
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
}

function safeFileName(s) {
  return String(s).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_').slice(0, 60) || 'mappa';
}

// ---------- Chi ha scritto la puntina ----------
function authorInfo(p, classNames, teacherView) {
  const color = p.color || DEFAULT_PIN_COLOR;
  if (p.byTeacher) return { avatar: 'Prof', name: 'Insegnante', sub: '', bg: '#1e2f36', fg: '#fff' };
  const cls = (classNames && classNames[p.classId]) || p.className || '';
  const num = p.codeN != null ? 'Studente n. ' + p.codeN : '';
  const base = { bg: color, fg: inkOn(color) };
  if (p.authorName) {
    const sub = teacherView ? [cls, num || 'codice di classe'].filter(Boolean).join(' — ') : cls;
    return Object.assign(base, { avatar: esc(initials(p.authorName)), name: p.authorName, sub: sub });
  }
  if (p.codeN != null) return Object.assign(base, { avatar: esc(String(p.codeN)), name: num, sub: cls });
  return Object.assign(base, { avatar: ui('users', 20), name: cls ? 'Classe ' + cls : 'Tutta la classe', sub: 'Codice di classe' });
}

// HTML della capsula. actions: [{act, label, icon, cls}]
function capsuleHtml(p, ctx) {
  const a = authorInfo(p, ctx.classNames, ctx.teacherView);
  const cat = catById(ctx.categories, p.categoryId);
  const color = p.color || DEFAULT_PIN_COLOR;
  const catHtml = cat
    ? `<span class="cat-chip"><span class="dot" style="background:${color}">${iconSvg(cat.icon, 13, inkOn(color))}</span>${esc(cat.name)}</span>`
    : '';
  const text = p.text
    ? `<p class="capsule-text">${linkify(p.text)}</p>`
    : `<p class="capsule-text empty">Nessuna descrizione.</p>`;
  const edited = p.updatedAt && p.updatedAt !== p.createdAt ? ` · modificata il ${fmtDate(p.updatedAt, true)}` : '';
  const actions = (ctx.actions || []).map(x =>
    `<button class="btn btn-sm ${x.cls || 'btn-ghost'}" data-act="${x.act}" type="button">${x.icon ? ui(x.icon, 16) : ''}${esc(x.label)}</button>`).join('');
  return `
    <article class="capsule">
      <header class="capsule-author">
        <div class="avatar" style="background:${a.bg};color:${a.fg}">${a.avatar}</div>
        <div>
          <div class="author-name">${esc(a.name)}</div>
          ${a.sub ? `<div class="author-sub">${esc(a.sub)}</div>` : ''}
        </div>
        <button class="btn btn-ghost btn-icon close" data-act="close" type="button" aria-label="Chiudi">${ui('close')}</button>
      </header>
      <div class="capsule-main">
        ${catHtml}
        <h2 class="capsule-title">${esc(p.title)}</h2>
        ${text}
        ${p.imageFileId ? `<figure class="capsule-figure"><img alt="Immagine allegata: ${esc(p.title)}" data-img></figure>` : ''}
      </div>
      <div class="capsule-dates">${p._pending ? '<span class="pending-note">Salvataggio in corso…</span>' : `Aggiunta il ${fmtDate(p.createdAt, true)}${edited}`}</div>
      ${actions ? `<footer class="capsule-foot">${actions}</footer>` : ''}
    </article>`;
}

// Apre la capsula. onAction(act) riceve il nome dell'azione scelta.
function openCapsule(p, ctx, onAction) {
  const d = makeDialog(capsuleHtml(p, ctx));
  const img = d.querySelector('[data-img]');
  if (img) loadDriveImage(img, ctx.mapId, p.imageFileId, 1400);
  d.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (btn) {
      const act = btn.dataset.act;
      d.close();
      if (act !== 'close' && onAction) onAction(act);
    } else if (e.target === d) {
      d.close(); // clic sullo sfondo
    }
  });
  d.showModal();
  return d;
}

// ---------- Modulo per creare/modificare una puntina ----------
// Restituisce una Promise con i campi, oppure null se annullato.
function openPointForm(opts) {
  const p = opts.point || opts.initial || {};
  const cats = opts.categories || [];
  let color = p.color || opts.defaultColor || DEFAULT_PIN_COLOR;
  let categoryId = p.categoryId && catById(cats, p.categoryId) ? p.categoryId : '';
  let newImage = opts.initialImage || null;
  let removeImage = false;
  const hasOldImage = !!p.imageFileId;

  const catButtons = [`<button type="button" class="cat-choice" data-cat="" aria-pressed="${!categoryId}">Nessuna</button>`]
    .concat(cats.map(c => `<button type="button" class="cat-choice" data-cat="${esc(c.id)}" aria-pressed="${c.id === categoryId}">${iconSvg(c.icon, 16)}${esc(c.name)}</button>`)).join('');
  const inPalette = PIN_PALETTE.indexOf(color) !== -1;
  const swatches = PIN_PALETTE.map(c => `<button type="button" class="swatch" data-color="${c}" style="background:${c}" aria-label="Colore ${c}" aria-pressed="${c === color}"></button>`).join('');

  const d = makeDialog(`
    <form method="dialog" novalidate>
      <div class="dlg-head">
        <span class="form-pin-preview" data-preview></span>
        <h2>${opts.point ? 'Modifica puntina' : 'Nuova puntina'}</h2>
      </div>
      <div class="dlg-body">
        <label class="field"><span class="label">Titolo</span>
          <input class="input" name="title" maxlength="120" required value="${esc(p.title || '')}" autocomplete="off"></label>
        ${cats.length ? `<div class="field"><span class="label">Categoria</span><div class="cat-choices">${catButtons}</div></div>` : ''}
        <div class="field"><span class="label">Colore</span>
          <div class="swatches">${swatches}
            <label class="swatch-custom${inPalette ? '' : ' on'}"><input type="color" name="custom" value="${color}" aria-label="Altro colore">Altro</label>
          </div></div>
        <label class="field"><span class="label">Descrizione</span>
          <textarea class="input" name="text" maxlength="3000">${esc(p.text || '')}</textarea></label>
        <div class="field"><span class="label">Immagine (facoltativa)</span>
          <input type="file" name="image" accept="image/*">
          <div class="img-preview" data-imgbox ${hasOldImage || newImage ? '' : 'hidden'}>
            <img data-imgprev alt="Anteprima">
            <button type="button" class="btn btn-sm btn-danger-ghost" data-rmimg>Togli immagine</button>
          </div></div>
        ${opts.askName ? `<label class="field"><span class="label">Il tuo nome (facoltativo)</span>
          <input class="input" name="authorName" maxlength="40" value="${esc(p.authorName != null && (opts.point || opts.initial) ? p.authorName : (opts.nameDefault || ''))}" autocomplete="off">
          <span class="hint">${esc(opts.nameHint || '')}</span></label>` : ''}
        <p class="err" data-err>${esc(opts.errorMsg || '')}</p>
      </div>
      <div class="dlg-foot">
        <button class="btn btn-ghost" value="cancel" type="button" data-cancel>Annulla</button>
        <button class="btn" type="submit" data-save>${opts.point ? 'Salva modifiche' : 'Salva puntina'}</button>
      </div>
    </form>`);

  const form = d.querySelector('form');
  const preview = d.querySelector('[data-preview]');
  const imgBox = d.querySelector('[data-imgbox]');
  const imgPrev = d.querySelector('[data-imgprev]');
  const errEl = d.querySelector('[data-err]');
  const customInput = form.elements.custom;

  function refreshPreview() {
    const cat = catById(cats, categoryId);
    preview.innerHTML = pinSvg(color, cat && cat.icon);
    d.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.color === color)));
    d.querySelectorAll('.cat-choice').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === categoryId)));
    if (customInput.value !== color) customInput.value = color;
    customInput.parentElement.classList.toggle('on', PIN_PALETTE.indexOf(color) === -1);
    if (opts.onStyle) opts.onStyle(color, cat && cat.icon);
  }
  refreshPreview();
  if (newImage) imgPrev.src = newImage.dataUrl;
  else if (hasOldImage) loadDriveImage(imgPrev, opts.mapId, p.imageFileId, 400);

  d.addEventListener('click', e => {
    const sw = e.target.closest('.swatch');
    if (sw) { color = sw.dataset.color; refreshPreview(); return; }
    const cb = e.target.closest('.cat-choice');
    if (cb) { categoryId = cb.dataset.cat; refreshPreview(); return; }
    if (e.target.closest('[data-rmimg]')) {
      newImage = null; removeImage = hasOldImage;
      form.elements.image.value = '';
      imgBox.hidden = true;
      return;
    }
    if (e.target.closest('[data-cancel]')) d.close();
  });
  customInput.addEventListener('input', () => { color = customInput.value.toLowerCase(); refreshPreview(); });
  form.elements.image.addEventListener('change', async () => {
    const file = form.elements.image.files[0];
    if (!file) return;
    errEl.textContent = 'Preparo l\'immagine…';
    try {
      newImage = await prepareImage(file, 1400, 0.82);
      removeImage = false;
      imgPrev.src = newImage.dataUrl;
      imgBox.hidden = false;
      errEl.textContent = '';
    } catch (err) {
      newImage = null;
      form.elements.image.value = '';
      errEl.textContent = err.message;
    }
  });

  return new Promise(resolve => {
    let result = null;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const title = form.elements.title.value.trim();
      if (!title) { errEl.textContent = 'Scrivi un titolo.'; form.elements.title.focus(); return; }
      const fields = {
        title: title,
        text: form.elements.text.value,
        categoryId: categoryId,
        color: color
      };
      if (opts.askName) fields.authorName = form.elements.authorName.value.trim();
      if (newImage) fields.image = { base64: newImage.base64, mime: newImage.mime };
      fields._imageObj = newImage;
      if (removeImage) fields.removeImage = true;
      if (!opts.onSubmit) { result = fields; d.close(); return; }
      const btn = d.querySelector('[data-save]');
      btn.disabled = true;
      btn.textContent = 'Salvataggio…';
      errEl.textContent = '';
      try {
        result = await opts.onSubmit(fields);
        d.close();
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = opts.point ? 'Salva modifiche' : 'Salva puntina';
      }
    });
    d.addEventListener('close', () => resolve(result));
    d.showModal();
    if (!opts.point) setTimeout(() => form.elements.title.focus(), 30);
  });
}

// ---------- Visualizzatore della carta con zoom e spostamento ----------
class MapViewer {
  constructor(el, handlers) {
    this.el = el;
    this.h = handlers || {};
    this.W = 0; this.H = 0;
    this.s = 1; this.tx = 0; this.ty = 0;
    this.fitScale = 1;
    this.atFit = true;
    this.placing = false;
    this.pointers = new Map();
    this.gesture = null;
    this.activeId = null;

    el.classList.add('viewer');
    el.tabIndex = 0;
    el.innerHTML = `
      <div class="stage"><img class="map-img" alt="" draggable="false"><div class="pins"></div></div>
      <div class="viewer-empty" hidden></div>
      <div class="viewer-controls">
        <button type="button" data-z="in" aria-label="Ingrandisci">${ui('plus')}</button>
        <button type="button" data-z="out" aria-label="Rimpicciolisci">${ui('minus')}</button>
        <button type="button" data-z="fit" aria-label="Mostra tutta la carta">${ui('fit')}</button>
      </div>`;
    this.stage = el.querySelector('.stage');
    this.img = el.querySelector('.map-img');
    this.pinsEl = el.querySelector('.pins');
    this.emptyEl = el.querySelector('.viewer-empty');

    el.querySelector('.viewer-controls').addEventListener('click', e => {
      const b = e.target.closest('[data-z]');
      if (!b) return;
      const r = this.el.getBoundingClientRect();
      if (b.dataset.z === 'fit') this.fit(true);
      else this.zoomAt(b.dataset.z === 'in' ? 1.5 : 1 / 1.5, r.width / 2, r.height / 2, true);
    });
    el.addEventListener('pointerdown', e => this._down(e));
    el.addEventListener('pointermove', e => this._move(e));
    el.addEventListener('pointerup', e => this._up(e));
    el.addEventListener('pointercancel', e => this._up(e, true));
    el.addEventListener('wheel', e => {
      if (!this.W) return;
      e.preventDefault();
      const r = this.el.getBoundingClientRect();
      this.zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    el.addEventListener('keydown', e => {
      const step = 60;
      const map = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      if (e.target !== el) return;
      if (map[e.key]) { e.preventDefault(); this.tx += map[e.key][0]; this.ty += map[e.key][1]; this.atFit = false; this._apply(); }
      else if (e.key === '+' || e.key === '=') { const r = el.getBoundingClientRect(); this.zoomAt(1.3, r.width / 2, r.height / 2, true); }
      else if (e.key === '-') { const r = el.getBoundingClientRect(); this.zoomAt(1 / 1.3, r.width / 2, r.height / 2, true); }
    });
    // Tastiera sulle puntine: il clic del mouse è gestito dai gesti, qui solo Invio/Spazio.
    this.pinsEl.addEventListener('click', e => {
      const b = e.target.closest('.pin-btn');
      if (b && e.detail === 0 && this.h.onPinTap) this.h.onPinTap(b.dataset.id);
    });
    if (window.ResizeObserver) {
      new ResizeObserver(() => { if (this.W) { this._computeFit(); if (this.atFit) this.fit(); else this._apply(); } }).observe(el);
    }
  }

  showMessage(text) {
    this.emptyEl.textContent = text;
    this.emptyEl.hidden = !text;
    this.stage.hidden = !!text;
  }

  // Carica l'immagine della carta. w/h servono a impaginare prima del caricamento.
  setImage(mapId, fileId, w, h) {
    this.showMessage('');
    if (w && h) this._setSize(w, h);
    return new Promise(resolve => {
      this.img.onload = () => {
        if (!w || !h || Math.abs(this.img.naturalWidth / this.img.naturalHeight - w / h) > 0.02) {
          this._setSize(this.img.naturalWidth, this.img.naturalHeight);
        }
        resolve(true);
      };
      this.img.addEventListener('maplab-failed', () => { this.showMessage('Non riesco a caricare la carta. Riprova più tardi.'); resolve(false); }, { once: true });
      loadDriveImage(this.img, mapId, fileId, 3000);
    });
  }

  _setSize(w, h) {
    const first = !this.W;
    this.W = w; this.H = h;
    this.stage.style.width = w + 'px';
    this.stage.style.height = h + 'px';
    this._computeFit();
    if (first || this.atFit) this.fit();
  }

  _computeFit() {
    const r = this.el.getBoundingClientRect();
    if (!this.W || !r.width || !r.height) return;
    this.fitScale = Math.min(r.width / this.W, r.height / this.H) * 0.96;
    this.minScale = this.fitScale * 0.7;
    this.maxScale = Math.max(this.fitScale * 8, 2.5);
  }

  fit(animate) {
    const r = this.el.getBoundingClientRect();
    this._computeFit();
    this.s = this.fitScale;
    this.tx = (r.width - this.W * this.s) / 2;
    this.ty = (r.height - this.H * this.s) / 2;
    this.atFit = true;
    this._apply(animate);
  }

  zoomAt(factor, cx, cy, animate) {
    if (!this.W) return;
    const s2 = Math.max(this.minScale, Math.min(this.maxScale, this.s * factor));
    this.tx = cx - (cx - this.tx) * (s2 / this.s);
    this.ty = cy - (cy - this.ty) * (s2 / this.s);
    this.s = s2;
    this.atFit = false;
    this._apply(animate);
  }

  focusPoint(x, y, animate) {
    const r = this.el.getBoundingClientRect();
    this.s = Math.max(this.s, Math.min(this.maxScale, this.fitScale * 2.2));
    this.tx = r.width / 2 - x * this.W * this.s;
    this.ty = r.height / 2 - y * this.H * this.s + 20;
    this.atFit = false;
    this._apply(animate);
  }

  _clamp() {
    const r = this.el.getBoundingClientRect();
    const keep = 80;
    this.tx = Math.min(r.width - keep, Math.max(keep - this.W * this.s, this.tx));
    this.ty = Math.min(r.height - keep, Math.max(keep - this.H * this.s, this.ty));
  }

  _apply(animate) {
    this._clamp();
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (animate && !reduce) {
      this.stage.classList.add('animating');
      clearTimeout(this._animT);
      this._animT = setTimeout(() => this.stage.classList.remove('animating'), 380);
    }
    this.stage.style.transform = `translate(${this.tx}px, ${this.ty}px) scale(${this.s})`;
    this.stage.style.setProperty('--inv', String(1 / this.s));
  }

  setPlacing(on) {
    this.placing = !!on;
    this.el.classList.toggle('placing', this.placing);
  }

  // points: puntine da mostrare; categories per le icone.
  setPins(points, categories) {
    const html = points.map(p => {
      const cat = catById(categories, p.categoryId);
      return `<div class="pin${p.id === this.activeId ? ' is-active' : ''}${p._pending ? ' pending' : ''}" style="left:${p.x * 100}%;top:${p.y * 100}%">
        <button type="button" class="pin-btn" data-id="${esc(p.id)}" title="${esc(p.title)}" aria-label="${esc(p.title)}">${pinSvg(p.color, cat && cat.icon)}</button></div>`;
    }).join('');
    this.pinsEl.innerHTML = html + (this.ghost ? this._ghostHtml() : '');
  }

  setActive(id) {
    this.activeId = id;
    this.pinsEl.querySelectorAll('.pin').forEach(el => {
      const b = el.querySelector('.pin-btn');
      el.classList.toggle('is-active', !!b && b.dataset.id === id);
    });
  }

  showGhost(x, y, color, icon) {
    this.ghost = { x: x, y: y, color: color, icon: icon };
    const old = this.pinsEl.querySelector('.pin.ghost');
    if (old) old.remove();
    this.pinsEl.insertAdjacentHTML('beforeend', this._ghostHtml());
  }

  hideGhost() {
    this.ghost = null;
    const old = this.pinsEl.querySelector('.pin.ghost');
    if (old) old.remove();
  }

  _ghostHtml() {
    const g = this.ghost;
    return `<div class="pin ghost is-active" style="left:${g.x * 100}%;top:${g.y * 100}%"><span class="pin-btn">${pinSvg(g.color, g.icon)}</span></div>`;
  }

  _down(e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('.viewer-controls')) return;
    if (!this.W) return;
    try { this.el.setPointerCapture(e.pointerId); } catch (err) { /* ignorato */ }
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 1) {
      this.gesture = { type: 'pan', x0: e.clientX, y0: e.clientY, tx: this.tx, ty: this.ty, target: e.target, moved: false };
    } else if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      const r = this.el.getBoundingClientRect();
      this.gesture = {
        type: 'pinch', moved: true,
        d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top,
        s: this.s, tx: this.tx, ty: this.ty
      };
    }
  }

  _move(e) {
    if (!this.pointers.has(e.pointerId)) return;
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = this.gesture;
    if (!g) return;
    if (g.type === 'pan' && this.pointers.size === 1) {
      const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
      if (!g.moved && Math.hypot(dx, dy) > 6) { g.moved = true; this.el.classList.add('dragging'); }
      if (g.moved) { this.tx = g.tx + dx; this.ty = g.ty + dy; this.atFit = false; this._apply(); }
    } else if (g.type === 'pinch' && this.pointers.size >= 2) {
      const [a, b] = [...this.pointers.values()];
      const r = this.el.getBoundingClientRect();
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      const s2 = Math.max(this.minScale, Math.min(this.maxScale, g.s * d / g.d0));
      const wx = (g.mx - g.tx) / g.s, wy = (g.my - g.ty) / g.s;
      this.s = s2; this.tx = mx - wx * s2; this.ty = my - wy * s2;
      this.atFit = false;
      this._apply();
    }
  }

  _up(e, cancelled) {
    if (!this.pointers.has(e.pointerId)) return;
    this.pointers.delete(e.pointerId);
    const g = this.gesture;
    if (this.pointers.size === 1 && g && g.type === 'pinch') {
      // Da due dita a una: si continua a spostare, senza tocchi accidentali.
      const [p] = [...this.pointers.values()];
      this.gesture = { type: 'pan', x0: p.x, y0: p.y, tx: this.tx, ty: this.ty, target: null, moved: true };
      return;
    }
    if (this.pointers.size > 0) return;
    this.el.classList.remove('dragging');
    this.gesture = null;
    if (cancelled || !g || g.moved) return;
    // È un tocco semplice.
    const pinBtn = g.target && g.target.closest && g.target.closest('.pin-btn[data-id]');
    if (pinBtn && !this.placing) {
      if (this.h.onPinTap) this.h.onPinTap(pinBtn.dataset.id);
      return;
    }
    const r = this.el.getBoundingClientRect();
    const x = (e.clientX - r.left - this.tx) / (this.W * this.s);
    const y = (e.clientY - r.top - this.ty) / (this.H * this.s);
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    if (this.h.onMapTap) this.h.onMapTap(x, y);
  }
}


// ===================== PANNELLO INSEGNANTE =====================
const $ = id => document.getElementById(id);
const content = $('content');
const S = {
  key: '',
  maps: [],
  classes: [],
  showArchived: false,
  map: null,          // dati della mappa aperta {map, classNames, points}
  mapId: '',
  viewer: null,
  placing: null,
  pointFilter: { classId: '', n: '', cat: '', q: '' }
};

function adm(action, params) {
  return api(action, Object.assign({ adminKey: S.key }, params || {}));
}

// Le modifiche compaiono subito e vengono salvate in sottofondo, una alla volta.
const queue = new SyncQueue({
  onStatus: saveIndicator(document.getElementById('saveStatus')),
  onIdle: async ({ failed, data }) => {
    if (failed) {
      // Qualcosa non è stato salvato: ricarico i dati veri e ridisegno.
      if (S.mapId) {
        try { adoptData(await adm('adminGetMap', { mapId: S.mapId })); } catch (e) { /* niente */ }
        const tab = location.hash.split('/')[2] || 'carta';
        if (location.hash.indexOf('#mappa/' + S.mapId) === 0) renderDetail(tab);
      }
      return;
    }
    if (data && S.map && data.map.id === S.mapId) {
      adoptData(data);
      refreshPins();
      if ($('ptTable')) drawPointTable();
    }
  }
});

// Sostituisce i dati della mappa aperta e aggiorna il riassunto nell'elenco.
function adoptData(data) {
  S.map = data;
  S.mapId = data.map.id;
  syncSummary();
}

function syncSummary() {
  const m = S.map.map;
  const summary = { id: m.id, title: m.title, description: m.description, imageFileId: m.imageFileId, classIds: m.classIds.slice(),
    locked: m.locked, archived: m.archived, pointCount: S.map.points.length, updatedAt: m.updatedAt };
  const i = S.maps.findIndex(x => x.id === m.id);
  if (i === -1) S.maps.unshift(summary); else Object.assign(S.maps[i], summary);
}

// Modifica immediata delle impostazioni della mappa aperta.
function saveMapChanges(changes, label) {
  Object.assign(S.map.map, changes);
  syncSummary();
  const mapId = S.mapId;
  queue.push({ label: label || 'Salvataggio', run: () => adm('updateMap', Object.assign({ mapId: mapId }, changes)) });
}

function studentBase() {
  if (STUDENT_PAGE_URL) return STUDENT_PAGE_URL;
  if (/^https?:/.test(location.protocol)) return new URL('studenti.html', location.href).href.split('#')[0];
  return '';
}
function studentUrl(query) {
  const base = studentBase();
  if (!base) return '';
  const qs = new URLSearchParams(query).toString();
  return base.split('?')[0] + (qs ? '?' + qs : '');
}

function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

function className(id) {
  const c = S.classes.find(x => x.id === id);
  return c ? c.name : '';
}
function classNamesMap() {
  const o = {};
  S.classes.forEach(c => { o[c.id] = c.name; });
  return o;
}

async function withBusy(btn, fn) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Attendi…'; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'err'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

async function doLogin() {
  try {
    const res = await adm('adminLogin');
    try { sessionStorage.setItem('maplab_admin', S.key); } catch (e) { /* niente */ }
    if (res.migrated) toast(`Ho importato la vecchia mappa come "${res.migrated}".`, 'ok');

    S.maps = res.maps;
    $('nav').hidden = false;

    route();
  } catch (e) {
    try { sessionStorage.removeItem('maplab_admin'); } catch (x) { /* niente */ }
    showLogin(e.message);

}

$('btnLogout').onclick = () => {

};

window.addEventListener('hashchange', () => { if (S.key) route(); });

function route() {
  const parts = (location.hash.replace(/^#/, '') || 'mappe').split('/');
  stopPlacing(true);
  if (parts[0] !== 'mappa') S.map = null;
  document.querySelectorAll('[data-nav]').forEach(a => a.setAttribute('aria-current', a.dataset.nav === (parts[0] === 'mappa' ? 'mappe' : parts[0]) ? 'page' : 'false'));
  if (parts[0] === 'classi') return renderClasses();
  if (parts[0] === 'mappa' && parts[1]) return openMap(parts[1], parts[2] || 'carta');
  renderMaps();
}

// L'elenco compare subito con i dati che ho; poi controllo se ci sono novità.
async function refreshMapList() {
  if (queue.pending) return;
  const before = JSON.stringify(S.maps);
  try { await loadMaps(); } catch (e) { return; }
  if (JSON.stringify(S.maps) !== before && (location.hash || '#mappe') === '#mappe' && !anyDialogOpen()) renderMaps();
}

function statusChip(m) {
  if (m.archived) return '<span class="chip muted">Archiviata</span>';
  if (m.locked) return `<span class="chip closed">${ui('lock', 12)}Modifiche chiuse</span>`;
  if (!m.classIds.length) return '<span class="chip muted">Nessuna classe abilitata</span>';
  return '<span class="chip ok">Modifiche aperte</span>';
}

function mapCardHtml(m) {
  const classes = m.classIds.map(className).filter(Boolean);
  return `<a class="map-card${m.archived ? ' archived' : ''}" href="#mappa/${encodeURIComponent(m.id)}">
    ${m.imageFileId ? `<img class="thumb" alt="" data-map="${esc(m.id)}" data-file="${esc(m.imageFileId)}">` : '<span class="thumb"></span>'}
    <span class="body">
      <h3>${esc(m.title)}</h3>
      <span class="btn-row">${statusChip(m)}<span class="chip">${m.pointCount} puntine</span></span>
      <span class="muted" style="font-size:.85rem">${classes.length ? 'Classi: ' + esc(classes.join(', ')) : ''}</span>
    </span></a>`;
}

function classCheckboxes(selected) {
  if (!S.classes.length) return '<p class="notice warn">Non hai ancora creato classi. Puoi farlo in "Classi e codici" e abilitarle dopo.</p>';
  return S.classes.map(c => `<label class="check"><input type="checkbox" name="cls" value="${esc(c.id)}" ${selected.indexOf(c.id) !== -1 ? 'checked' : ''}> ${esc(c.name)} <span class="muted">(${c.codes.length} codici)</span></label>`).join('');
}

function newMapDialog() {
  const d = makeDialog(`<form novalidate>
    <div class="dlg-head"><h2>Nuova mappa</h2></div>
    <div class="dlg-body">
      <label class="field"><span class="label">Titolo</span><input class="input" name="title" maxlength="120" placeholder="es. L'Impero romano nel II secolo"></label>

        <span class="hint">JPG o PNG. Le immagini molto grandi vengono ridotte a 4000 pixel sul lato lungo.</span></label>
      <div class="field"><span class="label">Classi che possono aggiungere puntine</span>${classCheckboxes([])}</div>
      <p class="notice" style="margin:0 0 8px">Ogni nuova mappa parte con tre categorie (Personaggio, Evento, Luogo) che puoi cambiare in seguito.</p>
      <p class="err" data-err></p>

    <div class="dlg-foot"><button class="btn btn-ghost" type="button" data-cancel>Annulla</button><button class="btn" type="submit" data-save>Crea mappa</button></div>
  </form>`);
  const form = d.querySelector('form');
  const err = d.querySelector('[data-err]');
  d.querySelector('[data-cancel]').onclick = () => d.close();
  form.onsubmit = async e => {
    e.preventDefault();
    const title = form.elements.title.value.trim();
    const file = form.elements.image.files[0];
    if (!title) { err.textContent = 'Scrivi un titolo.'; return; }
    if (!file) { err.textContent = 'Scegli l\'immagine della carta.'; return; }
    const btn = d.querySelector('[data-save]');
    btn.disabled = true;
    try {
      err.textContent = 'Preparo l\'immagine…';
      const img = await prepareImage(file, 4000, 0.86);
      err.textContent = 'Carico su Drive… (può volerci qualche secondo)';
      const classIds = [...form.querySelectorAll('input[name=cls]:checked')].map(i => i.value);
      const res = await adm('createMap', {
        title: title, description: form.elements.description.value, classIds: classIds,
        image: { base64: img.base64, mime: img.mime, w: img.w, h: img.h }

      err.textContent = ex.message;
      btn.disabled = false;
    }
  };
  d.showModal();
  form.elements.title.focus();

// ===================== DETTAGLIO MAPPA =====================
async function openMap(mapId, tab) {
  const cached = S.mapId === mapId && S.map;
  if (!cached) {
    content.innerHTML = '<div class="page-inner"><div class="spinner"></div></div>';
    try {
      S.map = await adm('adminGetMap', { mapId: mapId });
      S.mapId = mapId;
      S.pointFilter = { classId: '', n: '', cat: '', q: '' };
    } catch (e) {
      content.innerHTML = `<div class="page-inner"><p class="notice danger">${esc(e.message)}</p><a class="btn btn-ghost" href="#mappe">Torna alle mappe</a></div>`;
      return;
    }
  }
  renderDetail(tab);
  if (cached) syncMap();
}

// Aggiorna la mappa aperta con le novità degli studenti, senza perdere lo zoom.
async function syncMap() {
  if (!S.map || document.hidden || anyDialogOpen() || S.placing || queue.pending) return;
  const before = JSON.stringify(S.map);
  const mapId = S.mapId;
  let fresh;
  try { fresh = await adm('adminGetMap', { mapId: mapId }); } catch (e) { return; }
  if (S.mapId !== mapId || queue.pending || anyDialogOpen() || S.placing) return;
  adoptData(fresh);
  if (JSON.stringify(S.map) === before) return;
  const tab = location.hash.split('/')[2] || 'carta';
  if (tab === 'carta' && $('tviewer')) {
    refreshPins();
    const t = document.querySelector('.tabs a:nth-child(2)');
    if (t) t.textContent = `Puntine (${S.map.points.length})`;
  } else if (tab === 'puntine' && $('ptTable')) {
    renderPointsTab();
    const t = document.querySelector('.tabs a:nth-child(2)');
    if (t) t.textContent = `Puntine (${S.map.points.length})`;
  } else if (tab === 'categorie' && !document.activeElement.closest('#catList')) {
    renderCategoriesTab();
  }
}
setInterval(() => { if (S.key && /^#mappa\//.test(location.hash)) syncMap(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.key && /^#mappa\//.test(location.hash)) syncMap(); });

// ---------- Scheda Carta ----------
function renderMapTab() {
  const body = $('tabBody');
  body.style.overflow = 'hidden';
  body.innerHTML = `<div class="tab-map"><div id="tviewer"></div>
    <div class="map-actions"><button class="btn" id="btnTAdd" type="button">${ui('plus', 20)}Aggiungi puntina</button></div></div>`;
  const m = S.map.map;
  S.viewer = new MapViewer($('tviewer'), {
    onPinTap: id => openTeacherPoint(id),
    onMapTap: (x, y) => onTeacherMapTap(x, y)
  });
  if (m.imageFileId) S.viewer.setImage(S.mapId, m.imageFileId, m.imageW, m.imageH);
  else S.viewer.showMessage('Questa mappa non ha ancora una carta: caricala da Impostazioni.');
  S.viewer.setPins(S.map.points, m.categories);
  $('btnTAdd').onclick = () => startPlacing({ mode: 'add' });
}

function refreshPins() {
  if (S.viewer && $('tviewer')) S.viewer.setPins(S.map.points, S.map.map.categories);
}

function openTeacherPoint(id) {
  const p = S.map.points.find(x => x.id === id);
  if (!p) return;
  S.viewer && S.viewer.setActive(id);
  const d = openCapsule(p, {
    categories: S.map.map.categories, classNames: classNamesMap(), mapId: S.mapId, teacherView: true,
    actions: [
      { act: 'edit', label: 'Modifica', icon: 'edit' },
      { act: 'move', label: 'Sposta', icon: 'move' },
      { act: 'delete', label: 'Elimina', icon: 'trash', cls: 'btn-danger-ghost' }
    ]
  }, act => {
    if (act === 'edit') teacherEdit(p);
    if (act === 'move') startPlacing({ mode: 'move', point: p });
    if (act === 'delete') teacherDelete(p);
  });
  d.addEventListener('close', () => { if (!S.placing && S.viewer) S.viewer.setActive(null); });
}

function startPlacing(mode) {
  if (!S.viewer) return;
  S.placing = mode;
  S.viewer.setPlacing(true);
  $('btnTAdd').hidden = true;
  const banner = document.createElement('div');
  banner.className = 'placing-banner';
  banner.id = 'placingBanner';
  banner.innerHTML = `<span>${mode.mode === 'add' ? 'Clicca il punto della carta dove mettere la puntina' : 'Clicca la nuova posizione'}</span><button class="btn btn-sm" type="button">Annulla</button>`;
  banner.querySelector('button').onclick = () => stopPlacing();
  document.querySelector('.tab-map').appendChild(banner);
}

function stopPlacing(silent) {
  S.placing = null;
  if (S.viewer && $('tviewer')) {
    S.viewer.setPlacing(false);
    S.viewer.hideGhost();
    S.viewer.setActive(null);
  }
  const b = $('placingBanner');
  if (b) b.remove();
  if (!silent && $('btnTAdd')) $('btnTAdd').hidden = false;
}

async function onTeacherMapTap(x, y) {
  const mode = S.placing;
  if (!mode) return;
  const mapId = S.mapId;
  if (mode.mode === 'move') {
    stopPlacing();
    const p = S.map.points.find(q => q.id === mode.point.id);
    if (!p) return;
    p.x = x; p.y = y; p._pending = true;
    refreshPins();
    queue.push({ label: 'Spostamento', run: () => adm('adminUpdatePoint', { mapId: mapId, pointId: p.id, x: x, y: y }) });
    return;
  }
  S.viewer.showGhost(x, y, S.map.map.defaultColor, null);
  await openPointForm({
    categories: S.map.map.categories, defaultColor: S.map.map.defaultColor, mapId: mapId,
    onStyle: (color, icon) => S.viewer.showGhost(x, y, color, icon),
    onSubmit: fields => {
      const { _imageObj, ...send } = fields;
      const id = newId(12);
      const p = applyFieldsLocally({ id: id, x: x, y: y, classId: '', className: '', codeN: null, byTeacher: true, imageFileId: '', authorName: '' }, send);
      p.createdAt = p.updatedAt;
      S.map.points.push(p);
      const localImg = p.imageFileId ? imageCache[p.imageFileId] : null;
      queue.push({
        label: 'Puntina "' + p.title + '"',
        run: () => adm('adminAddPoint', Object.assign({ mapId: mapId, x: x, y: y, pointId: id }, send)),
        onSuccess: res => { if (localImg && res.point.imageFileId) imageCache[res.point.imageFileId] = localImg; }
      });
      return true;
    }
  });
  stopPlacing();
  refreshPins();
}

async function teacherEdit(p) {
  const mapId = S.mapId;
  await openPointForm({
    point: p, categories: S.map.map.categories, defaultColor: S.map.map.defaultColor, mapId: mapId,
    askName: !p.byTeacher, nameHint: 'Il nome mostrato sulla puntina. Vuoto = numero del codice.',
    onSubmit: fields => {
      const { _imageObj, ...send } = fields;
      const cur = S.map.points.find(q => q.id === p.id);
      if (!cur) return true;
      const localImg = send.image ? 'data:' + send.image.mime + ';base64,' + send.image.base64 : null;
      applyFieldsLocally(cur, send);
      afterPointChange();
      queue.push({
        label: 'Modifica',
        run: () => adm('adminUpdatePoint', Object.assign({ mapId: mapId, pointId: p.id }, send)),
        onSuccess: res => { if (localImg && res.point.imageFileId) imageCache[res.point.imageFileId] = localImg; }
      });
      return true;
    }
  });
}

async function teacherDelete(p) {
  const yes = await confirmBox(`Eliminare la puntina "${p.title}"?`, { title: 'Elimina puntina', ok: 'Elimina', danger: true });
  if (!yes) return;
  const mapId = S.mapId;
  S.map.points = S.map.points.filter(q => q.id !== p.id);
  syncSummary();
  afterPointChange();
  queue.push({ label: 'Eliminazione', run: () => adm('adminDeletePoint', { mapId: mapId, pointId: p.id }) });
}

function afterPointChange() {
  const t = document.querySelector('.tabs a:nth-child(2)');
  if (t) t.textContent = `Puntine (${S.map.points.length})`;
  if ($('tviewer')) refreshPins();
  else if ($('ptTable')) renderPointsTab();
}

// ---------- Scheda Puntine ----------
function pointClassKey(p) { return p.byTeacher ? 'teacher' : (p.classId || ''); }

function filteredPoints() {
  const f = S.pointFilter;
  const q = f.q.toLowerCase();
  return S.map.points.filter(p => {
    if (f.classId && pointClassKey(p) !== f.classId) return false;
    if (f.n !== '' && String(p.codeN == null ? 'classe' : p.codeN) !== f.n) return false;
    if (f.cat && (p.categoryId || 'none') !== f.cat) return false;
    if (q && (p.title + ' ' + p.text + ' ' + (p.authorName || '')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
}

function renderPointsTab() {
  const body = $('tabBody');
  const pts = S.map.points;
  const names = classNamesMap();
  const classKeys = [...new Set(pts.map(pointClassKey))];
  const nums = [...new Set(pts.filter(p => !p.byTeacher && (!S.pointFilter.classId || pointClassKey(p) === S.pointFilter.classId)).map(p => p.codeN == null ? 'classe' : String(p.codeN)))]
    .sort((a, b) => (a === 'classe') - (b === 'classe') || Number(a) - Number(b));
  const f = S.pointFilter;
  const cats = S.map.map.categories;
  body.innerHTML = `<div class="page-inner">
    <div class="toolbar">
      <select class="input" id="fClass" aria-label="Classe"><option value="">Tutte le classi</option>
        ${classKeys.map(k => `<option value="${esc(k)}" ${f.classId === k ? 'selected' : ''}>${k === 'teacher' ? 'Insegnante' : esc(names[k] || (pts.find(p => p.classId === k) || {}).className || 'Classe eliminata')}</option>`).join('')}</select>
      <select class="input" id="fNum" aria-label="Numero studente"><option value="">Tutti i numeri</option>
        ${nums.map(n => `<option value="${n}" ${f.n === n ? 'selected' : ''}>${n === 'classe' ? 'Codice di classe' : 'Studente n. ' + n}</option>`).join('')}</select>
      <select class="input" id="fCat" aria-label="Categoria"><option value="">Tutte le categorie</option>
        ${cats.map(c => `<option value="${esc(c.id)}" ${f.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        <option value="none" ${f.cat === 'none' ? 'selected' : ''}>Senza categoria</option></select>
      <input class="input search" id="fQ" type="search" placeholder="Cerca" value="${esc(f.q)}">
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost btn-sm" id="btnCsv" type="button">${ui('download', 16)}Esporta per Excel (CSV)</button>
      <span class="spacer" style="flex:1"></span>
      ${pts.length ? `<button class="btn btn-danger-ghost btn-sm" id="btnClear" type="button">${ui('trash', 16)}Elimina tutte le puntine</button>` : ''}
    </div>
    <div id="ptTable"></div>
  </div>`;
  body.style.overflow = 'auto';
  const rerender = () => renderPointsTab();
  $('fClass').onchange = e => { f.classId = e.target.value; f.n = ''; rerender(); };
  $('fNum').onchange = e => { f.n = e.target.value; rerender(); };
  $('fCat').onchange = e => { f.cat = e.target.value; rerender(); };
  $('fQ').oninput = e => { f.q = e.target.value; drawPointTable(); };
  $('btnCsv').onclick = exportMapCsv;
  $('btnClear') && ($('btnClear').onclick = async () => {
    const yes = await confirmBox(`Eliminare tutte le ${pts.length} puntine di questa mappa? Anche le immagini allegate finiranno nel cestino di Drive.`, { title: 'Elimina tutte le puntine', ok: 'Elimina tutto', danger: true });
    if (!yes) return;
    const mapId = S.mapId;
    S.map.points = [];
    syncSummary();
    renderDetail('puntine');
    queue.push({ label: 'Eliminazione puntine', run: () => adm('clearPoints', { mapId: mapId }) });
  });
  drawPointTable();
}

function drawPointTable() {
  const list = filteredPoints();
  const names = classNamesMap();
  const cats = S.map.map.categories;
  const el = $('ptTable');
  if (!S.map.points.length) { el.innerHTML = '<div class="empty-state">Ancora nessuna puntina su questa mappa.</div>'; return; }
  if (!list.length) { el.innerHTML = '<div class="empty-state">Nessuna puntina corrisponde ai filtri.</div>'; return; }
  el.innerHTML = `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Chi</th><th>Categoria</th><th>Puntina</th><th>Data</th><th></th></tr></thead>
    <tbody>${list.map(p => {
      const a = authorInfo(p, names, true);
      const cat = catById(cats, p.categoryId);
      return `<tr>
        <td><div class="who"><span class="avatar small" style="background:${a.bg};color:${a.fg}">${a.avatar}</span><div><div>${esc(a.name)}</div>${a.sub ? `<div class="muted" style="font-size:.78rem">${esc(a.sub)}</div>` : ''}</div></div></td>
        <td>${cat ? `<span class="btn-row" style="gap:5px">${iconSvg(cat.icon, 15)}${esc(cat.name)}</span>` : '<span class="muted">—</span>'}</td>
        <td><div class="title-cell">${esc(p.title)}${p.imageFileId ? ' ' + ui('image', 14) : ''}</div><div class="text-cell">${esc(p.text)}</div></td>
        <td style="white-space:nowrap">${fmtDate(p.createdAt)}</td>
        <td class="actions"><button class="btn btn-ghost btn-sm" data-open="${esc(p.id)}" type="button">Apri</button>
          <button class="btn btn-danger-ghost btn-sm btn-icon" data-del="${esc(p.id)}" type="button" aria-label="Elimina">${ui('trash', 16)}</button></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
  el.onclick = e => {
    const o = e.target.closest('[data-open]');
    const d = e.target.closest('[data-del]');
    if (o) openTeacherPoint(o.dataset.open);
    if (d) teacherDelete(S.map.points.find(p => p.id === d.dataset.del));
  };
}

function pointRow(p, mapTitle, cats, names) {
  const cat = catById(cats, p.categoryId);
  return [
    mapTitle,
    p.byTeacher ? 'Insegnante' : (names[p.classId] || p.className || ''),
    p.codeN == null ? '' : p.codeN,
    p.byTeacher ? '' : (p.codeN == null ? 'classe' : 'individuale'),
    p.authorName || '',
    cat ? cat.name : '',
    p.title, p.text,
    p.imageFileId ? 'sì' : 'no',
    fmtDate(p.createdAt, true),
    p.updatedAt && p.updatedAt !== p.createdAt ? fmtDate(p.updatedAt, true) : ''
  ];
}
const CSV_HEAD = ['Mappa', 'Classe', 'N. studente', 'Tipo di codice', 'Nome scritto', 'Categoria', 'Titolo', 'Testo', 'Immagine', 'Aggiunta il', 'Modificata il'];

function exportMapCsv() {
  const list = filteredPoints();
  if (!list.length) { toast('Non ci sono puntine da esportare.', 'err'); return; }
  const names = classNamesMap();
  const rows = [CSV_HEAD].concat(list.map(p => pointRow(p, S.map.map.title, S.map.map.categories, names)));
  downloadFile(`MapLab_${safeFileName(S.map.map.title)}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
}

// ---------- Scheda Categorie ----------
// Tutto nella pagina, senza finestre: clic sulla puntina per scegliere l'icona,
// clic sul nome per rinominare. Ogni modifica si salva da sola.
function renderCategoriesTab(focusIndex) {
  const body = $('tabBody');
  body.style.overflow = 'auto';
  const cats = S.map.map.categories;
  const counts = {};
  S.map.points.forEach(p => { counts[p.categoryId] = (counts[p.categoryId] || 0) + 1; });
  const color = S.map.map.defaultColor;
  if (S.catPick != null && !cats[S.catPick]) S.catPick = null;
  body.innerHTML = `<div class="page-inner"><div class="card">
    <h2>Categorie di questa mappa</h2>
    <p class="sub">Clicca sulla puntina per cambiare icona e sul nome per rinominarla. Il colore delle puntine lo scelgono gli studenti.</p>
    <div id="catList">${cats.length ? cats.map((c, i) => `
      <div class="cat-row${S.catPick === i ? ' picking' : ''}">
        <button type="button" class="cat-pin" data-pick="${i}" aria-expanded="${S.catPick === i}" aria-label="Cambia l'icona di ${esc(c.name)}">${pinSvg(color, c.icon)}</button>
        <input class="input cat-name" data-name="${i}" maxlength="40" value="${esc(c.name)}" aria-label="Nome della categoria">
        <span class="count">${counts[c.id] || 0} puntine</span>
        <button class="btn btn-ghost btn-sm btn-icon" data-up="${i}" type="button" aria-label="Sposta su" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn btn-ghost btn-sm btn-icon" data-down="${i}" type="button" aria-label="Sposta giù" ${i === cats.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="btn btn-danger-ghost btn-sm btn-icon" data-del="${i}" type="button" aria-label="Elimina ${esc(c.name)}">${ui('trash', 16)}</button>
      </div>
      ${S.catPick === i ? `<div class="icon-picker"><div class="icon-grid">${Object.keys(ICONS).map(k =>
        `<button type="button" class="icon-opt" data-icon="${k}" aria-pressed="${k === c.icon}" aria-label="${esc(ICONS[k].label)}" title="${esc(ICONS[k].label)}">${iconSvg(k, 22)}</button>`).join('')}</div></div>` : ''}`).join('')
      : '<p class="muted">Nessuna categoria: le puntine avranno solo il colore.</p>'}</div>
    <div class="btn-row" style="margin-top:14px"><button class="btn" id="btnNewCat" type="button">${ui('plus')}Nuova categoria</button></div>
  </div></div>`;

  $('btnNewCat').onclick = () => {
    const list = S.map.map.categories.slice();
    list.push({ id: newId(8), name: 'Nuova categoria', icon: 'map-pin' });
    S.catPick = list.length - 1;
    saveCategories(list, list.length - 1);
  };
  const listEl = $('catList');
  listEl.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const list = S.map.map.categories.slice();
    if (b.dataset.pick !== undefined) {
      const i = Number(b.dataset.pick);
      S.catPick = S.catPick === i ? null : i;
      return renderCategoriesTab();
    }
    if (b.dataset.icon) {
      list[S.catPick] = Object.assign({}, list[S.catPick], { icon: b.dataset.icon });
      S.catPick = null;
      return saveCategories(list);
    }
    if (b.dataset.up || b.dataset.down) {
      const i = Number(b.dataset.up || b.dataset.down);
      const j = b.dataset.up ? i - 1 : i + 1;
      [list[i], list[j]] = [list[j], list[i]];
      if (S.catPick === i) S.catPick = j; else if (S.catPick === j) S.catPick = i;
      return saveCategories(list);
    }
    if (b.dataset.del) {
      const c = list[Number(b.dataset.del)];
      const used = counts[c.id] || 0;
      const yes = await confirmBox(used
        ? `La categoria "${c.name}" è usata da ${used} puntine: resteranno sulla mappa ma senza icona.`
        : `Eliminare la categoria "${c.name}"?`, { title: 'Elimina categoria', ok: 'Elimina', danger: true });
      if (!yes) return;
      list.splice(Number(b.dataset.del), 1);
      S.catPick = null;
      saveCategories(list);
    }
  };
  listEl.addEventListener('change', e => {
    const inp = e.target.closest('[data-name]');
    if (!inp) return;
    const i = Number(inp.dataset.name);
    const cur = S.map.map.categories;
    const name = inp.value.trim();
    if (!name) { inp.value = cur[i].name; return; }
    if (name === cur[i].name) return;
    const list = cur.slice();
    list[i] = Object.assign({}, list[i], { name: name });
    S.map.map.categories = list;
    queueCategories(list);
  });
  listEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('[data-name]')) { e.preventDefault(); e.target.blur(); }
  });
  if (focusIndex != null) {
    const inp = listEl.querySelector(`[data-name="${focusIndex}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }
}

function saveCategories(list, focusIndex) {
  S.map.map.categories = list;
  queueCategories(list);
  renderCategoriesTab(focusIndex);
}

function queueCategories(list) {
  const mapId = S.mapId;
  const copy = list.map(c => ({ id: c.id, name: c.name, icon: c.icon }));
  queue.push({ label: 'Categorie', run: () => adm('updateMap', { mapId: mapId, categories: copy }) });
}

async function deleteMapFlow() {
  const m = S.map.map;
  const yes = await confirmBox(`Eliminare "${m.title}" con tutte le sue ${S.map.points.length} puntine? La cartella della mappa finirà nel cestino di Drive (recuperabile dal cestino per 30 giorni, ma non tornerà nell'elenco di MapLab). Se vuoi solo nasconderla agli studenti, usa "Archivia".`, { title: 'Elimina mappa', ok: 'Elimina la mappa', danger: true });

          <td class="actions">
            <button class="btn btn-sm btn-ghost" data-act="toggle" data-n="${k.n}" type="button">${k.active === false ? 'Riattiva' : 'Disattiva'}</button>
            <button class="btn btn-sm btn-ghost" data-act="regen" data-n="${k.n}" type="button" title="Per un cartellino perso: il numero resta lo stesso">Nuovo codice</button>
