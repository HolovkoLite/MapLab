function bindClassCard(card) {
  const id = card.dataset.class;
  card.addEventListener('toggle', () => { if (card.open) S.openClass = id; else if (S.openClass === id) S.openClass = ''; });
  card.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    e.preventDefault();
    const c = S.classes.find(x => x.id === id);
    const n = b.dataset.n === '' || b.dataset.n === undefined ? null : Number(b.dataset.n);
    const act = b.dataset.act;
    if (act === 'print') return printDialog(c);
    if (act === 'activity') return withBusy(b, () => exportClassActivity(c));
    if (act === 'add') return addCodesDialog(c);
    if (act === 'rename') return renameClassDialog(c);
    if (act === 'delete') return deleteClassFlow(c);
    if (act === 'toggle') {
      const cur = n == null ? c.classCodeActive !== false : c.codes.find(k => k.n === n).active !== false;
      return withBusy(b, async () => {
        S.classes = (await adm('setCodeActive', { classId: id, n: n, active: !cur })).classes;
        S.openClass = id;
        renderClasses();
      });
    }
    if (act === 'regen') {
      const who = n == null ? 'il codice di classe' : `il codice dello studente n. ${n}`;
      const yes = await confirmBox(`Generare un nuovo codice per ${who}? Quello vecchio smetterà subito di funzionare. ${n == null ? '' : 'Le puntine già inserite restano sue.'}`, { title: 'Nuovo codice', ok: 'Genera' });
      if (!yes) return;
      return withBusy(b, async () => {
        S.classes = (await adm('regenerateCode', { classId: id, n: n })).classes;
        S.openClass = id;
        renderClasses();
        toast('Nuovo codice generato.', 'ok');
      });
    }
  });
}

async function deleteClassFlow(c) {
  const yes = await confirmBox(`Eliminare la classe "${c.name}"? Tutti i suoi codici smetteranno di funzionare e la classe verrà tolta dalle mappe. Le puntine già inserite restano. Se pensi di riusarla, esportala prima.`, { title: 'Elimina classe', ok: 'Elimina classe', danger: true });
  if (!yes) return;
  try {
    S.classes = (await adm('deleteClass', { classId: c.id })).classes;
    await loadMaps();
    renderClasses();
    toast('Classe eliminata.', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function exportClassActivity(c) {
  const res = await adm('exportClassActivity', { classId: c.id });
  if (!res.rows.length) { toast(`Nessuna puntina della classe ${c.name} per ora.`); return; }
  const head = ['Mappa', 'N. studente', 'Tipo di codice', 'Nome scritto', 'Categoria', 'Titolo', 'Testo', 'Immagine', 'Aggiunta il', 'Modificata il'];
  const rows = res.rows
    .sort((a, b) => (a.codeN == null) - (b.codeN == null) || (a.codeN - b.codeN) || String(a.createdAt).localeCompare(String(b.createdAt)))
    .map(r => [r.mapTitle, r.codeN == null ? '' : r.codeN, r.codeN == null ? 'classe' : 'individuale', r.authorName || '', r.category, r.title, r.text,
      r.hasImage ? 'sì' : 'no', fmtDate(r.createdAt, true), r.updatedAt && r.updatedAt !== r.createdAt ? fmtDate(r.updatedAt, true) : '']);
  downloadFile(`MapLab_attivita_${safeFileName(c.name)}.csv`, toCsv([head].concat(rows)), 'text/csv;charset=utf-8');
}

function exportClassesJson() {
  const data = { app: 'MapLab', type: 'classi', exportedAt: new Date().toISOString(), classes: S.classes };
  downloadFile('classi-maplab.json', JSON.stringify(data, null, 2), 'application/json');
}

async function importClassesJson(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (ex) { toast('Il file non è un JSON valido.', 'err'); return; }
  const list = Array.isArray(data) ? data : data.classes;
  if (!Array.isArray(list) || !list.length) { toast('Nel file non ho trovato classi.', 'err'); return; }
  const existing = list.filter(c => S.classes.some(x => x.id === c.id)).length;
  const yes = await confirmBox(`Il file contiene ${list.length} ${list.length === 1 ? 'classe' : 'classi'}: ${list.map(c => c.name).join(', ')}.${existing ? ` ${existing} ${existing === 1 ? 'esiste già e verrà sostituita' : 'esistono già e verranno sostituite'} con la versione del file.` : ''}`, { title: 'Importa classi', ok: 'Importa' });
  if (!yes) return;
  try {
    const res = await adm('importClasses', { data: { classes: list } });
    S.classes = res.classes;
    renderClasses();
    toast(`Importazione completata: ${res.added} aggiunte, ${res.replaced} sostituite.`, 'ok');
  } catch (ex) { toast(ex.message, 'err'); }
}

function printDialog(c) {
  const hub = studentUrl({});
  const d = makeDialog(`<form novalidate>
    <div class="dlg-head"><h2>Stampa i codici di ${esc(c.name)}</h2></div>
    <div class="dlg-body">
      <div class="field"><span class="label">Formato</span>
        <div class="radio-cards">
          <label class="radio-card"><input type="radio" name="fmt" value="list" checked><div><b>Elenco</b><span>Una tabella numero → codice, con una colonna vuota per annotare a mano a chi lo consegni.</span></div></label>
          <label class="radio-card"><input type="radio" name="fmt" value="cards"><div><b>Cartellini da ritagliare</b><span>Un cartellino per studente con numero e codice.</span></div></label>
          <label class="radio-card"><input type="radio" name="fmt" value="qr" ${hub ? '' : 'disabled'}><div><b>Cartellini con QR code</b><span>${hub ? 'Inquadrando il QR lo studente entra già col suo codice e vede le mappe della classe.' : 'Non disponibile: indica STUDENT_PAGE_URL in cima a questo file.'}</span></div></label>
        </div></div>
      <label class="check"><input type="checkbox" name="classCode" checked> Includi il codice di classe</label>
      <label class="check"><input type="checkbox" name="inactive"> Includi anche i codici disattivati</label>
      <p class="notice" style="margin-top:12px">Si apre un'anteprima: da lì scegli <b>Stampa</b> e, come stampante, <b>Salva come PDF</b>.</p>
    </div>
    <div class="dlg-foot"><button class="btn btn-ghost" type="button" data-cancel>Annulla</button><button class="btn" type="submit">${ui('print', 16)}Apri anteprima</button></div>
  </form>`);
  const form = d.querySelector('form');
  d.querySelector('[data-cancel]').onclick = () => d.close();
  form.onsubmit = e => {
    e.preventDefault();
    const fmt = form.elements.fmt.value;
    const codes = c.codes.filter(k => form.elements.inactive.checked || k.active !== false);
    const html = printHtml(c, fmt, codes, form.elements.classCode.checked && c.classCodeActive !== false);
    const w = window.open('', '_blank');
    if (!w) { toast('Il browser ha bloccato la nuova finestra: consenti i popup per questa pagina.', 'err'); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    d.close();
  };
  d.showModal();
}

function printHtml(c, fmt, codes, withClassCode) {
  const date = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
  const qrFor = code => qrSvg(studentUrl({ c: code }));
  let body = '';
  if (fmt === 'list') {
    body = `<h1>Codici MapLab — ${esc(c.name)}</h1><p class="meta">Stampato il ${date}</p>
      ${withClassCode ? `<p class="classcode">Codice di classe (solo per aggiungere puntine): <span class="code">${esc(c.classCode)}</span></p>` : ''}
      <table><thead><tr><th style="width:12%">N.</th><th style="width:28%">Codice</th><th>Consegnato a (annotazione a mano)</th></tr></thead>
      <tbody>${codes.map(k => `<tr><td class="n">${k.n}</td><td class="code">${esc(k.code)}</td><td></td></tr>`).join('')}</tbody></table>`;
  } else {
    const qr = fmt === 'qr';
    const card = (label, code, note, isClass) => `<div class="card${qr ? ' qr' : ''}${isClass ? ' cls' : ''}">
      ${qr ? `<div class="qrbox">${qrFor(code)}</div>` : ''}
      <div class="txt"><div class="app">MapLab · ${esc(c.name)}</div><div class="who">${esc(label)}</div><div class="code">${esc(code)}</div><div class="note">${esc(note)}</div></div></div>`;
    const cards = (withClassCode ? [card('Codice di classe', c.classCode, 'Per aggiungere puntine insieme', true)] : [])
      .concat(codes.map(k => card('Studente n. ' + k.n, k.code, qr ? 'Inquadra il QR oppure scrivi il codice' : 'Il tuo codice personale: non condividerlo', false)));
    body = `<div class="grid">${cards.join('')}</div>`;
  }
  return `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Codici ${esc(c.name)} — MapLab</title>
  <style>
    @page{size:A4;margin:12mm}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2529;margin:0;padding:16px}
    .bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;padding:10px 12px;background:#e1ecee;border-radius:8px;font-size:14px}
    .bar button{font:inherit;font-weight:600;padding:8px 14px;border:0;border-radius:6px;background:#2c5a66;color:#fff;cursor:pointer}
    h1{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-size:22px;margin:0 0 2px}
    .meta{color:#55626a;margin:0 0 14px;font-size:13px}
    .code{font-family:ui-monospace,Consolas,"Courier New",monospace;letter-spacing:.14em;font-weight:700}
    .classcode{padding:8px 10px;border:1px solid #c8d3d5;border-radius:6px;font-size:14px}
    .classcode .code{font-size:17px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;border-bottom:2px solid #1d2529;padding:6px 8px;font-size:12px}
    td{border-bottom:1px solid #c8d3d5;padding:9px 8px;height:34px}
    td.n{font-weight:700}
    td.code{font-size:17px}
    tr{break-inside:avoid}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
    .card{border:1px dashed #8a969b;padding:3mm;height:30mm;display:flex;gap:3mm;align-items:center;break-inside:avoid;page-break-inside:avoid;overflow:hidden}
    .card.qr{height:34mm}
    .card.cls{background:#eef3f4}
    .qrbox{flex:none;width:24mm;height:24mm}
    .qrbox svg{width:100%;height:100%;display:block}
    .txt{min-width:0}
    .app{font-size:8pt;color:#55626a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .who{font-size:9.5pt;font-weight:700;margin:.8mm 0;white-space:nowrap}
    .card.cls .who{white-space:normal}
    .card .code{font-size:13pt;white-space:nowrap;letter-spacing:.1em}
    .note{font-size:7pt;line-height:1.25;color:#55626a;margin-top:1mm}
    @media print{.bar{display:none}body{padding:0}}
  </style></head><body>
  <div class="bar"><button onclick="window.print()">Stampa o salva come PDF</button><span>Nella finestra di stampa scegli “Salva come PDF” come stampante.</span></div>
  ${body}
  </body></html>`;
}
